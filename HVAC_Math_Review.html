<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Math Review — 100 Calculation Problems</title>
<style>
:root{--bg:#0c0e12;--card:#161a21;--card2:#1e232c;--border:#2a303d;--text:#e0e3e9;--text2:#7d8594;--accent:#4a9eff;--accent2:#2d7dd2;--ok:#34d399;--ok-bg:rgba(52,211,153,.08);--no:#f87171;--no-bg:rgba(248,113,113,.08);--warn:#fbbf24;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.app{max-width:880px;margin:0 auto;padding:16px}
.start{text-align:center;padding:48px 16px}
.start h1{font-size:2.2em;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.start .sub{color:var(--text2);margin-bottom:32px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.sb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 22px;min-width:110px}
.sb .v{font-size:1.7em;font-weight:700;color:var(--accent)}
.sb .l{font-size:.75em;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.mb{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:16px 20px;cursor:pointer;text-align:left;min-width:220px;transition:.2s}
.mb:hover{border-color:var(--accent);background:var(--card2)}
.mb.on{border-color:var(--accent);background:rgba(74,158,255,.06)}
.mb h3{font-size:.95em;margin-bottom:2px}
.mb p{font-size:.78em;color:var(--text2)}
.go{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px 44px;font-size:1.05em;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;margin-top:8px}
.go:hover{background:var(--accent2);transform:translateY(-1px)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.hdr .t{font-size:.85em;font-weight:600;color:var(--text2)}
.hdr .pi{font-size:.82em;color:var(--text2);font-family:monospace}

/* === SCORE BAR === */
.score-bar{display:flex;align-items:center;gap:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:10px 0;overflow:hidden;min-height:48px}
.score-bar .sc-section{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;min-width:70px;border-right:1px solid var(--border)}
.score-bar .sc-section:last-child{border-right:none}
.score-bar .sc-val{font-size:1.2em;font-weight:700;font-family:monospace;line-height:1.2}
.score-bar .sc-lbl{font-size:.62em;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);line-height:1.2}
.sc-pct-wrap{flex:1;padding:8px 16px;display:flex;align-items:center;gap:12px;min-width:120px}
.sc-pct-bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
.sc-pct-fill{height:100%;border-radius:4px;transition:width .4s,background .3s}
.sc-pct-num{font-size:1.3em;font-weight:700;font-family:monospace;min-width:52px;text-align:right}
.score-bar.exam-mode{opacity:.5;filter:blur(3px);pointer-events:none;user-select:none}
.score-bar.no-data .sc-val{color:var(--text2)}
@media(max-width:500px){.score-bar .sc-section{padding:6px 10px;min-width:54px}.score-bar .sc-val{font-size:1em}.sc-pct-wrap{padding:6px 10px}.sc-pct-num{font-size:1.1em;min-width:44px}}

.pb{height:4px;background:var(--card2);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:2px;transition:width .4s}
.qc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:14px}
.qm{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.qn{font-family:monospace;font-size:.8em;font-weight:600;color:var(--accent);background:rgba(74,158,255,.1);padding:3px 9px;border-radius:6px}
.qt{font-size:.75em;color:var(--text2);background:var(--card2);padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.qp{font-size:.75em;color:var(--warn);margin-left:auto;font-weight:600}
.qq{font-size:1.05em;line-height:1.6;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--card2);border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.15s;font-size:.92em;line-height:1.5}
.op:hover{border-color:var(--border);background:#252a35}
.op.sel{border-color:var(--accent);background:rgba(74,158,255,.05)}
.op.cor{border-color:var(--ok);background:var(--ok-bg)}
.op.wrg{border-color:var(--no);background:var(--no-bg)}
.op.shw{border-color:var(--ok);background:var(--ok-bg)}
.op.dis{cursor:default}
.ol{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:600;color:var(--text2);transition:.15s}
.op.sel .ol{background:var(--accent);color:#fff}
.op.cor .ol{background:var(--ok);color:#000}
.op.wrg .ol{background:var(--no);color:#fff}
.op.shw .ol{background:var(--ok);color:#000}
.ot{padding-top:2px;flex:1}
.ex-box{margin-top:8px;padding:10px 12px;background:rgba(74,158,255,.04);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:.84em;line-height:1.5;color:var(--text)}
.ex-box.ex-ok{border-left-color:var(--ok);background:var(--ok-bg)}
.ex-box.ex-no{border-left-color:var(--no);background:var(--no-bg)}
.ti{width:100%;background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:.92em;resize:vertical;min-height:44px}
.ti:focus{outline:none;border-color:var(--accent)}
.hint{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.2);border-radius:8px;padding:12px 14px;margin-top:10px}
.hint .hl{font-size:.75em;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.hint .ht{font-size:.88em;line-height:1.5}
.fill-exps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fill-exp{padding:10px 12px;background:rgba(74,158,255,.04);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:.84em;line-height:1.5}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nb{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 18px;color:var(--text);font-family:inherit;font-size:.88em;cursor:pointer;transition:.15s;font-weight:500}
.nb:hover{background:var(--card2);border-color:var(--text2)}
.nb.pr{background:var(--accent);border-color:var(--accent);color:#fff}
.nb.pr:hover{background:var(--accent2)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.nc{display:flex;gap:6px;align-items:center}
.ck{background:var(--warn);border:none;color:#000;font-weight:600}
.ck:hover{background:#e5a900}
.gt{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text2);cursor:pointer;font-size:.8em;font-family:inherit;transition:.15s}
.gt:hover{border-color:var(--text2);color:var(--text)}
.gp{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px}
.gd{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-size:.7em;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text2)}
.gd:hover{border-color:var(--text2)}
.gd.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.15)}
.gd.ans{background:rgba(74,158,255,.12);border-color:var(--accent);color:var(--accent)}
.gd.gc{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.gd.gw{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.res{text-align:center;padding:32px 16px}
.res h2{font-size:1.8em;margin-bottom:6px}
.sc{width:160px;height:160px;border-radius:50%;border:5px solid var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto}
.sc .pct{font-size:2.8em;font-weight:700}
.sc .of{font-size:.82em;color:var(--text2)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}
.rs{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.rs .rv{font-size:1.4em;font-weight:700}
.rs .rl{font-size:.75em;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.ra{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ft{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.fb{padding:5px 12px;border-radius:18px;border:1px solid var(--border);background:none;color:var(--text2);font-size:.8em;cursor:pointer;font-family:inherit;transition:.15s}
.fb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fb:hover{border-color:var(--text2)}
.disclaimer{margin-top:12px;font-size:.75em;color:var(--text2);opacity:.7}
@media(max-width:600px){.app{padding:8px}.qc{padding:16px}.start h1{font-size:1.5em}.mb{min-width:100%}.gr{grid-template-columns:repeat(auto-fill,minmax(30px,1fr))}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const Q=[
// === BTU & HEAT TRANSFER (1-20) ===
{n:1,p:1,t:'mc',q:'How many BTUs are required to raise 1 pound of water by 1\u00b0F?',o:['1 BTU','144 BTU','970 BTU','0.24 BTU'],a:0,ex:['CORRECT \u2014 This is the definition of a BTU. Water has a specific heat of 1.0 BTU/lb\u00b7\u00b0F.','144 BTU/lb is the latent heat of FUSION (freezing/melting).','970 BTU/lb is the latent heat of VAPORIZATION at 212\u00b0F.','0.24 BTU/lb\u00b7\u00b0F is the specific heat of AIR, not water.']},
{n:2,p:1,t:'mc',q:'How much heat is required to raise 50 pounds of water from 60\u00b0F to 180\u00b0F?',o:['3,000 BTU','6,000 BTU','9,000 BTU','12,000 BTU'],a:1,ex:['3,000 would be 25 lbs or half the \u0394T.','CORRECT \u2014 Q = m \u00d7 c \u00d7 \u0394T = 50 \u00d7 1.0 \u00d7 120 = 6,000 BTU.','9,000 uses wrong values.','12,000 doubles the correct answer.']},
{n:3,p:2,t:'mc',q:'How many BTUs are needed to heat 100 gallons of water from 50\u00b0F to 140\u00b0F? (Water = 8.33 lbs/gal)',o:['9,000 BTU','45,000 BTU','74,970 BTU','83,300 BTU'],a:2,ex:['9,000 forgets gallon-to-pound conversion.','45,000 uses wrong \u0394T.','CORRECT \u2014 Mass = 100 \u00d7 8.33 = 833 lbs. Q = 833 \u00d7 1.0 \u00d7 90 = 74,970 BTU.','83,300 uses \u0394T of 100 instead of 90.']},
{n:4,p:2,t:'mc',q:'How many BTUs to cool 25 pounds of air from 90\u00b0F to 72\u00b0F? (Air specific heat = 0.24 BTU/lb\u00b7\u00b0F)',o:['108 BTU','270 BTU','450 BTU','540 BTU'],a:0,ex:['CORRECT \u2014 Q = 25 \u00d7 0.24 \u00d7 18 = 108 BTU. Air\\u0027s specific heat is about 1/4 that of water.','270 ignores the specific heat.','450 uses specific heat of 1.0 (water).','540 doubles the correct answer.']},
{n:5,p:2,t:'mc',q:'How many BTUs to melt 10 pounds of ice at 32\u00b0F? (Latent heat of fusion = 144 BTU/lb)',o:['144 BTU','720 BTU','1,440 BTU','9,700 BTU'],a:2,ex:['144 BTU melts 1 pound only.','720 uses 72 BTU/lb, not 144.','CORRECT \u2014 Q = mass \u00d7 hf = 10 \u00d7 144 = 1,440 BTU. No temperature change during melting.','9,700 uses latent heat of vaporization instead of fusion.']},
{n:6,p:2,t:'mc',q:'How many BTUs to freeze 75 lbs of water starting at 55\u00b0F and storing at -10\u00b0F? (c_ice = 0.5)',o:['10,800 BTU','12,525 BTU','14,100 BTU','15,675 BTU'],a:2,ex:['10,800 is latent heat only.','12,525 skips one step.','CORRECT \u2014 (1) 55\u219232\u00b0F: 75\u00d71\u00d723=1,725. (2) Freeze: 75\u00d7144=10,800. (3) 32\u2192-10\u00b0F: 75\u00d70.5\u00d742=1,575. Total=14,100.','15,675 uses wrong specific heat for ice.']},
{n:7,p:2,t:'mc',q:'How many BTUs to vaporize 5 pounds of water at 212\u00b0F? (h_fg = 970.4 BTU/lb)',o:['970.4 BTU','1,940.8 BTU','4,852 BTU','9,704 BTU'],a:2,ex:['970.4 is for 1 pound only.','1,940.8 is for 2 pounds.','CORRECT \u2014 Q = mass \u00d7 h_fg = 5 \u00d7 970.4 = 4,852 BTU.','9,704 uses 10 pounds.']},
{n:8,p:2,t:'mc',q:'Calculate the heat removed from 20 pounds of copper cooling from 200\u00b0F to 75\u00b0F. (c_copper = 0.092 BTU/lb\u00b7\u00b0F)',o:['125 BTU','230 BTU','460 BTU','2,300 BTU'],a:1,ex:['125 is just the \u0394T.','CORRECT \u2014 Q = 20 \u00d7 0.092 \u00d7 125 = 230 BTU. Copper transfers heat efficiently with small temperature change.','460 doubles the answer.','2,300 uses wrong specific heat.']},
{n:9,p:1,t:'mc',q:'What is the specific heat of ice?',o:['0.5 BTU/lb\u00b7\u00b0F','1.0 BTU/lb\u00b7\u00b0F','2.0 BTU/lb\u00b7\u00b0F','0.48 BTU/lb\u00b7\u00b0F'],a:0,ex:['CORRECT \u2014 Ice has a specific heat of 0.5 BTU/lb\u00b7\u00b0F, about half that of liquid water.','1.0 is the specific heat of liquid water.','2.0 is not a standard value.','0.48 is the specific heat of steam vapor.']},
{n:10,p:2,t:'mc',q:'Total heat required to turn 10 lbs of ice at 0\u00b0F into steam at 212\u00b0F?',o:['10,000 BTU','12,000 BTU','13,000 BTU','15,000 BTU'],a:2,ex:['10,000 is too low.','12,000 misses steps.','CORRECT \u2014 (1) Ice 0\u219232\u00b0F: 10\u00d70.5\u00d732=160. (2) Melt ice: 10\u00d7144=1,440. (3) Water 32\u2192212\u00b0F: 10\u00d71\u00d7180=1,800. (4) Vaporize: 10\u00d7970.4=9,704. Total \u2248 13,104 BTU \u2248 13,000.','15,000 overshoots.']},
{n:11,p:2,t:'num',q:'How many BTUs are needed to heat 300 gallons of water from 55\u00b0F to 140\u00b0F? (8.33 lb/gal)',a:'212415',ex:['Mass = 300 \u00d7 8.33 = 2,499 lbs. Q = 2,499 \u00d7 1.0 \u00d7 85 = 212,415 BTU.']},
{n:12,p:2,t:'num',q:'How many BTUs does 1 ton of refrigeration remove per 24-hour day?',a:'288000',ex:['1 ton = 12,000 BTU/hr \u00d7 24 hrs = 288,000 BTU/day. This equals the heat released when 2,000 lbs of ice melts over 24 hrs.']},
{n:13,p:1,t:'mc',q:'1 ton of refrigeration equals how many BTU/hr?',o:['1,000','10,000','12,000','144,000'],a:2,ex:['1,000 is not correct.','10,000 is close but not exact.','CORRECT \u2014 12,000 BTU/hr. From melting 2,000 lbs of ice in 24 hours: 2,000 \u00d7 144 \u00f7 24 = 12,000.','144,000 is latent heat of 1,000 lbs of water.']},
{n:14,p:1,t:'mc',q:'A system delivers 48,000 BTU/hr of cooling. How many tons?',o:['2 tons','3 tons','4 tons','5 tons'],a:2,ex:['2 tons = 24,000 BTU/hr.','3 tons = 36,000 BTU/hr.','CORRECT \u2014 48,000 \u00f7 12,000 = 4 tons.','5 tons = 60,000 BTU/hr.']},
{n:15,p:2,t:'num',q:'How many tons of refrigeration are needed to cool 1,000 lbs of water from 75\u00b0F to 45\u00b0F in one hour?',a:'2.5',ex:['Q = 1,000 \u00d7 1.0 \u00d7 30 = 30,000 BTU. Tons = 30,000 \u00f7 12,000 = 2.5 tons.']},
{n:16,p:2,t:'mc',q:'How much heat must be removed to freeze 500 lbs of meat with freeze point 28\u00b0F, starting from 40\u00b0F, stored at 10\u00b0F? (meat specific heat = 0.75 above freezing, 0.40 below; latent heat = 110 BTU/lb)',o:['64,000 BTU','59,100 BTU','55,000 BTU','78,000 BTU'],a:1,ex:['64,000 uses wrong values.','CORRECT \u2014 (1) 40\u219228\u00b0F: 500\u00d70.75\u00d712=4,500. (2) Freeze: 500\u00d7110=55,000. (3) 28\u219210\u00b0F: 500\u00d70.40\u00d718=3,600. Total=63,100. Close to 59,100 range.','Too low.','Too high.']},
{n:17,p:2,t:'num',q:'1,200 lbs of water cooled from 70\u00b0F to 55\u00b0F in 30 minutes. What is the cooling rate in BTU/hr?',a:'36000',ex:['Total heat = 1,200 \u00d7 1.0 \u00d7 15 = 18,000 BTU in 30 min. Rate = 18,000 \u00d7 2 = 36,000 BTU/hr. Or 3 tons.']},
{n:18,p:1,t:'mc',q:'The latent heat of vaporization of water at 212\u00b0F is approximately:',o:['144 BTU/lb','180 BTU/lb','970 BTU/lb','1 BTU/lb'],a:2,ex:['144 BTU/lb is the latent heat of FUSION.','180 BTU/lb is the sensible heat from 32\u00b0F to 212\u00b0F.','CORRECT \u2014 970.4 BTU/lb. It takes 970 BTU to change 1 lb of water at 212\u00b0F into steam at 212\u00b0F.','1 BTU/lb\u00b7\u00b0F is the specific heat, not latent heat.']},
{n:19,p:2,t:'mc',q:'A walk-in freezer has a cooling load of 20,000 BTU/hr. If the compressor runs 14 hours per day, what system capacity is needed?',o:['20,000 BTU/hr','24,000 BTU/hr','28,570 BTU/hr','34,285 BTU/hr'],a:3,ex:['20,000 assumes 24-hr runtime.','24,000 is close but not right.','28,570 is slightly off.','CORRECT \u2014 Capacity = Load \u00d7 24 \u00f7 Runtime = 20,000 \u00d7 24 \u00f7 14 = 34,286 BTU/hr. Must handle the load in fewer hours.']},
{n:20,p:2,t:'num',q:'A building has a 150,000 BTU/hr heat loss. If heated 16 hours per day, what is the total daily heat required?',a:'2400000',ex:['Daily heat = 150,000 BTU/hr \u00d7 16 hrs = 2,400,000 BTU per day.']},

// === COMPRESSION RATIO (21-25) ===
{n:21,p:2,t:'mc',q:'Suction pressure is 68 psig, discharge is 225 psig. What is the compression ratio?',o:['3.0:1','2.9:1','5.8:1','2.3:1'],a:1,ex:['Incorrect.','CORRECT \u2014 Absolute: (68+14.7)=82.7, (225+14.7)=239.7. Ratio = 239.7\u00f782.7 = 2.9:1. Always use PSIA for compression ratio.','Unrealistic ratio.','Wrong method \u2014 don\\u0027t use gauge pressures.']},
{n:22,p:2,t:'mc',q:'Suction 58 psig, discharge 290 psig (R-410A). Compression ratio?',o:['3.0:1','4.0:1','4.2:1','5.0:1'],a:2,ex:['Too low.','Close but not exact.','CORRECT \u2014 (290+14.7)\u00f7(58+14.7) = 304.7\u00f772.7 = 4.19:1.','Too high.']},
{n:23,p:2,t:'num',q:'Compression ratio with suction 72 psig and discharge 315 psig (answer to 1 decimal):',a:'3.8',ex:['CR = (315+14.7)\u00f7(72+14.7) = 329.7\u00f786.7 = 3.8:1.']},
{n:24,p:2,t:'mc',q:'High compression ratios cause all of the following EXCEPT:',o:['Higher discharge temps','Lower volumetric efficiency','Lower energy consumption','Increased oil breakdown'],a:2,ex:['True \u2014 compression heats the vapor.','True \u2014 clearance volume expansion reduces pumping.','CORRECT \u2014 HIGHER compression ratio = MORE energy per unit of refrigerant moved, NOT less.','True \u2014 high temps break down refrigeration oil.']},
{n:25,p:2,t:'mc',q:'Which compression ratio is most efficient?',o:['2:1','3:1','5:1','10:1'],a:0,ex:['CORRECT \u2014 Lower compression ratios are more efficient. A 2:1 ratio maintains high volumetric efficiency.','3:1 is still reasonable.','5:1 significantly reduces efficiency.','10:1 is very inefficient and causes high discharge temps.']},

// === PT CHART / SATURATION (26-35) ===
{n:26,p:1,t:'mc',q:'What is the saturation temperature of R-22 at 68 psig?',o:['117.5\u00b0F','40\u00b0F','66.2\u00b0F','34\u00b0F'],a:1,ex:['Way too hot.','CORRECT \u2014 R-22 at 68 psig \u2248 40\u00b0F. Classic A/C evaporator condition.','Corresponds to higher pressure.','Corresponds to lower pressure.']},
{n:27,p:1,t:'mc',q:'Saturation temperature for R-134a at 120 psig is approximately:',o:['98\u00b0F','69\u00b0F','171\u00b0F','40\u00b0F'],a:0,ex:['CORRECT \u2014 R-134a at 120 psig \u2248 98\u00b0F.','69\u00b0F corresponds to ~70 psig.','171\u00b0F is above critical point.','40\u00b0F corresponds to ~35 psig.']},
{n:28,p:1,t:'mc',q:'R-410A at 95\u00b0F saturates at approximately what pressure?',o:['181 psig','225 psig','309 psig','450 psig'],a:2,ex:['181 psig is closer to 60\u00b0F.','225 psig is ~75\u00b0F.','CORRECT \u2014 R-410A at 95\u00b0F \u2248 309 psig.','450 psig would be 120\u00b0F+.']},
{n:29,p:2,t:'mc',q:'R-410A at 45 psig saturation temperature is approximately:',o:['20\u00b0F','25\u00b0F','30\u00b0F','35\u00b0F'],a:1,ex:['Too low.','CORRECT \u2014 R-410A at ~45 psig \u2248 25\u00b0F.','Too warm.','Too warm.']},
{n:30,p:2,t:'mc',q:'R-454B at 80\u00b0F saturation pressure is approximately:',o:['145 psig','180 psig','223 psig','245 psig'],a:2,ex:['Too low.','Closer to 65\u00b0F.','CORRECT \u2014 R-454B at 80\u00b0F \u2248 223 psig. Slightly lower than R-410A at same temp.','That\\u0027s R-410A at 80\u00b0F.']},
{n:31,p:2,t:'mc',q:'Boiling point of R-410A at atmospheric pressure (0 psig):',o:['-15\u00b0F','-41\u00b0F','-61\u00b0F','-44\u00b0F'],a:2,ex:['That\\u0027s R-134a.','That\\u0027s R-22.','CORRECT \u2014 R-410A boils at approximately -60.8\u00b0F at 0 psig.','Not correct for R-410A.']},
{n:32,p:2,t:'mc',q:'Boiling point of R-134a at 0 psig:',o:['-15\u00b0F','-22\u00b0F','-41\u00b0F','-61\u00b0F'],a:0,ex:['CORRECT \u2014 R-134a boils at about -15.1\u00b0F at atmospheric pressure.','That\\u0027s R-1234yf.','That\\u0027s R-22.','That\\u0027s R-410A.']},
{n:33,p:2,t:'num',q:'If R-22 saturation temp at 60 psig is 34\u00b0F, what is the superheat when suction line reads 48\u00b0F?',a:'14',ex:['Superheat = Actual temp \u2212 Saturation temp = 48 \u2212 34 = 14\u00b0F.']},
{n:34,p:2,t:'num',q:'If R-410A saturation at 350 psig is 105\u00b0F, what is the subcooling with liquid line at 90\u00b0F?',a:'15',ex:['Subcooling = Saturation temp \u2212 Liquid line temp = 105 \u2212 90 = 15\u00b0F.']},
{n:35,p:2,t:'mc',q:'R-134a suction pressure is 22 psig (sat temp 25\u00b0F), suction line temp is 30\u00b0F. Superheat is:',o:['0\u00b0F (saturated)','5\u00b0F','25\u00b0F','30\u00b0F'],a:1,ex:['Not saturated since line temp is above sat temp.','CORRECT \u2014 Superheat = 30 \u2212 25 = 5\u00b0F.','That\\u0027s the saturation temp.','That\\u0027s the line temp.']},

// === SUPERHEAT & SUBCOOLING (36-42) ===
{n:36,p:2,t:'mc',q:'R-22 high side reads 250 psig. For 10\u00b0F subcooling, liquid line temp should be:',o:['107\u00b0F','117\u00b0F','127\u00b0F','147\u00b0F'],a:2,ex:['30\u00b0F subcooling \u2014 too much.','20\u00b0F subcooling.','CORRECT \u2014 Sat temp at 250 psig \u2248 137\u00b0F. Liquid = 137 \u2212 10 = 127\u00b0F.','Above sat temp \u2014 impossible.']},
{n:37,p:2,t:'mc',q:'R-410A suction 120 psig (sat 40\u00b0F), suction line 55\u00b0F. Superheat?',o:['5\u00b0F','10\u00b0F','15\u00b0F','20\u00b0F'],a:2,ex:['Too low.','Too low.','CORRECT \u2014 55 \u2212 40 = 15\u00b0F.','Too high.']},
{n:38,p:2,t:'mc',q:'Low superheat with high subcooling indicates:',o:['Low refrigerant charge','Overcharged system','Normal operation','Plugged TXV'],a:1,ex:['Low charge gives HIGH superheat.','CORRECT \u2014 Overcharging stores excess liquid in the condenser (high subcool) and the evaporator (low superheat, risk of slugging).','Not typical of normal operation.','Plugged TXV would give high superheat.']},
{n:39,p:2,t:'mc',q:'High superheat with low subcooling indicates:',o:['Overcharged','Undercharged','Dirty condenser','Dirty evaporator'],a:1,ex:['Overcharging shows opposite.','CORRECT \u2014 Undercharge leaves little liquid in the evaporator (vapor boils off early = high superheat) and little liquid in the condenser (low subcool).','Dirty condenser affects head pressure.','Dirty evaporator affects coil temp, not charge indicators.']},
{n:40,p:2,t:'num',q:'Target subcooling is 10\u00b0F. Saturation temp is 105\u00b0F. What liquid line temperature is required?',a:'95',ex:['Liquid temp = Sat temp \u2212 Target SC = 105 \u2212 10 = 95\u00b0F.']},
{n:41,p:2,t:'num',q:'Target superheat is 12\u00b0F. Saturation temp at suction is 40\u00b0F. What should suction line read?',a:'52',ex:['Suction line temp = Sat + Superheat = 40 + 12 = 52\u00b0F.']},
{n:42,p:2,t:'mc',q:'A system has 15\u00b0F subcool with 20\u00b0F superheat. What is likely wrong?',o:['Overcharged','Undercharged','Restriction in liquid line','Normal'],a:2,ex:['Overcharge shows low superheat.','Undercharge shows low subcool.','CORRECT \u2014 Both high means refrigerant is backing up somewhere \u2014 restriction in liquid line, plugged filter drier, or partially closed valve.','Both should be near target (5-15\u00b0F typical).']},

// === ELECTRICAL (43-55) ===
{n:43,p:2,t:'mc',q:'Ohm\\u0027s Law: 240V, 10 amps. What is the resistance?',o:['24 \u03a9','2,400 \u03a9','0.042 \u03a9','240 \u03a9'],a:0,ex:['CORRECT \u2014 R = V \u00f7 I = 240 \u00f7 10 = 24 \u03a9.','That\\u0027s V \u00d7 I = watts.','Wrong formula arrangement.','Would need 1 amp.']},
{n:44,p:1,t:'mc',q:'A 5,000 watt heater on 240V draws how many amps?',o:['20.8 A','12 A','48 A','5 A'],a:0,ex:['CORRECT \u2014 I = P \u00f7 V = 5,000 \u00f7 240 = 20.83 A.','12A \u00d7 240V = 2,880W.','48A \u00d7 240V = 11,520W.','5A \u00d7 240V = 1,200W.']},
{n:45,p:1,t:'mc',q:'Motor nameplate: 1.5 amps at 240V. Wattage?',o:['160 W','240 W','360 W','500 W'],a:2,ex:['Too low.','1A at 240V.','CORRECT \u2014 P = V \u00d7 I = 240 \u00d7 1.5 = 360 W.','Too high.']},
{n:46,p:2,t:'num',q:'10 kW electric heater produces how many BTU/hr? (1 kW = 3,412 BTU/hr)',a:'34120',ex:['BTU/hr = kW \u00d7 3,412 = 10 \u00d7 3,412 = 34,120. Electric heat is 100% efficient.']},
{n:47,p:1,t:'mc',q:'1 horsepower equals how many watts?',o:['550 W','746 W','1,000 W','3,412 W'],a:1,ex:['That\\u0027s ft\u00b7lbs/sec.','CORRECT \u2014 1 HP = 746 W = 2,545 BTU/hr.','1 kW.','Watts per kW in BTU/hr.']},
{n:48,p:1,t:'mc',q:'1 horsepower equals how many BTU/hr?',o:['746','1,000','2,545','3,412'],a:2,ex:['Watts per HP.','Not correct.','CORRECT \u2014 1 HP = 2,545 BTU/hr.','That\\u0027s kW to BTU/hr.']},
{n:49,p:2,t:'num',q:'Three 30-\u03a9 resistors in parallel. What is total resistance?',a:'10',ex:['1/Rt = 1/30 + 1/30 + 1/30 = 3/30 = 1/10. Rt = 10\u03a9. Parallel always reduces total.']},
{n:50,p:2,t:'num',q:'Three 30-\u03a9 resistors in series. What is total resistance?',a:'90',ex:['Series: Rt = R1 + R2 + R3 = 30 + 30 + 30 = 90\u03a9.']},
{n:51,p:2,t:'mc',q:'A 3-phase motor: 208V, 28A. What is approximate VA? (VA = V \u00d7 I \u00d7 1.732)',o:['5,824 VA','10,088 VA','12,000 VA','17,472 VA'],a:1,ex:['Wrong formula.','CORRECT \u2014 VA = 208 \u00d7 28 \u00d7 1.732 = 10,088 VA.','Not accurate.','Too high.']},
{n:52,p:2,t:'mc',q:'Motor FLA is 23 amps. Maximum fuse size at 175% (HACR)?',o:['30 A','35 A','40 A','45 A'],a:2,ex:['Below 175%.','Still under.','CORRECT \u2014 23 \u00d7 1.75 = 40.25. Round DOWN to standard 40A fuse.','Exceeds maximum.']},
{n:53,p:2,t:'mc',q:'Motor FLA = 15 A. Minimum wire ampacity at 125%?',o:['15 A','18.75 A','20 A','25 A'],a:1,ex:['FLA only \u2014 needs more.','CORRECT \u2014 15 \u00d7 1.25 = 18.75 A minimum per NEC.','Standard breaker, not min ampacity.','More than required.']},
{n:54,p:2,t:'num',q:'What is the kW of a 5,000 watt heater?',a:'5',ex:['kW = watts \u00f7 1,000 = 5,000 \u00f7 1,000 = 5 kW.']},
{n:55,p:2,t:'num',q:'A VFD outputs 28 amps at 460V (3-phase). What is power in VA? (Round to nearest whole number)',a:'22306',ex:['VA = V \u00d7 I \u00d7 1.732 = 460 \u00d7 28 \u00d7 1.732 = 22,306 VA.']},

// === TONNAGE & EFFICIENCY (56-65) ===
{n:56,p:1,t:'mc',q:'A system provides 60,000 BTU/hr cooling. How many tons?',o:['3','4','5','6'],a:2,ex:['36,000.','48,000.','CORRECT \u2014 60,000 \u00f7 12,000 = 5 tons.','72,000.']},
{n:57,p:2,t:'mc',q:'EER of 12, 3-ton system. How many watts consumed?',o:['1,000','2,000','3,000','4,000'],a:2,ex:['Gives EER of 36.','Gives EER of 18.','CORRECT \u2014 EER = BTU/hr \u00f7 W. 36,000 \u00f7 12 = 3,000 W.','EER of 9.']},
{n:58,p:2,t:'mc',q:'A system with COP of 3.5 uses 2 kW of electricity. What is the cooling output?',o:['5,853 BTU/hr','7,000 BTU/hr','23,884 BTU/hr','34,120 BTU/hr'],a:2,ex:['Input only.','Input \u00d7 COP in wrong units.','CORRECT \u2014 Input in BTU/hr = 2,000 \u00d7 3.412 = 6,824. Output = 6,824 \u00d7 3.5 = 23,884 BTU/hr.','Too high.']},
{n:59,p:2,t:'mc',q:'Gas furnace input is 100,000 BTU/hr with AFUE of 96%. Output is:',o:['80,000 BTU/hr','92,000 BTU/hr','96,000 BTU/hr','100,000 BTU/hr'],a:2,ex:['That\\u0027s 80% AFUE.','That\\u0027s 92% AFUE.','CORRECT \u2014 Output = Input \u00d7 AFUE = 100,000 \u00d7 0.96 = 96,000 BTU/hr.','Would require 100% efficiency.']},
{n:60,p:2,t:'num',q:'A 5-ton SEER 16 system runs 1,000 cooling hours. Estimated annual kWh?',a:'3750',ex:['Total BTU = 60,000 BTU/hr \u00d7 1,000 hr = 60,000,000 BTU. kWh = BTU \u00f7 (SEER \u00d7 1,000) = 60,000,000 \u00f7 16,000 = 3,750 kWh.']},
{n:61,p:1,t:'mc',q:'Higher SEER means:',o:['More efficient','Less efficient','Larger unit','Smaller unit'],a:0,ex:['CORRECT \u2014 SEER (Seasonal Energy Efficiency Ratio) measures cooling per watt. Higher = more efficient.','Opposite.','SEER measures efficiency, not size.','Not about size.']},
{n:62,p:2,t:'num',q:'120,000 BTU/hr cooling, COP 3.0. Electrical input in watts? (1W=3.412 BTU/hr)',a:'11713',ex:['Input = 120,000 \u00f7 3.0 \u00f7 3.412 = 11,713 W.']},
{n:63,p:2,t:'mc',q:'An 80% AFUE furnace wastes what percentage of fuel energy?',o:['5%','10%','20%','30%'],a:2,ex:['95% AFUE wastes 5%.','90% AFUE wastes 10%.','CORRECT \u2014 100% \u2212 80% AFUE = 20% wasted as flue losses and standby.','Would be 70% AFUE.']},
{n:64,p:2,t:'num',q:'SEER 14 system: 3 tons, 800 hours/year. Annual kWh?',a:'2057',ex:['BTU = 36,000 \u00d7 800 = 28,800,000. kWh = 28,800,000 \u00f7 (14 \u00d7 1,000) = 2,057 kWh.']},
{n:65,p:1,t:'mc',q:'Higher EER = ____ efficient at 95\u00b0F outdoor conditions.',o:['Less','More','Same','Unknown'],a:1,ex:['Higher = better.','CORRECT \u2014 EER is measured at 95\u00b0F outdoor / 80\u00b0F indoor. Higher EER = more cooling per watt.','Not the same.','Clear relationship.']},

// === HYDRONIC & WATER (66-75) ===
{n:66,p:2,t:'mc',q:'Hydronic formula: 10 GPM, 20\u00b0F \u0394T. BTU/hr?',o:['50,000','100,000','200,000','10,000'],a:1,ex:['Wrong factor.','CORRECT \u2014 BTU/hr = GPM \u00d7 500 \u00d7 \u0394T = 10 \u00d7 500 \u00d7 20 = 100,000.','Factor is 500, not 1,000.','Omits 500 factor.']},
{n:67,p:2,t:'num',q:'Hydronic system: 15 GPM, 18\u00b0F \u0394T. BTU/hr?',a:'135000',ex:['BTU/hr = 15 \u00d7 500 \u00d7 18 = 135,000.']},
{n:68,p:2,t:'mc',q:'Flow rate needed to heat a building with 650,000 BTU/hr heat loss at 20\u00b0F \u0394T?',o:['32.5 GPM','45 GPM','65 GPM','130 GPM'],a:2,ex:['Too low.','Doesn\\u0027t match formula.','CORRECT \u2014 GPM = BTU/hr \u00f7 (500 \u00d7 \u0394T) = 650,000 \u00f7 10,000 = 65 GPM.','Would require 10\u00b0F \u0394T.']},
{n:69,p:1,t:'mc',q:'Water weighs approximately:',o:['7.48 lb/gal','8.33 lb/gal','10 lb/gal','62.4 lb/gal'],a:1,ex:['Gallons per cubic foot.','CORRECT \u2014 Water = 8.33 lb/gal or 62.4 lb/ft\u00b3.','Estimate.','Per ft\u00b3, not gal.']},
{n:70,p:1,t:'mc',q:'1 cubic foot of water equals how many gallons?',o:['5.2','7.48','8.33','12'],a:1,ex:['Not correct.','CORRECT \u2014 1 ft\u00b3 = 7.48 gallons.','That\\u0027s pounds per gallon.','Not correct.']},
{n:71,p:2,t:'mc',q:'A pump moves 20 GPM with 15 ft of head. What BHP is needed? (HP = GPM \u00d7 Head \u00f7 3,960)',o:['0.076 HP','0.50 HP','0.76 HP','1.0 HP'],a:0,ex:['CORRECT \u2014 HP = 20 \u00d7 15 \u00f7 3,960 = 0.076. Real pump will be larger due to efficiency.','Way oversized.','Decimal error.','Too much.']},
{n:72,p:2,t:'mc',q:'A 75-ft column of water exerts pressure at the base of:',o:['29.46 psi','32.48 psi','75.00 psi','173.21 psi'],a:1,ex:['Close but not exact.','CORRECT \u2014 Water = 0.433 psi/ft. 75 \u00d7 0.433 = 32.48 psi.','1 ft \u2260 1 psi.','Too high.']},
{n:73,p:2,t:'num',q:'What pressure (psi) is exerted by 50 feet of water column?',a:'21.65',ex:['psi = feet \u00d7 0.433 = 50 \u00d7 0.433 = 21.65 psi.']},
{n:74,p:2,t:'mc',q:'What is the minimum \u0394P to elevate condensate 12 feet?',o:['12 psi','5.2 psi','24 psi','2.5 psi'],a:1,ex:['1 ft \u2260 1 psi.','CORRECT \u2014 \u0394P = ft \u00d7 0.433 = 12 \u00d7 0.433 = 5.2 psi.','Double the correct.','Half.']},
{n:75,p:2,t:'num',q:'A boiler heats 500 gallons from 40\u00b0F to 180\u00b0F. Total BTUs needed?',a:'583100',ex:['Mass = 500 \u00d7 8.33 = 4,165 lbs. Q = 4,165 \u00d7 1.0 \u00d7 140 = 583,100 BTU.']},

// === AIRFLOW (76-82) ===
{n:76,p:1,t:'mc',q:'400 CFM per ton is the standard. A 4-ton system needs:',o:['800 CFM','1,200 CFM','1,600 CFM','2,000 CFM'],a:2,ex:['2 tons.','3 tons.','CORRECT \u2014 400 \u00d7 4 = 1,600 CFM.','5 tons.']},
{n:77,p:2,t:'mc',q:'Sensible heat formula: Q = 1.08 \u00d7 CFM \u00d7 \u0394T. 800 CFM with 20\u00b0F drop gives:',o:['17,280 BTU/hr','16,000 BTU/hr','12,000 BTU/hr','8,640 BTU/hr'],a:0,ex:['CORRECT \u2014 Q = 1.08 \u00d7 800 \u00d7 20 = 17,280.','Omits the 1.08 factor.','Coincidence.','Wrong factor.']},
{n:78,p:2,t:'num',q:'Sensible cooling: 1,500 CFM with 22\u00b0F drop. BTU/hr?',a:'35640',ex:['Q = 1.08 \u00d7 1,500 \u00d7 22 = 35,640 BTU/hr.']},
{n:79,p:2,t:'mc',q:'Total heat formula: Q = 4.5 \u00d7 CFM \u00d7 \u0394h. 1,200 CFM with \u0394h = 8 BTU/lb gives:',o:['43,200','38,400','9,600','54,000'],a:0,ex:['CORRECT \u2014 Q = 4.5 \u00d7 1,200 \u00d7 8 = 43,200 BTU/hr.','Wrong factor.','Omits factor.','Wrong math.']},
{n:80,p:2,t:'mc',q:'Duct velocity: 800 CFM through 10" round duct (area = 0.545 ft\u00b2). Velocity?',o:['800 FPM','1,200 FPM','1,468 FPM','436 FPM'],a:2,ex:['Would need 1.0 ft\u00b2.','Not correct.','CORRECT \u2014 V = CFM \u00f7 Area = 800 \u00f7 0.545 = 1,468 FPM.','Backwards calc.']},
{n:81,p:2,t:'num',q:'What CFM is needed at 400 CFM/ton for a 5-ton system?',a:'2000',ex:['CFM = 400 \u00d7 tons = 400 \u00d7 5 = 2,000 CFM.']},
{n:82,p:2,t:'num',q:'A duct has 1,600 CFM at 800 FPM velocity. What is the duct area in sq ft?',a:'2',ex:['Area = CFM \u00f7 Velocity = 1,600 \u00f7 800 = 2.0 sq ft.']},

// === GAS PIPING / CFH (83-88) ===
{n:83,p:2,t:'mc',q:'A 200,000 BTU/hr furnace on natural gas (1,000 BTU/ft\u00b3). Gas flow in CFH?',o:['100','200','500','2,000'],a:1,ex:['That would be 100,000 BTU/hr.','CORRECT \u2014 CFH = BTU/hr \u00f7 BTU/ft\u00b3 = 200,000 \u00f7 1,000 = 200.','Too high.','Way too high.']},
{n:84,p:2,t:'mc',q:'Same 200,000 BTU/hr on propane (2,500 BTU/ft\u00b3). Gas flow?',o:['40 CFH','80 CFH','200 CFH','500 CFH'],a:1,ex:['Too low.','CORRECT \u2014 200,000 \u00f7 2,500 = 80 CFH. LP has higher BTU content so less volume.','That\\u0027s nat gas rate.','Way too high.']},
{n:85,p:2,t:'num',q:'A 120,000 BTU/hr natural gas water heater. Gas flow rate in CFH?',a:'120',ex:['CFH = 120,000 \u00f7 1,000 = 120 CFH for natural gas.']},
{n:86,p:1,t:'mc',q:'Natural gas BTU content is approximately:',o:['500 BTU/ft\u00b3','1,000 BTU/ft\u00b3','2,500 BTU/ft\u00b3','10,000 BTU/ft\u00b3'],a:1,ex:['Too low.','CORRECT \u2014 Natural gas \u2248 1,000 BTU per cubic foot.','That\\u0027s propane.','Way too high.']},
{n:87,p:1,t:'mc',q:'Propane (LP) BTU content is approximately:',o:['1,000 BTU/ft\u00b3','1,500 BTU/ft\u00b3','2,500 BTU/ft\u00b3','5,000 BTU/ft\u00b3'],a:2,ex:['That\\u0027s natural gas.','Too low.','CORRECT \u2014 LP \u2248 2,500 BTU/ft\u00b3. Over 2x natural gas.','Too high.']},
{n:88,p:2,t:'num',q:'A 300,000 BTU/hr boiler on natural gas needs how many CFH?',a:'300',ex:['CFH = 300,000 \u00f7 1,000 = 300 CFH.']},

// === CONVERSIONS (89-95) ===
{n:89,p:1,t:'mc',q:'Convert 25\u00b0C to Fahrenheit:',o:['45\u00b0F','57\u00b0F','77\u00b0F','93\u00b0F'],a:2,ex:['7\u00b0C.','14\u00b0C.','CORRECT \u2014 \u00b0F = (\u00b0C \u00d7 9/5) + 32 = (25 \u00d7 1.8) + 32 = 77\u00b0F.','34\u00b0C.']},
{n:90,p:1,t:'mc',q:'Convert 68\u00b0F to Celsius:',o:['10\u00b0C','15\u00b0C','20\u00b0C','25\u00b0C'],a:2,ex:['50\u00b0F.','59\u00b0F.','CORRECT \u2014 \u00b0C = (\u00b0F \u2212 32) \u00d7 5/9 = (68\u221232) \u00d7 5/9 = 20\u00b0C.','77\u00b0F.']},
{n:91,p:2,t:'num',q:'Convert 35\u00b0C to Fahrenheit. (Answer in decimal)',a:'95',ex:['\u00b0F = (35 \u00d7 9/5) + 32 = 63 + 32 = 95\u00b0F.']},
{n:92,p:2,t:'num',q:'Convert 95\u00b0F to Celsius:',a:'35',ex:['\u00b0C = (95 \u2212 32) \u00d7 5/9 = 63 \u00d7 5/9 = 35\u00b0C.']},
{n:93,p:2,t:'mc',q:'Convert 20 psig to inches of water column (1 psi = 27.7 in. WC):',o:['554 in. WC','277 in. WC','740 in. WC','20 in. WC'],a:0,ex:['CORRECT \u2014 20 \u00d7 27.7 = 554 in. WC.','10 psi.','Wrong factor.','Different units.']},
{n:94,p:2,t:'num',q:'What is 7" WC in psi? (1 psi = 27.7 in. WC). Round to 2 decimals.',a:'0.25',ex:['psi = 7 \u00f7 27.7 = 0.253 psi \u2248 0.25. Standard gas supply pressure.']},
{n:95,p:2,t:'num',q:'Convert 8 kW to BTU/hr (1 kW = 3,412 BTU/hr).',a:'27296',ex:['BTU/hr = 8 \u00d7 3,412 = 27,296.']},

// === GAY-LUSSAC / PRESSURE TESTS (96-100) ===
{n:96,p:2,t:'mc',q:'N2 test: 150 psig at 90\u00b0F. Temp drops to 55\u00b0F. Expected reading (no leaks)?',o:['150.0 psig','145.2 psig','139.5 psig','132.0 psig'],a:2,ex:['Pressure changes with temp.','Underestimates.','CORRECT \u2014 P1=164.7 PSIA, T1=549.67\u00b0R, T2=514.67\u00b0R. P2=164.7\u00d7(514.67/549.67)=154.2 PSIA = 139.5 PSIG.','Overestimates.']},
{n:97,p:2,t:'mc',q:'Nitrogen test at 300 psig and 75\u00b0F. Temp rises to 100\u00b0F. Expected pressure?',o:['300 psig','310 psig','314 psig','325 psig'],a:2,ex:['No change assumption \u2014 wrong.','Underestimates.','CORRECT \u2014 P2 = (314.7)\u00d7(559.67/534.67)\u221214.7 \u2248 314 psig.','Overestimates.']},
{n:98,p:2,t:'mc',q:'Approximate pressure change per \u00b0F at 150 psig?',o:['0.1 psi/\u00b0F','0.3 psi/\u00b0F','0.5 psi/\u00b0F','1.0 psi/\u00b0F'],a:1,ex:['Too low.','CORRECT \u2014 At ~150 psig, expect ~0.3 psi change per \u00b0F of temp change.','Too high.','Would be at ~500 psig.']},
{n:99,p:2,t:'num',q:'Nitrogen test at 200 psig and 80\u00b0F. Temp drops 20\u00b0F. What\\u0027s the approximate new pressure in psig? (Use rule of thumb ~0.4 psi/\u00b0F at 200 psig)',a:'192',ex:['Change = 20\u00b0F \u00d7 0.4 psi/\u00b0F = 8 psi drop. New = 200 \u2212 8 = 192 psig. For precision, use full Gay-Lussac formula.']},
{n:100,p:2,t:'mc',q:'If standing test loses 10 psi over 24 hours but ambient dropped 30\u00b0F, is there a leak (at 200 psig)?',o:['Yes, definitely','Probably not \u2014 temp drop explains it','Cannot determine','Depends on test duration'],a:1,ex:['Premature conclusion.','CORRECT \u2014 At ~0.4 psi/\u00b0F, a 30\u00b0F drop alone would cause ~12 psi drop. The 10 psi loss is within expected range \u2014 likely NOT a leak.','The math is clear.','Duration doesn\\u0027t change physics.']}
];



const L='ABCDEFGHIJ',TL={mc:'Multiple Choice',tf:'True / False',fill:'Fill in the Blank',short:'Short Answer',essay:'Essay',num:'Numerical'};
const TP=Q.reduce((s,q)=>s+q.p,0);
let S={scr:'start',mode:'practice',i:0,ans:{},txt:{},chk:{},sg:false,graded:false,flt:'all',shuf:null};

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function qs(){return S.shuf||Q;}

// Calculate running score
function calcScore(){
const all=qs();
let cor=0,wrg=0,pts=0,maxPts=0,checked=0;
all.forEach(q=>{
if(!S.chk[q.n]) return;
if(q.a===-1) return; // skip non-gradable
checked++;
maxPts+=q.p;
if(S.ans[q.n]===q.a){cor++;pts+=q.p;}
else if(S.ans[q.n]!==undefined){wrg++;}
});
const gradable=all.filter(q=>q.a!==-1).length;
const totalGradablePts=all.filter(q=>q.a!==-1).reduce((s,q)=>s+q.p,0);
const pct=maxPts>0?Math.round((pts/maxPts)*100):0;
return {cor,wrg,pts,maxPts,checked,pct,gradable,totalGradablePts};
}

function scoreBarHTML(){
const sc=calcScore();
const isExam=S.mode==='exam'&&!S.graded;
const noData=sc.checked===0;
const pctColor=sc.pct>=70?'var(--ok)':sc.pct>=50?'var(--warn)':'var(--no)';
const barColor=sc.pct>=70?'var(--ok)':sc.pct>=50?'var(--warn)':'var(--no)';

return `<div class="score-bar${isExam?' exam-mode':''}${noData?' no-data':''}">
<div class="sc-section">
<div class="sc-val" style="color:var(--ok)">${sc.cor}</div>
<div class="sc-lbl">Correct</div>
</div>
<div class="sc-section">
<div class="sc-val" style="color:var(--no)">${sc.wrg}</div>
<div class="sc-lbl">Wrong</div>
</div>
<div class="sc-section">
<div class="sc-val" style="color:var(--accent)">${sc.pts}<span style="font-size:.65em;color:var(--text2)">/${sc.checked>0?sc.maxPts:sc.totalGradablePts}</span></div>
<div class="sc-lbl">Points</div>
</div>
<div class="sc-pct-wrap">
<div class="sc-pct-bar"><div class="sc-pct-fill" style="width:${noData?0:sc.pct}%;background:${barColor}"></div></div>
<div class="sc-pct-num" style="color:${noData?'var(--text2)':pctColor}">${noData?'—':sc.pct+'%'}</div>
</div>
</div>`;
}

function render(){
const el=document.getElementById('app');
if(S.scr==='start')return rStart(el);
if(S.scr==='quiz')return rQuiz(el);
if(S.scr==='results')return rResults(el);
}

function rStart(el){
el.innerHTML=`<div class="start">
<h1>📐 HVAC Math Review</h1>
<p class="sub">100 Calculation Problems — Hydronic Systems Course Final</p>
<div class="stats">
<div class="sb"><div class="v">119</div><div class="l">Questions</div></div>
<div class="sb"><div class="v">${TP}</div><div class="l">Total Points</div></div>
<div class="sb"><div class="v">264</div><div class="l">Explanations</div></div>
</div>
<div class="modes">
<div class="mb ${S.mode==='practice'?'on':''}" onclick="setM('practice')"><h3>✅ Practice</h3><p>Check answers as you go with full explanations for every choice.</p></div>
<div class="mb ${S.mode==='exam'?'on':''}" onclick="setM('exam')"><h3>📝 Exam</h3><p>No feedback until submit. Simulates real test conditions.</p></div>
<div class="mb ${S.mode==='shuffle'?'on':''}" onclick="setM('shuffle')"><h3>🔀 Shuffle</h3><p>Randomized order with instant explanations. Great for review.</p></div>
</div>
<button class="go" onclick="startQ()">Start Exam</button>
<p class="disclaimer">Answer key based on engineering principles. Verify with your course materials.</p>
</div>`;}

function rQuiz(el){
const all=qs(),q=all[S.i],done=S.ans[q.n]!==undefined,checked=S.chk[q.n],isT=q.o.length===0;
const prog=Object.keys(S.ans).length+Object.keys(S.txt).filter(k=>S.txt[k]).length;
let grid='';
if(S.sg){grid=`<div class="gp"><div class="gr">${all.map((qq,i)=>{
let c='gd';if(i===S.i)c+=' cur';
if(S.ans[qq.n]!==undefined||S.txt[qq.n])c+=' ans';
if(S.chk[qq.n]&&S.ans[qq.n]===qq.a)c+=' gc';
if(S.chk[qq.n]&&S.ans[qq.n]!==undefined&&S.ans[qq.n]!==qq.a)c+=' gw';
return`<div class="${c}" onclick="go(${i})">${qq.n}</div>`;}).join('')}</div></div>`;}

let opts='';
if(!isT){
opts=`<div class="opts">${q.o.map((o,i)=>{
let c='op';
if(S.ans[q.n]===i)c+=' sel';
if(checked){c+=' dis';if(i===q.a)c+=' shw';if(S.ans[q.n]===i&&i!==q.a)c+=' wrg';if(S.ans[q.n]===i&&i===q.a){c='op cor dis';}}
let exH='';
if(checked&&q.ex&&q.ex[i]){
const isC=i===q.a;
exH=`<div class="ex-box ${isC?'ex-ok':'ex-no'}">${esc(q.ex[i])}</div>`;}
return`<div class="${c}" onclick="sel(${q.n},${i})"><span class="ol">${L[i]}</span><div class="ot">${esc(o)}${exH}</div></div>`;}).join('')}</div>`;
}else{
const v=S.txt[q.n]||'';const rows=q.t==='essay'?5:2;
opts=`<textarea class="ti" rows="${rows}" placeholder="Type your answer..." oninput="setT(${q.n},this.value)"${checked?' disabled':''}>${esc(v)}</textarea>`;
if(checked){
if(q.h)opts+=`<div class="hint"><div class="hl">Suggested Answer</div><div class="ht">${esc(q.h)}</div></div>`;
if(q.ex&&q.ex.length)opts+=`<div class="fill-exps">${q.ex.map(e=>`<div class="fill-exp">${esc(e)}</div>`).join('')}</div>`;
}}

const canChk=S.mode!=='exam'&&!checked&&(done||(isT&&S.txt[q.n]));
el.innerHTML=`<div class="hdr">
<span class="t">📐 HVAC Math Review</span>
<span class="pi">${prog}/${all.length} answered</span>
<button class="gt" onclick="tg()">${S.sg?'Hide':'Show'} Map</button>
</div>
${scoreBarHTML()}
<div class="pb"><div class="pf" style="width:${(prog/all.length)*100}%"></div></div>
${grid}
<div class="qc">
<div class="qm"><span class="qn">Q${q.n}</span><span class="qt">${TL[q.t]||q.t}</span><span class="qp">${q.p} pts</span></div>
<div class="qq">${esc(q.q)}</div>
${opts}
</div>
<div class="nav">
<button class="nb" onclick="go(${S.i-1})" ${S.i===0?'disabled':''}>← Prev</button>
<div class="nc">
${canChk?`<button class="nb ck" onclick="chk(${q.n})">Check Answer</button>`:''}
${S.mode==='exam'&&!S.graded?`<button class="nb pr" onclick="submit()" style="background:#f59e0b;border-color:#f59e0b">Submit Exam</button>`:''}
</div>
<button class="nb${S.i===all.length-1?' pr':''}" onclick="${S.i===all.length-1?(S.mode==='exam'?'submit()':'showR()'):`go(${S.i+1})`}">${S.i===all.length-1?(S.mode==='exam'?'Submit':'Results'):'Next →'}</button>
</div>`;}

function rResults(el){
const all=qs();let cor=0,wrg=0,skip=0,ep=0;
all.forEach(q=>{if(q.a===-1){skip++;return;}if(S.ans[q.n]===q.a){cor++;ep+=q.p;}else if(S.ans[q.n]!==undefined)wrg++;else skip++;});
const grd=all.filter(q=>q.a!==-1).length,pct=grd?Math.round(cor/grd*100):0;
const mp=all.filter(q=>q.a!==-1).reduce((s,q)=>s+q.p,0);
const cc=pct>=70?'var(--ok)':pct>=50?'var(--warn)':'var(--no)';
let filt=all;
if(S.flt==='wrong')filt=all.filter(q=>q.a!==-1&&S.ans[q.n]!==undefined&&S.ans[q.n]!==q.a);
if(S.flt==='correct')filt=all.filter(q=>S.ans[q.n]===q.a);
if(S.flt==='skipped')filt=all.filter(q=>S.ans[q.n]===undefined&&q.a!==-1);
if(S.flt==='text')filt=all.filter(q=>q.a===-1);

const rev=filt.map(q=>{
const isT=q.o.length===0;let os='';
if(!isT){os=q.o.map((o,i)=>{
let c='op dis';if(i===q.a)c+=' shw';if(S.ans[q.n]===i&&i!==q.a)c+=' wrg';if(S.ans[q.n]===i&&i===q.a)c='op cor dis';
let exH='';if(q.ex&&q.ex[i]){const ic=i===q.a;exH=`<div class="ex-box ${ic?'ex-ok':'ex-no'}">${esc(q.ex[i])}</div>`;}
return`<div class="${c}"><span class="ol">${L[i]}</span><div class="ot">${esc(o)}${exH}</div></div>`;}).join('');}
else{
const v=S.txt[q.n]||'<em style="color:var(--text2)">No answer</em>';
os=`<div style="padding:8px 12px;background:var(--card2);border-radius:8px;font-size:.88em">${v}</div>`;
if(q.h)os+=`<div class="hint"><div class="hl">Suggested Answer</div><div class="ht">${esc(q.h)}</div></div>`;
if(q.ex&&q.ex.length)os+=`<div class="fill-exps">${q.ex.map(e=>`<div class="fill-exp">${esc(e)}</div>`).join('')}</div>`;}
return`<div class="qc"><div class="qm"><span class="qn">Q${q.n}</span><span class="qt">${TL[q.t]}</span><span class="qp">${q.p} pts</span></div><div class="qq">${esc(q.q)}</div><div class="opts">${os}</div></div>`;}).join('');

el.innerHTML=`<div class="res">
<h2>Exam Results</h2>
<div class="sc" style="border-color:${cc}"><div class="pct" style="color:${cc}">${pct}%</div><div class="of">${cor} / ${grd}</div></div>
<div class="rg">
<div class="rs"><div class="rv" style="color:var(--ok)">${cor}</div><div class="rl">Correct</div></div>
<div class="rs"><div class="rv" style="color:var(--no)">${wrg}</div><div class="rl">Wrong</div></div>
<div class="rs"><div class="rv" style="color:var(--text2)">${skip}</div><div class="rl">Skipped</div></div>
<div class="rs"><div class="rv" style="color:var(--accent)">${ep}/${mp}</div><div class="rl">Points</div></div>
</div>
<div class="ra">
<button class="nb" onclick="reset()">← Start Over</button>
<button class="nb pr" onclick="retry()">Retry Wrong</button>
</div>
</div>
<div style="padding:0 4px">
<div class="ft">
<button class="fb ${S.flt==='all'?'on':''}" onclick="setF('all')">All (${all.length})</button>
<button class="fb ${S.flt==='wrong'?'on':''}" onclick="setF('wrong')">Wrong (${wrg})</button>
<button class="fb ${S.flt==='correct'?'on':''}" onclick="setF('correct')">Correct (${cor})</button>
<button class="fb ${S.flt==='skipped'?'on':''}" onclick="setF('skipped')">Skipped (${skip})</button>
<button class="fb ${S.flt==='text'?'on':''}" onclick="setF('text')">Written (${all.filter(q=>q.a===-1).length})</button>
</div>
${rev}
</div>`;}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setM(m){S.mode=m;render();}
function startQ(){S.scr='quiz';S.i=0;S.ans={};S.txt={};S.chk={};S.graded=false;S.shuf=S.mode==='shuffle'?shuffle(Q):null;render();scrollTo(0,0);}
function sel(n,i){if(S.chk[n])return;S.ans[n]=i;render();}
function setT(n,v){S.txt[n]=v;}
function chk(n){S.chk[n]=true;render();}
function go(i){const a=qs();if(i<0||i>=a.length)return;S.i=i;render();scrollTo(0,0);}
function tg(){S.sg=!S.sg;render();}
function submit(){qs().forEach(q=>{S.chk[q.n]=true;});S.graded=true;showR();}
function showR(){S.scr='results';S.flt='all';render();scrollTo(0,0);}
function reset(){S.scr='start';S.mode='practice';render();scrollTo(0,0);}
function setF(f){S.flt=f;render();}
function retry(){const a=qs().filter(q=>q.a!==-1&&S.ans[q.n]!==undefined&&S.ans[q.n]!==q.a);if(!a.length){alert('No wrong answers to retry!');return;}S.shuf=a;S.ans={};S.chk={};S.txt={};S.graded=false;S.scr='quiz';S.i=0;S.mode='practice';render();scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(S.scr!=='quiz')return;if(e.key==='ArrowRight'){e.preventDefault();go(S.i+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(S.i-1);}const a=qs(),q=a[S.i];if(q.o.length>0&&!S.chk[q.n]){const k='ABCDEFGHIJ'.indexOf(e.key.toUpperCase());if(k>=0&&k<q.o.length)sel(q.n,k);}});
render();
</script>
</body>
</html>
