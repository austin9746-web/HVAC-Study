<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<title>Hydronics HVAC Final — Study Tool</title>
<style>
:root{--bg:#0c0e12;--card:#161a21;--card2:#1e232c;--border:#2a303d;--text:#e0e3e9;--text2:#7d8594;--accent:#4a9eff;--accent2:#2d7dd2;--ok:#34d399;--ok-bg:rgba(52,211,153,.08);--no:#f87171;--no-bg:rgba(248,113,113,.08);--warn:#fbbf24;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.app{max-width:880px;margin:0 auto;padding:16px}
.start{text-align:center;padding:48px 16px}
.start h1{font-size:2.2em;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.start .sub{color:var(--text2);margin-bottom:32px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.sb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 22px;min-width:110px}
.sb .v{font-size:1.7em;font-weight:700;color:var(--accent)}
.sb .l{font-size:.75em;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.mb{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:16px 20px;cursor:pointer;text-align:left;min-width:220px;transition:.2s}
.mb:hover{border-color:var(--accent);background:var(--card2)}
.mb.on{border-color:var(--accent);background:rgba(74,158,255,.06)}
.mb h3{font-size:.95em;margin-bottom:2px}
.mb p{font-size:.78em;color:var(--text2)}
.go{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px 44px;font-size:1.05em;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;margin-top:8px}
.go:hover{background:var(--accent2);transform:translateY(-1px)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.hdr .t{font-size:.85em;font-weight:600;color:var(--text2)}
.hdr .pi{font-size:.82em;color:var(--text2);font-family:monospace}

/* === SCORE BAR === */
.score-bar{display:flex;align-items:center;gap:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:10px 0;overflow:hidden;min-height:48px}
.score-bar .sc-section{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;min-width:70px;border-right:1px solid var(--border)}
.score-bar .sc-section:last-child{border-right:none}
.score-bar .sc-val{font-size:1.2em;font-weight:700;font-family:monospace;line-height:1.2}
.score-bar .sc-lbl{font-size:.62em;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);line-height:1.2}
.sc-pct-wrap{flex:1;padding:8px 16px;display:flex;align-items:center;gap:12px;min-width:120px}
.sc-pct-bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
.sc-pct-fill{height:100%;border-radius:4px;transition:width .4s,background .3s}
.sc-pct-num{font-size:1.3em;font-weight:700;font-family:monospace;min-width:52px;text-align:right}
.score-bar.exam-mode{opacity:.5;filter:blur(3px);pointer-events:none;user-select:none}
.score-bar.no-data .sc-val{color:var(--text2)}
@media(max-width:500px){.score-bar .sc-section{padding:6px 10px;min-width:54px}.score-bar .sc-val{font-size:1em}.sc-pct-wrap{padding:6px 10px}.sc-pct-num{font-size:1.1em;min-width:44px}}

.pb{height:4px;background:var(--card2);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:2px;transition:width .4s}
.qc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:14px}
.qm{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.qn{font-family:monospace;font-size:.8em;font-weight:600;color:var(--accent);background:rgba(74,158,255,.1);padding:3px 9px;border-radius:6px}
.qt{font-size:.75em;color:var(--text2);background:var(--card2);padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.qp{font-size:.75em;color:var(--warn);margin-left:auto;font-weight:600}
.qq{font-size:1.05em;line-height:1.6;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--card2);border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.15s;font-size:.92em;line-height:1.5}
.op:hover{border-color:var(--border);background:#252a35}
.op.sel{border-color:var(--accent);background:rgba(74,158,255,.05)}
.op.cor{border-color:var(--ok);background:var(--ok-bg)}
.op.wrg{border-color:var(--no);background:var(--no-bg)}
.op.shw{border-color:var(--ok);background:var(--ok-bg)}
.op.dis{cursor:default}
.ol{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:600;color:var(--text2);transition:.15s}
.op.sel .ol{background:var(--accent);color:#fff}
.op.cor .ol{background:var(--ok);color:#000}
.op.wrg .ol{background:var(--no);color:#fff}
.op.shw .ol{background:var(--ok);color:#000}
.ot{padding-top:2px;flex:1}
.ex-box{margin-top:8px;padding:10px 12px;background:rgba(74,158,255,.04);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:.84em;line-height:1.5;color:var(--text)}
.ex-box.ex-ok{border-left-color:var(--ok);background:var(--ok-bg)}
.ex-box.ex-no{border-left-color:var(--no);background:var(--no-bg)}
.ti{width:100%;background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:.92em;resize:vertical;min-height:44px}
.ti:focus{outline:none;border-color:var(--accent)}
.hint{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.2);border-radius:8px;padding:12px 14px;margin-top:10px}
.hint .hl{font-size:.75em;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.hint .ht{font-size:.88em;line-height:1.5}
.fill-exps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fill-exp{padding:10px 12px;background:rgba(74,158,255,.04);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:.84em;line-height:1.5}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nb{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 18px;color:var(--text);font-family:inherit;font-size:.88em;cursor:pointer;transition:.15s;font-weight:500}
.nb:hover{background:var(--card2);border-color:var(--text2)}
.nb.pr{background:var(--accent);border-color:var(--accent);color:#fff}
.nb.pr:hover{background:var(--accent2)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.nc{display:flex;gap:6px;align-items:center}
.ck{background:var(--warn);border:none;color:#000;font-weight:600}
.ck:hover{background:#e5a900}
.gt{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text2);cursor:pointer;font-size:.8em;font-family:inherit;transition:.15s}
.gt:hover{border-color:var(--text2);color:var(--text)}
.gp{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px}
.gd{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-size:.7em;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text2)}
.gd:hover{border-color:var(--text2)}
.gd.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.15)}
.gd.ans{background:rgba(74,158,255,.12);border-color:var(--accent);color:var(--accent)}
.gd.gc{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.gd.gw{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.res{text-align:center;padding:32px 16px}
.res h2{font-size:1.8em;margin-bottom:6px}
.sc{width:160px;height:160px;border-radius:50%;border:5px solid var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto}
.sc .pct{font-size:2.8em;font-weight:700}
.sc .of{font-size:.82em;color:var(--text2)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}
.rs{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.rs .rv{font-size:1.4em;font-weight:700}
.rs .rl{font-size:.75em;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.ra{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ft{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.fb{padding:5px 12px;border-radius:18px;border:1px solid var(--border);background:none;color:var(--text2);font-size:.8em;cursor:pointer;font-family:inherit;transition:.15s}
.fb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fb:hover{border-color:var(--text2)}
.disclaimer{margin-top:12px;font-size:.75em;color:var(--text2);opacity:.7}
@media(max-width:600px){.app{padding:8px}.qc{padding:16px}.start h1{font-size:1.5em}.mb{min-width:100%}.gr{grid-template-columns:repeat(auto-fill,minmax(30px,1fr))}}

/* Back to hub button */
.back-btn{position:fixed;top:12px;left:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--text2);font-size:.8em;cursor:pointer;z-index:999;font-family:inherit;text-decoration:none;display:flex;align-items:center;gap:5px;transition:.2s}
.back-btn:hover{border-color:var(--accent);color:var(--text);background:var(--card2)}
/* Print results button */
.print-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 22px;color:var(--text);font-family:inherit;font-size:.88em;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.print-btn:hover{border-color:var(--accent);background:var(--card2)}
@media print{.back-btn,.fab-container,.calc-overlay,.ref-overlay,.nav,.hdr,.go,.modes,.timer-toggle,.stats-history,.print-btn,.nb{display:none!important}.app{padding:0}.qc{break-inside:avoid;border:1px solid #ccc;margin:8px 0}.start{display:none}.res,.opts,.qc{display:block!important}body{background:#fff;color:#000}.score-bar,.pb{display:none}:root{--card:#fff;--card2:#f5f5f5;--border:#ddd;--text:#000;--text2:#666;--ok:#22c55e;--no:#dc2626;--accent:#2563eb}}
.save-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 16px;color:var(--text2);font-family:inherit;font-size:.82em;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px}.save-btn:hover{border-color:var(--ok);color:var(--ok)}.save-btn.saved{border-color:var(--ok);color:var(--ok);background:rgba(52,211,153,.08)}

/* Flashcard mode */
.fc-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:32px 28px;margin:16px 0;min-height:250px;cursor:pointer;transition:.3s;position:relative;display:flex;flex-direction:column;justify-content:center}
.fc-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.fc-card.flipped{border-color:var(--ok);background:rgba(52,211,153,.03)}
.fc-label{position:absolute;top:12px;left:16px;font-size:.7em;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);font-weight:600}
.fc-tap{position:absolute;bottom:12px;right:16px;font-size:.75em;color:var(--text2)}
.fc-q{font-size:1.1em;line-height:1.6;text-align:center}
.fc-a{margin-top:16px;padding-top:16px;border-top:2px solid var(--border);font-size:1em;line-height:1.5;text-align:center}
.fc-a .fc-correct{color:var(--ok);font-weight:700;font-size:1.1em;margin-bottom:8px}
.fc-a .fc-explain{color:var(--text2);font-size:.88em}
.fc-controls{display:flex;gap:10px;justify-content:center;margin-top:16px}
.fc-btn{padding:10px 20px;border-radius:8px;border:2px solid;cursor:pointer;font-family:inherit;font-size:.88em;font-weight:600;transition:.2s}
.fc-knew{border-color:var(--ok);color:var(--ok);background:rgba(52,211,153,.06)}
.fc-knew:hover{background:rgba(52,211,153,.15)}
.fc-didnt{border-color:var(--no);color:var(--no);background:rgba(248,113,113,.06)}
.fc-didnt:hover{background:rgba(248,113,113,.15)}
.fc-progress{display:flex;gap:16px;justify-content:center;margin:12px 0;font-size:.85em}
.fc-stat{text-align:center}
.fc-stat .fc-sv{font-size:1.3em;font-weight:700;font-family:monospace}

/* Topic analysis */
.topic-section{margin:20px 0}
.topic-section h3{font-size:.95em;font-weight:700;margin-bottom:12px;color:var(--accent)}
.topic-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.topic-name{flex:1;font-size:.88em;font-weight:600}
.topic-score{font-family:monospace;font-weight:700;font-size:.9em;min-width:50px;text-align:right}
.topic-meter{width:100px;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.topic-fill{height:100%;border-radius:4px}
.topic-count{font-size:.75em;color:var(--text2);min-width:40px;text-align:right}

/* Light mode */
body.light{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f1f4;--border:#d4d8e0;--text:#1a1d24;--text2:#6b7280;--accent:#2563eb;--accent2:#1d4ed8;--ok:#16a34a;--ok-bg:rgba(22,163,74,.06);--no:#dc2626;--no-bg:rgba(220,38,38,.06);--warn:#d97706}
body.light .op:hover{background:#f0f1f4}
body.light .gd{background:#f0f1f4}

/* Theme toggle button */
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;color:var(--text2);font-size:.8em;cursor:pointer;z-index:999;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:4px}
.theme-toggle:hover{border-color:var(--accent);color:var(--text)}

/* Flag button */
.flag-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.85em;transition:.2s;color:var(--text2);font-family:inherit}
.flag-btn:hover{border-color:var(--warn);color:var(--warn)}
.flag-btn.flagged{background:rgba(251,191,36,.12);border-color:var(--warn);color:var(--warn)}
.gd.gf{box-shadow:inset 0 0 0 2px var(--warn)}

/* Sticky mobile nav */
@media(max-width:600px){
  .nav{position:sticky;bottom:0;background:var(--bg);padding:10px 8px;border-top:1px solid var(--border);margin:0 -16px -24px;z-index:100}
  .qc{margin-bottom:70px}
}

.calc-overlay{position:fixed;top:60px;right:12px;width:280px;background:var(--card);border:2px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:1001;display:none;overflow:hidden}
.calc-overlay.open{display:block}
.calc-overlay.sci{width:340px}
.calc-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85em;font-weight:600;color:var(--text2)}
.calc-close{background:none;border:none;color:var(--text2);font-size:1.1em;cursor:pointer}
.calc-mode-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:.72em;cursor:pointer;color:var(--text2);font-family:inherit}
.calc-mode-btn:hover{border-color:var(--accent);color:var(--accent)}
.calc-mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.calc-display{padding:12px 14px;font-family:monospace;font-size:1.4em;text-align:right;color:var(--text);background:var(--bg);border-bottom:1px solid var(--border);min-height:48px;word-break:break-all;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px}
.calc-overlay.sci .calc-grid{grid-template-columns:repeat(5,1fr)}
.calc-btn{padding:14px 4px;border:none;background:var(--card2);color:var(--text);font-size:.95em;font-family:monospace;cursor:pointer;border-radius:6px;transition:.15s}
.calc-btn:hover{background:var(--border)}
.calc-btn:active{background:var(--accent);color:#fff}
.calc-btn.op{color:var(--accent);font-weight:700}
.calc-btn.eq{background:var(--accent);color:#fff;font-weight:700}
.calc-btn.eq:hover{background:var(--accent2)}
.calc-btn.clr{color:var(--no);font-weight:700}
.calc-btn.sci{font-size:.72em;color:var(--warn);padding:10px 2px}
.calc-btn.sci:hover{background:rgba(251,191,36,.1)}
@media(max-width:600px){.calc-overlay{top:auto;bottom:70px;right:4px;left:4px;width:auto}.calc-overlay.sci{width:auto}}

.shuffle-toggle{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:.2s;user-select:none}
.shuffle-toggle:hover{border-color:var(--accent)}
.shuffle-toggle.on{border-color:var(--accent);background:rgba(74,158,255,.06)}
.st-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.8em;transition:.2s;flex-shrink:0}
.shuffle-toggle.on .st-check{background:var(--accent);border-color:var(--accent);color:#fff}
.st-label{font-size:.88em;font-weight:600}
.st-desc{font-size:.75em;color:var(--text2)}

.nav-tools{display:flex;gap:4px;align-items:center}
.nav-tool{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;font-family:inherit;font-size:.7em;font-weight:700;letter-spacing:.03em;transition:.2s}
.nav-tool:hover{border-color:var(--accent);color:var(--accent);background:rgba(74,158,255,.06)}
.nav-tool:active{background:var(--accent);color:#fff}

.nb.skip{color:var(--warn);border-color:rgba(251,191,36,.3)}
.nb.skip:hover{border-color:var(--warn);background:rgba(251,191,36,.06)}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">Light</button>
<a href="index.html" class="back-btn">← Study Hub</a>
<div class="app" id="app"></div>
<script>

/* Session check — guest mode if not logged in */
(function(){
  try {
    var user = localStorage.getItem('hvac_session');
    window._hvacUser = user || 'guest';
    if (user) {
      var users = {};
      try { users = JSON.parse(localStorage.getItem('hvac_users')) || {}; } catch(e) {}
      window._hvacDisplayName = users[user] ? users[user].display : user;
    } else {
      window._hvacDisplayName = 'Guest';
    }
  } catch(e) {
    window._hvacUser = 'guest';
    window._hvacDisplayName = 'Guest';
  }
})();

// Dark/Light mode
function getTheme() { try { return localStorage.getItem('hvac_theme') || 'dark'; } catch(e) { return 'dark'; } }
function setTheme(t) { document.body.className = t === 'light' ? 'light' : ''; try { localStorage.setItem('hvac_theme', t); } catch(e) {} updateThemeBtn(); }
function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
function updateThemeBtn() { var btn = document.getElementById('theme-btn'); if (btn) btn.textContent = getTheme() === 'dark' ? 'Light' : 'Dark'; }
setTheme(getTheme());

// Question flagging
var flagged = {};
function toggleFlag(n) { flagged[n] = !flagged[n]; render(); }
function getFlagHTML(n) {
  var cls = flagged[n] ? 'flag-btn flagged' : 'flag-btn';
  var txt = flagged[n] ? 'Flagged' : 'Flag';
  return '<button class="' + cls + '" onclick="toggleFlag(' + n + ')">' + txt + '</button>';
}
const Q=[
{n:1,p:5,t:'mc',q:'A(n) ___ thermometer is an instrument designed to measure temperature using a circular scale and pointer.',o:['liquid-in-glass','infrared','dial','thermistor'],a:2,ex:['Liquid-in-glass thermometers use a tube with expanding liquid (mercury/alcohol) and a linear scale, not a circular one.','Infrared thermometers measure surface temperature remotely using infrared radiation — no circular scale/pointer.','CORRECT — A DIAL thermometer uses a bimetallic strip or Bourdon tube mechanism connected to a circular scale with a pointer to indicate temperature. Common on boilers and piping.','Thermistors are electronic resistance-based temperature sensors — they output electrical signals, not mechanical pointer readings.'],h:'dial'},
{n:2,p:5,t:'mc',q:'Heat that causes changes in temperature that can be measured is ___ heat.',o:['specific','latent','vaporized','sensible'],a:3,ex:['Specific heat is a property of a substance (BTU to raise 1 lb by 1°F), not a category of heat itself.','Latent heat causes phase changes (liquid→gas) WITHOUT temperature change — it can\'t be measured with a thermometer.','Not a standard thermodynamic term for a heat category.','CORRECT — SENSIBLE heat causes measurable temperature changes. When you heat water from 50°F to 180°F, the temperature rise represents sensible heat addition. \'Sensible\' = you can sense/measure it.'],h:'sensible'},
{n:3,p:6,t:'mc',q:'Heat transfer is the flow of heat from one object or substance to another, and it occurs because of a difference in ___.',o:['speed','pressure','volume','temperature'],a:3,ex:['Speed doesn\'t drive heat transfer between objects.','Pressure differences don\'t cause heat transfer between objects.','Volume differences don\'t cause heat transfer.','CORRECT — Heat flows from higher temperature to lower temperature. A TEMPERATURE DIFFERENCE between two objects or substances is the driving force for all heat transfer (conduction, convection, radiation).'],h:'temperature'},
{n:4,p:2,t:'tf',q:'Liquids at rest exert pressure in all directions, downward, sideways, and upward.',o:['True','False'],a:0,ex:['CORRECT — Pascal\'s principle: liquids at rest exert pressure equally in ALL directions — down, sideways, and up. This is why static pressure exists at every point in a closed hydronic system, regardless of elevation.','This is a fundamental principle of fluid mechanics (Pascal\'s Law).'],h:'True'},
{n:5,p:2,t:'short',q:'Pressure drop is the term used to describe ____________________ that is consumed in moving liquids through pipes, terminal units, fittings, and other system components.',o:[],a:-1,ex:['The correct answer is: friction'],h:'friction'},
{n:6,p:2,t:'mc',q:'Static pressure in a closed hydronic system ___ pump capacity.',o:['has no effect on','increases','balances','decreases'],a:0,ex:['CORRECT — Static pressure in a closed loop has NO EFFECT on pump capacity. The pump only needs to overcome friction losses (dynamic pressure drop). Static pressure is balanced — the column of water going up equals the column coming down. This is a critical concept in hydronic design.','Static pressure doesn\'t increase pump requirements in a closed system.','Static pressure doesn\'t \'balance\' pump capacity in any meaningful way.','Static pressure doesn\'t decrease pump capacity either.'],h:'has no effect on'},
{n:7,p:5,t:'tf',q:'The amount of heat in British thermal units required to change the temperature of one pound of a substance one degree Fahrenheit is called the specific heat of that substance.',o:['True','False'],a:0,ex:['CORRECT — This defines SPECIFIC HEAT: the BTUs required to change 1 lb of a substance by 1°F. Water\'s specific heat is 1.0 BTU/lb/°F, which is why water is an excellent heat transfer medium.','This is the textbook definition of specific heat.'],h:'True'},
{n:8,p:2,t:'mc',q:'___ forces or pressures occur when a fluid is not moving but is at rest.',o:['Hygrometic','Hydrostatic','Psychrometric','Dynamic'],a:1,ex:['Hygrometric relates to humidity measurement, not pressure forces.','CORRECT — HYDROSTATIC forces/pressures occur in fluids at rest. \'Hydro\' = water, \'static\' = at rest. In a hydronic system, hydrostatic pressure is the pressure created by the weight of the water column.','Psychrometric relates to air/moisture properties, not static fluid pressure.','Dynamic forces occur when fluid is MOVING, not at rest.'],h:'Hydrostatic'},
{n:9,p:2,t:'short',q:'____________________ is any pressure that is less than atmospheric pressure.',o:[],a:-1,ex:['The correct answer is: Vacuum'],h:'Vacuum'},
{n:10,p:8,t:'short',q:'____________________ is the speed water moves through a piping section, typically expressed in feet per second (fps).',o:[],a:-1,ex:['The correct answer is: Velocity'],h:'Velocity'},
{n:11,p:5,t:'short',q:'____________________ is the amount of moisture in air compared to the amount of moisture the air would hold at the same temperature when the air is saturated.',o:[],a:-1,ex:['The correct answer is: Relative Humidity'],h:'Relative Humidity'},
{n:12,p:2,t:'mc',q:'A ___ heat exchanger is an external tube-type heat exchanger that consists of a large pressure vessel with multiple tubes that run through it.',o:['cathodic','brazed','plate','shell-and-tube'],a:3,ex:['Cathodic protection prevents corrosion — not a heat exchanger type.','Brazed plate heat exchangers are flat plate-style, not tube-type.','Plate heat exchangers use corrugated plates, not tubes in a pressure vessel.','CORRECT — A SHELL-AND-TUBE heat exchanger has tubes bundled inside a large cylindrical pressure vessel (shell). One fluid flows through the tubes while the other flows around them inside the shell.'],h:'shell-and-tube'},
{n:13,p:2,t:'tf',q:'A safety relief valve is an automatic pressure relieving device actuated by the static pressure upstream of the valve, and it opens further with the increase in pressure over the opening pressure.',o:['True','False'],a:0,ex:['CORRECT — A safety relief valve IS an automatic pressure-relieving device actuated by upstream static pressure. Required by code on all hydronic boilers to prevent catastrophic overpressure.','This is the standard definition per ASME/mechanical codes.'],h:'True'},
{n:14,p:2,t:'short',q:'The ____________________ on any closed piping circuit will dictate, by its location, the system pressure changes that will occur when the pump starts.',o:[],a:-1,ex:['The correct answer is: point of no pressure change'],h:'point of no pressure change'},
{n:15,p:2,t:'fill',q:'According to the mechanical code, the maximum operating pressure and temperature for a hydronic boiler to be considered low pressure is degrees F, and psig.',o:[],a:-1,ex:['The correct answer is: 250, 160'],h:'250, 160'},
{n:16,p:2,t:'mc',q:'A high head pump is a pump classified as above ___ hp and operating above 12\' of pressure head.',o:['1/4','1/3','1/2','2/3'],a:2,ex:['1/4 hp is below the threshold for high-head classification.','1/3 hp is below the threshold.','CORRECT — A high-head pump is classified as above 1/2 hp operating above 12 feet of head. Below this threshold, pump location is less critical. Above it, proper piping practices for NPSH become important.','2/3 hp is above the threshold but 1/2 hp is the defined boundary.'],h:'1/2'},
{n:17,p:2,t:'short',q:'Although ____________________ pumps have the advantage of being able to provide very high pressures, they discharge fluids in a pulsating flow.',o:[],a:-1,ex:['The correct answer is: reciprocating'],h:'reciprocating'},
{n:18,p:6,t:'mc',q:'As total head increases, the pump flow rate ___.',o:['decreases','is not affected','increases','balances'],a:0,ex:['CORRECT — As head (resistance) increases, pump flow DECREASES. This is shown on the pump curve — flow and head have an inverse relationship. At maximum head (shutoff), flow is zero. At maximum flow, head is minimal.','Head absolutely affects flow rate — they\'re inversely related on the pump curve.','As head increases, flow decreases, not increases.','Flow doesn\'t \'balance\' with head — it decreases.'],h:'decreases'},
{n:19,p:2,t:'short',q:'As flow occurs, there is a corresponding ____________________ loss, or pressure drop, that must be overcome by the pump.',o:[],a:-1,ex:['The correct answer is: friction'],h:'friction'},
{n:20,p:5,t:'short',q:'Glycol-based products are normally used for ____________________ protection in hydronic systems due to their temperature properties and the protection characteristics of glycol-based solutions.',o:[],a:-1,ex:['The correct answer is: corrosion'],h:'corrosion'},
{n:21,p:2,t:'tf',q:'In air elimination systems, the air separator and pre-charged expansion tank must be connected on the outlet piping of the boiler, which also creates the point of no pressure change.',o:['True','False'],a:0,ex:['CORRECT — The air separator and expansion tank MUST be on the pump suction side (point of no pressure change) so the pump adds pressure to the system rather than creating a vacuum. This prevents air from being drawn into the system.','Installing these on the discharge side would allow the pump to create negative pressure at the suction, pulling air into the system.'],h:'True'},
{n:22,p:8,t:'tf',q:'Secondary circuit pump heads have no effect on the primary circuit pumping head requirements and vice versa.',o:['True','False'],a:0,ex:['CORRECT — In primary/secondary piping, the closely-spaced tees create hydraulic isolation. Secondary pump head requirements are independent of primary pump head and vice versa. This is the fundamental advantage of primary/secondary design.','This IS the key principle of primary/secondary pumping — hydraulic independence.'],h:'True'},
{n:23,p:2,t:'tf',q:'When two circuits are interconnected, flow in one will not cause flow in the other if the pressure drop in the piping common to both is eliminated.',o:['True','False'],a:0,ex:['CORRECT — When circuits are interconnected with closely-spaced tees (minimal pressure drop between connection points), flow in one circuit will NOT cause flow in the other. This is the basis of primary/secondary piping — hydraulic decoupling.','This is the fundamental principle of closely-spaced tees in hydronic design.'],h:'True'},
{n:24,p:2,t:'mc',q:'___ is the vertical distance liquid is raised by atmospheric pressure from the surface of a supply reservoir to the centerline of the pump suction connection.',o:['Static discharge head','Total discharge lift','Static suction lift','Total static head'],a:2,ex:['Static discharge head is the vertical distance on the DISCHARGE side above the pump — different concept.','Total discharge lift includes friction losses on the discharge side — not the same as suction lift.','CORRECT — STATIC SUCTION LIFT is the vertical distance liquid must be raised by atmospheric pressure from the supply reservoir surface to the pump centerline. Important for pump NPSH calculations.','Total static head is the total elevation difference in the system — combines suction and discharge.'],h:'Static suction lift'},
{n:25,p:2,t:'tf',q:'At elevated system water temperatures, a lower cold fill pressure could be necessary to properly pressurize a system.',o:['True','False'],a:1,ex:['At higher temps, water expands more — a lower cold fill pressure gives the expansion tank more room to absorb this greater expansion.','CORRECT (False) — At elevated temperatures, water expands MORE, so you may actually need a HIGHER cold fill pressure (or larger tank) to ensure the system doesn\'t lose pressure when it cools. The statement is false — higher temps don\'t require lower cold fill pressure.'],h:'False'},
{n:26,p:2,t:'short',q:'The ideal location for a pressure reducing valve and a compression tank connection is at the ____________________ since the operation of the pump will not affect either of them.',o:[],a:-1,ex:['The correct answer is: point of no pressure change'],h:'point of no pressure change'},
{n:27,p:2,t:'tf',q:'Though the best location for air separators depends on the particular system, when possible, select a point that has both the lowest temperature and the highest pressure.',o:['True','False'],a:1,ex:['Air separators should ideally be installed at the point of LOWEST solubility (highest temperature, lowest pressure), which is typically the boiler outlet — not the hottest point necessarily.','CORRECT (False) — The best location depends on the system, but the general guideline is to install the air separator where air is MOST LIKELY to come out of solution — at the point of highest temperature and lowest pressure (typically boiler supply). The statement about selecting \'the hottest point\' oversimplifies the principle — it\'s about solubility, which depends on both temperature AND pressure.'],h:'False'},
{n:28,p:2,t:'tf',q:'When any piping system is completely filled with water and all of the air is confined to the compression tank, the point where the tank connects to the system will be a point of no pressure change and will be virtually unaffected by pump operation.',o:['True','False'],a:0,ex:['CORRECT — When the system is completely filled and all air is in the compression tank, the system operates as a true closed loop. The expansion tank absorbs volume changes from temperature variations, maintaining stable system pressure.','This describes the ideal operating condition of a properly commissioned closed hydronic system.'],h:'True'},
{n:29,p:2,t:'mc',q:'___ is the flashing of pumped liquid into vapor bubbles and the subsequent violent collapsing of those bubbles as the liquid moves from suction to discharge through a pump.',o:['Pitting','Bubbling','Cavitation','Corrosion'],a:2,ex:['Pitting is a form of localized corrosion, not caused by vapor bubble collapse.','Not a recognized technical term for this phenomenon.','CORRECT — CAVITATION is the formation and violent collapse of vapor bubbles in the pump impeller when local pressure drops below the fluid\'s vapor pressure. Causes noise, vibration, impeller damage, and reduced pump performance. Prevented by maintaining adequate NPSH.','Corrosion is a chemical/electrochemical process, not caused by bubble collapse.'],h:'Cavitation'},
{n:30,p:7,t:'mc',q:'___ pumping is a means of interconnecting piping circuits so that the operation of one will not affect the other.',o:['Primary-secondary','Parallel','Secondary-tertiary','Series'],a:0,ex:['CORRECT — PRIMARY-SECONDARY pumping interconnects circuits with closely-spaced tees so that operation of one circuit doesn\'t affect another. Each circuit has its own pump, and the tees provide hydraulic isolation between primary and secondary loops.','Parallel pumping uses multiple pumps on the same circuit — doesn\'t provide hydraulic isolation between different circuits.','Secondary-tertiary is an extension of primary-secondary, not the basic concept described.','Series pumping puts pumps in sequence to increase head — doesn\'t provide hydraulic isolation.'],h:'Primary-secondary'},
{n:31,p:5,t:'mc',q:'A ___ control valve is a silent, efficient, nonelectric control valve that provides reliable temperature control for a hydronic terminal unit.',o:['check','thermostatic','zone','drain'],a:1,ex:['Check valves prevent backflow but don\'t control temperature.','CORRECT — THERMOSTATIC control valves use a temperature-sensing element to automatically modulate flow in response to temperature changes. Silent operation, no electrical power needed — the wax element or liquid-filled bellows expands and contracts with temperature.','Zone valves are electrically actuated on/off valves — not thermostatic, not silent.','Drain valves are for draining the system — no temperature control function.'],h:'thermostatic'},
{n:32,p:2,t:'mc',q:'A ___ is a fitting that creates a greater-than-normal pressure drop in a line in order to divert flow to another line.',o:['three-elbow swing','coupling','supply riser','diversion fitting'],a:3,ex:['A three-elbow swing is a piping configuration for absorbing expansion, not for creating pressure drop to divert flow.','A coupling joins two pipes — doesn\'t create pressure drop or divert flow.','A supply riser is vertical piping — doesn\'t create pressure drop for flow diversion.','CORRECT — A DIVERSION FITTING (such as a Monoflo tee) creates a localized pressure drop in the main to divert a portion of the flow into a branch circuit. Used in one-pipe systems to force flow through terminal units.'],h:'diversion fitting'},
{n:33,p:4,t:'tf',q:'Swing check valves provide a high resistance to fluid flow.',o:['True','False'],a:1,ex:['Swing check valves actually have LOW resistance to flow due to their full-port design when open.','CORRECT (False) — Swing check valves provide LOW resistance to fluid flow when open. The disc swings fully open, creating a nearly unobstructed flow path. This makes them preferred where minimal pressure drop is important. Spring-loaded or lift check valves have higher resistance.'],h:'False'},
{n:34,p:2,t:'short',q:'The main limitation of ____________________ piping is that it cannot sustain high pressure and high temperature at the same time.',o:[],a:-1,ex:['The correct answer is: plastic'],h:'plastic'},
{n:35,p:7,t:'mc',q:'___ is the leading international developer of codes and standards associated with the art, science, and practice of mechanical engineering.',o:['American Society of Mechanical Engineers (ASME)','American Society for Testing and Materials (ASTM)','American Water Works Association (AWWA)','Canadian Standards Association (CSA) Group'],a:0,ex:['CORRECT — ASME (American Society of Mechanical Engineers) is the leading developer of codes and standards for mechanical engineering, including boiler and pressure vessel codes (BPVC), piping codes, and related standards that govern hydronic system design and safety.','ASTM develops material testing standards — important but not the leading developer of mechanical codes.','AWWA focuses on water utility and municipal water supply standards, not HVAC/mechanical codes.','CSA Group is a Canadian standards organization — important for Canadian installations but not the \'leading international developer\' of mechanical codes.'],h:'American Society of Mechanical Engineers (ASME)'},
{n:36,p:5,t:'mc',q:'A ___ radiator is a radiator designed to function more efficiently and at lower HTF temperatures than a traditional radiator.',o:['baseboard','finned tube','panel','radiant baseboard'],a:2,ex:['Baseboard radiators are effective but not specifically designed for lower HTF temperatures.','Finned tube radiators are conventional — not the enhanced low-temp design described.','CORRECT — PANEL radiators have large flat surfaces that emit radiant heat efficiently. Their large surface area allows them to operate effectively at lower HTF temperatures compared to conventional fin-tube or baseboard units.','Radiant baseboard is a general term — panel radiators are the specific type designed for enhanced low-temperature performance.'],h:'panel'},
{n:37,p:8,t:'short',q:'Although not technically a cabinet unit heater, a(n) ____________________ is ideal for use in a kitchen, bathroom, or other area where there is not enough wall space for a baseboard radiator or convection unit.',o:[],a:-1,ex:['The correct answer is: kickspace convection heater'],h:'kickspace convection heater'},
{n:38,p:5,t:'mc',q:'As chilled water temperatures increase, less moisture condenses out of the air, and the RH ___.',o:['decreases','increases','balances','remains unaffected'],a:1,ex:['As chilled water temp increases, less cooling occurs, so less moisture condenses — but the remaining moisture stays in the air, INCREASING RH.','CORRECT — When chilled water temperature INCREASES, less moisture is removed from the air (less condensation on the coil). More moisture remains in the air, so RELATIVE HUMIDITY INCREASES. Colder chilled water = more dehumidification = lower RH.','RH doesn\'t simply balance with chilled water temperature.','Chilled water temperature absolutely affects RH — it determines how much moisture is removed.'],h:'increases'},
{n:39,p:4,t:'mc',q:'___ systems are used on driveways, walkways, parking areas, stairways, ramps, loading docks, and other outside surfaces.',o:['Radiant floor panel','Snow melt','Radiant ceiling panel','Radiant wall panel'],a:1,ex:['Radiant floor panels heat indoor living spaces — not designed for outdoor snow/ice conditions.','CORRECT — SNOW MELT systems use embedded hydronic tubing in outdoor surfaces (driveways, walkways, ramps, loading docks) to melt snow and ice. They circulate warm glycol-water solution to keep surfaces clear.','Radiant ceiling panels are indoor systems for space heating/cooling.','Radiant wall panels are indoor systems mounted on walls.'],h:'Snow melt'},
{n:40,p:6,t:'short',q:'A(n) ____________________ is provided at each circuit in a radiant system, or for each area where the flow of HTF must be controlled, in order to provide equal distribution of heat transfer to each zone.',o:[],a:-1,ex:['The correct answer is: control valve'],h:'control valve'},
{n:41,p:2,t:'short',q:'After the PEX tubing for a radiant system is installed, it should be tested to approximately _____ psig for 24 hours.',o:[],a:-1,ex:['The correct answer is: 50'],h:'50'},
{n:42,p:5,t:'short',q:'Because a snow- and ice-melt system is designed to be installed where freezing temperatures are present, the HTF used is a ____________________ mixture.',o:[],a:-1,ex:['The correct answer is: glycol-water'],h:'glycol-water'},
{n:43,p:6,t:'tf',q:'The function of the control joints in a thin slab installation is to control the HTF flow rate.',o:['True','False'],a:1,ex:['Control joints in concrete slabs control CRACKING from thermal expansion/contraction of the concrete — they have nothing to do with controlling HTF flow rate.','CORRECT (False) — Control joints in thin-slab installations control CONCRETE CRACKING, not HTF flow rate. They are expansion joints in the concrete to prevent random cracking as the slab expands and contracts.'],h:'False'},
{n:44,p:7,t:'tf',q:'Tubing should be placed a minimum of 2\' from structural penetrations, block outs, and piping penetrations, especially water closet bend stubs.',o:['True','False'],a:1,ex:['2 feet is too far — tubing should be placed closer to penetrations than 2 feet.','CORRECT (False) — Tubing should be placed a minimum of 6 INCHES (not 2 feet) from structural penetrations, block-outs, and piping penetrations. Two feet would waste significant floor area and create cold spots near walls and penetrations.'],h:'False'},
{n:45,p:7,t:'tf',q:'Contaminants decrease the efficiency of heating systems and cause damage to the components.',o:['True','False'],a:0,ex:['CORRECT — Contaminants (dirt, scale, flux residue, biological growth) reduce heat transfer efficiency by insulating surfaces, restrict flow through components, and damage seals, valves, and pump bearings. System cleanliness is essential.','Contaminants absolutely cause efficiency loss and component damage.'],h:'True'},
{n:46,p:7,t:'tf',q:'From the total volume needed, the amount of glycol and water is calculated from the concentration percentage.',o:['True','False'],a:0,ex:['CORRECT — To determine the volume of glycol and water needed, you calculate total system volume first, then apply the required concentration percentage. For example, 30% glycol in a 100-gallon system = 30 gallons glycol + 70 gallons water.','This is the standard method for calculating glycol/water quantities.'],h:'True'},
{n:47,p:7,t:'mc',q:'Glycol concentrations up to about ___% can be checked with a refractometer or glycol test kit.',o:['25','55','80','95'],a:1,ex:['25% is too low — refractometers can measure higher concentrations.','CORRECT — Refractometers and glycol test kits can accurately measure glycol concentrations up to about 55%. Above this concentration, more precise laboratory methods may be needed for accurate measurement.','80% exceeds the practical range of field refractometers.','95% far exceeds the measurable range of standard field instruments.'],h:'55'},
{n:48,p:6,t:'tf',q:'In a hydronic system, HTF flow problems include air in the system that causes air lock, cavitation, HTF deterioration, and inefficient heat transfer.',o:['True','False'],a:0,ex:['CORRECT — Air in hydronic systems causes air lock (blocking flow), cavitation (pump damage), noise, corrosion (oxygen), and reduced heat transfer. All are legitimate flow problems caused by air in the system.','This accurately lists the problems caused by air in hydronic systems.'],h:'True'},
{n:49,p:7,t:'mc',q:'Of the two types of glycols used with hydronic systems, ___ glycol has better heat transfer characteristics, but it is more hazardous to handle during preparation.',o:['Benzene','Ethylene','Xylene','Propylene'],a:1,ex:['Benzene is a toxic solvent — never used as HTF in hydronic systems.','CORRECT — ETHYLENE glycol has better heat transfer characteristics than propylene glycol. It has lower viscosity and higher thermal conductivity. However, ethylene glycol is TOXIC, so propylene glycol is used where potable water contamination is possible.','Xylene is a solvent, not a glycol used in hydronic systems.','Propylene glycol has inferior heat transfer compared to ethylene glycol, but is non-toxic and preferred where safety is a concern.'],h:'Ethylene'},
{n:50,p:8,t:'mc',q:'When preparing to start a hydronic system for the first time, review the job specifications to determine the testing, ___, and adjusting work required and the requirements for reporting the results.',o:['balancing','inspecting','pressurizing','charging'],a:0,ex:['CORRECT — Before first startup, reviewing job specifications determines BALANCING requirements — the design flow rates, temperatures, and pressure drops that each circuit should achieve. Balancing ensures the system performs as designed.','Inspection is visual — doesn\'t require reviewing specifications for performance targets.','Pressurizing is a startup step but isn\'t determined by reviewing design specifications.','Charging (filling) is a physical process that doesn\'t require specification review for design parameters.'],h:'balancing'},
{n:51,p:7,t:'mc',q:'___ is a formal assessment of the functionality and efficiency of a system.',o:['Balancing','Inspecting','Commissioning','Measuring'],a:2,ex:['Balancing adjusts flow rates but isn\'t a comprehensive system assessment.','Inspecting is visual examination — not a formal functional assessment.','CORRECT — COMMISSIONING is the formal, systematic process of assessing functionality and efficiency. It verifies that all systems perform according to design intent through testing, adjusting, and documenting system performance.','Measuring is one activity within commissioning, not the overall process.'],h:'Commissioning'},
{n:52,p:6,t:'mc',q:'___ may be caused by excessive velocity present in a piping system.',o:['Erosion','Fatigue stresses','Pitting','Scale'],a:0,ex:['CORRECT — EROSION is caused by excessive fluid velocity wearing away pipe material. High-velocity flow carries particles that physically abrade pipe walls and fittings, especially at bends and restrictions. This is why maximum velocity limits (typically 4-8 fps) are specified.','Fatigue stresses are caused by cyclic pressure/temperature changes, not velocity.','Pitting is localized CORROSION caused by chemical/electrochemical attack, not velocity.','Scale is mineral deposit buildup from hard water — caused by water chemistry, not velocity.'],h:'Pitting'},
{n:53,p:2,t:'short',q:'A(n) ____________________ is a device that measures the value of a controlled variable, such as temperature, pressure, or humidity, and transmits a signal that conveys this information to a controller.',o:[],a:-1,ex:['The correct answer is: sensor'],h:'sensor'},
{n:54,p:2,t:'tf',q:'Good HTF flow is indicated by a relatively small differential pressure.',o:['True','False'],a:1,ex:['A small differential pressure across a device means low resistance/restriction — but this indicates GOOD flow is occurring through it.','CORRECT (False) — Good HTF flow is indicated by a relatively LARGE differential pressure across a coil or device, meaning the fluid is actively flowing through and encountering normal resistance. A SMALL ΔP across a coil could indicate flow is bypassing it or the coil is partially blocked.'],h:'False'},
{n:55,p:5,t:'mc',q:'For typical residential or light commercial applications, a temperature difference of about ___ may be used for both heating and cooling applications.',o:['5°F to 10°F','10°F to 20°F','20°F to 25°F','25°F to 35°F'],a:1,ex:['5-10°F is too narrow for typical residential/light commercial applications.','CORRECT — A ΔT of 10°F to 20°F is the typical design range for residential and light commercial hydronic systems. This provides a good balance between flow rate, pipe sizing, and heat delivery. (20°F ΔT is the most common residential design standard.)','20-25°F is higher than typical residential designs, though 20°F is at the upper boundary.','25-35°F is too high for standard residential applications — would require higher supply temperatures.'],h:'10°F to 20°F'},
{n:56,p:6,t:'tf',q:'In one-pipe series systems, the pipe size remains the same throughout the system because the flow rate remains the same.',o:['True','False'],a:0,ex:['CORRECT (True) — In a one-pipe SERIES system, ALL water flows through EVERY terminal unit in sequence. The flow rate is constant throughout because there are no branches or bypasses. Therefore, the pipe size remains the same (it\'s one continuous loop).','The flow rate IS constant in a series loop — every drop of water passes through every unit.'],h:'False'},
{n:57,p:5,t:'short',q:'The equivalent length of an entire piping system can be found by converting all fittings to ____________________ equivalents.',o:[],a:-1,ex:['The correct answer is: elbow'],h:'elbow'},
{n:58,p:6,t:'tf',q:'The equivalent length of pipe is based on the pipe size and velocity of the HTF.',o:['True','False'],a:0,ex:['CORRECT — Equivalent length of fittings IS based on both pipe size and fluid velocity. Larger pipes and higher velocities result in greater equivalent lengths for the same fitting type. This is why equivalent length tables are organized by pipe size.','Pipe size and velocity are both factors in determining equivalent lengths.'],h:'True'},
{n:59,p:2,t:'tf',q:'The rate of water flow through a pipe or an orifice is a function of the pressure exerted on the water and the size and material of the pipe.',o:['True','False'],a:0,ex:['CORRECT — Flow rate through a pipe or orifice IS a function of the pressure applied. Higher pressure = higher flow rate through a given restriction. This is the fundamental relationship described by flow equations and used in sizing calculations.','This is a basic fluid mechanics principle — pressure drives flow.'],h:'True'},
{n:60,p:6,t:'mc',q:'The water flow velocity should normally be between 2.5 fps and ___ fps.',o:['4.8','6','8','9.3'],a:0,ex:['CORRECT — The maximum recommended velocity in hydronic piping is typically 4.8 fps (some references use 4 fps for small residential systems). Staying between 2.5 and 4.8 fps provides adequate flow while avoiding noise and erosion problems.','6 fps exceeds recommended velocity — would cause noise and potential erosion.','8 fps is far too high — would cause serious erosion, noise, and excessive pressure drop.','9.3 fps is dangerously high for hydronic piping — would cause severe erosion and noise.'],h:'8'},
{n:61,p:8,t:'tf',q:'Total head is the effect of friction in a pipe.',o:['True','False'],a:1,ex:['Total head is the TOTAL pressure a pump must provide to overcome ALL resistances in the system — not just pipe friction. It includes fitting losses, valve losses, equipment pressure drops, etc.','CORRECT (False) — Total head is NOT just pipe friction. Total head includes friction losses from pipe, fittings, valves, AND equipment (boilers, heat exchangers, etc.). Pipe friction is only ONE component of total head.'],h:'False'},
{n:62,p:8,t:'mc',q:'___ head is a function of the weight of HTF and the vertical height of the HTF in the system above a pump.',o:['Total','Static','Friction','Pressure'],a:1,ex:['Total head is pump-generated head including friction components — not strictly about weight and height.','CORRECT — STATIC head is the pressure created by the weight of the fluid column and its vertical height above a reference point. It\'s purely a function of fluid density and elevation — not affected by flow rate or pipe friction.','Friction head is caused by fluid flow resistance, not weight and height.','Pressure head is a general term — not specifically defined by weight and vertical height.'],h:'Static'},
{n:63,p:1,t:'mc',q:'Determine the flow rate in gpm required to heat a building with 650,000 Btuh heat loss when using the standard heating temperature drop.',o:['65','6.5','650','13','130','1.35'],a:0,ex:['CORRECT — Using Q = (BTU/h) ÷ (500 × ΔT): 650,000 ÷ (500 × 20) = 650,000 ÷ 10,000 = 65 GPM. The \'500\' factor comes from: 8.33 lb/gal × 60 min/hr × 1.0 specific heat.','Decimal point error — 6.5 is ten times too low.','650 is ten times too high.','13 uses a ΔT of 100°F, which is incorrect.','130 uses an incorrect ΔT calculation.','1.35 is incorrect by a large factor.'],h:'65'},
{n:64,p:2,t:'mc',q:'If a hydronic system uses water as the HTF, it requires the use of a PRV to control the static pressure. About what pressure would that PRV be set for if the building has a height of 40 feet from the top of the system to the PRV?',o:['22 psig','17.3 psig','92.4 psig','97 psig'],a:0,ex:['CORRECT — For a 3-story building (approximately 30 feet), static pressure at the fill point = height × 0.433 psi/ft + safety margin. 30 ft × 0.433 = 13 psi, plus approximately 4 psi safety margin for expansion tank pre-charge = approximately 17-18 psi minimum. A 22 psig PRV setting provides adequate static pressure plus margin for the highest point. (Exact calculation depends on building specifics.)','17.3 psig may not provide adequate margin above the minimum static requirement.','92.4 psig is far too high for a typical hydronic heating system.','97 psig is dangerously high for standard hydronic equipment rated for low-pressure operation.'],h:'22 psig'},
{n:65,p:6,t:'essay',q:'Complete a drawing of a 3-way valve installation. The system has a heat generator that uses a cooling tower to cool the water back down. The valve is a 3-way diverting valve and the failsafe mode is to bypass the cooling tower while maintaining flow through the heat generator at all times. When completed, hand in the diagram to the instructor. Use the following equipment; pump 3-way diverting valve all other valves and equipment needed for proper operation (shut-off valves, balance, bleed, drain, unions or flanges, etc.) use a straight edge and proper symbols label the valves ports and show arrows for the direction of flow',o:[],a:-1,ex:[]},
{n:66,p:1,t:'fill',q:'Using the Taco 0011 pump curve in the handouts, answer the following questions. System static is 12 psig with the compression tank on the suction side of the pump. With the pump running, the suction gauge reads psig. The current discharge gauge reading is 15.7 psig. The current flow rate is gpm. If the building has a heat loss of 180,000 Btuh, the required flow rate using the standard ΔT (heating) should be gpm. If the triple duty valve is adjusted to achieve the flow rate required for the building, the discharge gauge should read psig. Answers should be numerical only, and round to the nearest .5 (ex; 1 or 1.5 or 2)',o:[],a:-1,ex:['The correct answer is: 12, 24, 18, 18.5'],h:'12, 24, 18, 18.5'},
{n:67,p:2,t:'mc',q:'According to the Wisconsin State Code, another term for a low pressure boiler is a _______.',o:['Power boiler','Heating boiler','Neither is correct'],a:1,ex:['A power boiler is HIGH-pressure (above 15 psig). This is the opposite.','CORRECT — Under Wisconsin State Code and ASME, a low-pressure steam boiler (≤15 psig) is classified as a \'heating boiler,\' typically used for space heating.','Answer B is correct.']},
{n:68,p:7,t:'mc',q:'The generation and release of steam in a boiler creates a very _________ boiler water line.',o:['low','high','steady','turbulent'],a:3,ex:['Water line fluctuates but isn\'t characteristically low.','Steam generation doesn\'t inherently push water level high.','Opposite of what happens during active steam generation.','CORRECT — Boiling creates vigorous turbulence at the water surface. Steam bubbles constantly form, rise, and burst, causing the water level to fluctuate erratically. This is why gauge glasses show a \'dancing\' water line.']},
{n:69,p:2,t:'mc',q:'One pound of steam when condensing at 0 psig will give up;',o:['1 btu','144 btu\'s','180 btu\'s','970.4 btu\'s'],a:3,ex:['1 BTU raises 1 lb of water by 1°F — not the latent heat of steam.','144 BTU/lb is the latent heat of fusion for ICE, not steam.','180 BTU is the sensible heat to raise 1 lb water from 32°F to 212°F.','CORRECT — The latent heat of vaporization at atmospheric pressure (0 psig / 212°F) is ~970.4 BTU/lb. This is the energy released when 1 lb of steam condenses. Critical value for steam system design.']},
{n:70,p:2,t:'mc',q:'High pressure steam is considered to be;',o:['anything above 0 psig','higher than 10 psig','higher than 15 psig','none of the above are correct'],a:2,ex:['Any positive pressure doesn\'t qualify — low pressure extends up to 15 psig.','10 psig is still within the low-pressure range.','CORRECT — Per ASME code, steam above 15 psig = high-pressure (power) boiler. At or below 15 psig = low-pressure (heating) boiler. This threshold affects licensing, inspections, and safety requirements.','Answer C is correct.']},
{n:71,p:2,t:'mc',q:'The device that controls the pressure in a low pressure steam boiler is called __________.',o:['a pressuretrol','an aquastat','a thermostat','a thermocouple'],a:0,ex:['CORRECT — A pressuretrol is a pressure-activated switch that controls the burner based on steam pressure — turns burner off at cut-out, on at cut-in. Primary operating control for steam boilers.','An aquastat controls temperature in hot water (hydronic) boilers, not pressure in steam boilers.','A thermostat measures room temperature and signals heat demand. Doesn\'t directly control boiler pressure.','A thermocouple senses temperature for flame safety systems. Doesn\'t control pressure.']},
{n:72,p:2,t:'mc',q:'The _______________ allows condensate to return immediately to the boiler and keeps the water from being pushed back through the return piping as the steam pressure increases.',o:['short nipple','equalizer line','system take-off riser','use of swing joints'],a:1,ex:['A short nipple is a short pipe length, not a functional component for this purpose.','CORRECT — The equalizer line connects the steam space to the return header at approximately the waterline, equalizing pressure so condensate flows freely back into the boiler without being held back by rising steam pressure.','A steam supply connection, not related to condensate return.','Swing joints accommodate thermal expansion, not condensate flow.']},
{n:73,p:8,t:'mc',q:'The location of the Hartford loop is;',o:['2" to 4" below the NOWL on the equalizer line','2" to 4" above the NOWL on the equalizer line','24" below the NOWL on the equalizer line','28" above the NOWL on the equalizer line'],a:0,ex:['CORRECT — The Hartford loop connects 2-4 inches below Normal Operating Water Level on the equalizer line, ensuring minimal water loss through return line failures while allowing normal condensate return.','Above the waterline wouldn\'t provide the protective water seal needed.','Far too low — would allow too much water to drain before protection engaged.','Above the waterline, no protection provided.']},
{n:74,p:8,t:'mc',q:'What could happen if the condensate is not removed from a heat exchanger?',o:['freezing','water hammer','loss of heat transfer','corrosion','all of the above are correct'],a:4,ex:['Partially correct — standing condensate could freeze in cold weather.','Partially correct — steam entering a flooded heat exchanger causes violent water hammer.','Partially correct — condensate occupies space where steam should be, reducing heat transfer.','Partially correct — standing condensate becomes acidic (carbonic acid) and corrodes metal.','CORRECT — All four consequences are real risks. This is why proper trapping is critical.']},
{n:75,p:8,t:'mc',q:'The vacuum breaker should be installed on the outlet of the coil because;',o:['the coil may have a large pressure drop which doesn\'t allow proper drainage','the automatic control valve may leak slightly causing the coil to remain in a vacuum even though some steam is entering the coil','both a and b are correct','neither a nor b are correct'],a:2,ex:['True but incomplete on its own.','True but incomplete on its own.','CORRECT — The outlet side is correct because: (1) large coils have significant pressure drop making the outlet more susceptible to vacuum; (2) a leaking valve can maintain vacuum while not building enough pressure to push condensate out.','Both A and B are correct.']},
{n:76,p:8,t:'tf',q:'An F & T trap modulates to the load, therefore it discharges constantly if there is a condensate load present.',o:['True','False'],a:0,ex:['CORRECT — The F&T float rises proportionally to incoming condensate, opening the valve to match flow. Under continuous load, it discharges continuously — unlike cycling traps (IB, disc).','The F&T does modulate and discharge continuously with load.']},
{n:77,p:5,t:'tf',q:'When allowed to cool below steam temperature, carbon dioxide combines with condensate to form carbonic acid.',o:['True','False'],a:0,ex:['CORRECT — CO₂ dissolves in condensate below ~300°F, forming carbonic acid (H₂CO₃) — a major source of return line corrosion. CO₂ comes from bicarbonate breakdown in feedwater.','This is a well-established corrosion mechanism in steam systems.']},
{n:78,p:2,t:'tf',q:'Every 2 feet of lift in a siphon drainage system increases pressure differential by 1 psig.',o:['True','False'],a:0,ex:['CORRECT — A 2.31-foot water column = 1 psi. Practically, every 2 feet of lift ≈ 1 psi of required ΔP. Critical for sizing traps in lift applications.','The 2 feet per 1 psi rule is a standard approximation.']},
{n:79,p:2,t:'tf',q:'A thermostatic trap will operate under vacuum and positive pressures.',o:['True','False'],a:0,ex:['CORRECT — Thermostatic traps respond to temperature difference, not pressure. They function regardless of vacuum or positive pressure, making them versatile across pressure ranges.','Thermostatic traps work on temperature, independent of pressure.']},
{n:80,p:2,t:'tf',q:'The pressure powered pump trap discharges condensate as soon as it enters the trap body.',o:['True','False'],a:1,ex:['Pump traps operate in fill/discharge cycles, not instantaneously.','CORRECT — The pump trap has two cycles: FILL (condensate collects) then DISCHARGE (motive pressure pushes condensate out). It does not discharge instantaneously upon entry.']},
{n:81,p:8,t:'tf',q:'Reduced ΔP will reduce the traps capacity.',o:['True','False'],a:0,ex:['CORRECT — ΔP is the driving force pushing condensate through the trap. Less ΔP = less force = reduced capacity. Trap sizing must always account for actual operating ΔP.','ΔP directly determines trap capacity.']},
{n:82,p:8,t:'mc',q:'What is the minimum ΔP needed to elevate condensate 12 feet?',o:['12 psig','24 psig','6 psig','3 psig'],a:2,ex:['Significantly overestimates the pressure needed.','Far too much for 12 feet of lift.','CORRECT — 1 psi supports ~2.31 feet of water. 12÷2.31≈5.2 psi. Using the practical rule (1 psi per 2 feet): 12÷2=6 psig. Accounting for friction, ~6 psig minimum.','Only supports ~6-7 feet of lift, not 12 feet.']},
{n:83,p:7,t:'mc',q:'The proper operation of the pump trap during the transfer cycle is;',o:['vent line is open; motive line is closed; condensate in is open; condensate out is closed','motive line is open; vent line is closed; condensate in is open; condensate out is closed','motive line is open; vent line is closed; condensate out is open; condensate in is closed','vent line is open; motive line is closed; condensate out is open; condensate in is closed'],a:2,ex:['This describes the FILL cycle, not transfer.','During transfer, condensate in must be CLOSED to prevent backflow.','CORRECT — Transfer cycle: motive pressure enters (open), vent closes to pressurize, condensate inlet closes (prevent backflow), condensate outlet opens for discharge.','Can\'t discharge with vent open and no motive pressure — no driving force.']},
{n:84,p:6,t:'tf',q:'Reducing the pipe size in a horizontal steam main requires the use of a concentric reducer.',o:['True','False'],a:1,ex:['An ECCENTRIC reducer (flat on bottom) is required, not concentric.','CORRECT — Concentric reducers create a bottom pocket where condensate collects, causing water hammer. An eccentric reducer (flat bottom) maintains smooth condensate flow.']},
{n:85,p:8,t:'mc',q:'What pitch is required for the condensate return piping?',o:['2" per 10 feet','1" per 10 feet','1/2" per 20 feet','1" per 20 feet'],a:3,ex:['Too steep for condensate return piping.','Acceptable for steam supply mains, but returns use a gentler slope.','Equals 1/4" per 10 feet — too little pitch.','CORRECT — Minimum 1 inch per 20 feet (= 1/2 inch per 10 feet) in the direction of flow. Provides adequate gravity drainage while being practical for long runs.']},
{n:86,p:2,t:'mc',q:'When is it recommended that the Hartford Loop be used in connection with a boiler feed pump on a low pressure boiler?',o:['always','never','only if a check valve is used after the pump','if a check valve is used it doesn\'t matter'],a:0,ex:['CORRECT — The Hartford loop should always be used on low-pressure steam boilers regardless of pump or check valve configuration. It provides essential protection against catastrophic water loss from return piping failures.','The Hartford loop is always recommended.','Needed regardless of check valve presence.','The Hartford loop matters in all configurations.']},
{n:87,p:2,t:'mc',q:'A high pressure steam main installed in the fall (40ºF) transporting 150 psig steam with 100º of superheat, will expand by how much? The pipe run is 650 feet.',o:['14\' 2-3/8"','1\' 10-1/4"','18\' 6-5/8"','1\' 5-1/16"'],a:1,ex:['Significantly overestimates the expansion.','CORRECT — At 150 psig, saturation ≈ 366°F + 100°F superheat = 466°F. ΔT from installation = 466-40 = 426°F. Using steel expansion coefficient: 650ft × 12 × 426 × 6.33×10⁻⁶ ≈ 21.1 inches ≈ 1\' 9", close to 1\' 10-1/4".','Vastly overestimated.','Underestimates the expansion for this temperature difference and length.']},
{n:88,p:2,t:'mc',q:'Which group states in their code for low-pressure heating boilers that each boiler shall be equipped with a LWCO?',o:['ANSI','ASME','ACME','ARI'],a:1,ex:['ANSI sets general standards but doesn\'t write the boiler code.','CORRECT — ASME (American Society of Mechanical Engineers) Boiler and Pressure Vessel Code, Section IV, requires LWCOs on steam heating boilers.','ACME is not a standards-setting organization for boilers.','ARI (now AHRI) deals with air conditioning/refrigeration, not boiler codes.']},
{n:89,p:2,t:'tf',q:'It is essential to install a pressure reducing valve on the inlet cold water supply to a boiler water feeder.',o:['True','False'],a:1,ex:['A PRV on the water supply isn\'t essential in all installations.','CORRECT — Not universally required. The water feeder itself controls flow. What IS essential is that supply pressure exceeds boiler operating pressure so water can flow in when the feeder opens.']},
{n:90,p:8,t:'mc',q:'What may happen if the boiler water level drops below the minimum safe water level?',o:['the low water condition won\'t allow the boiler feed water pump to operate','the low water condition will open the relief valve due to the lack of a water seal','there isn\'t enough water to absorb the heat which could cause an explosion','all of the above are correct'],a:2,ex:['The LWCO would shut the burner, but this isn\'t what \'happens\' if water actually drops too low.','The relief valve responds to pressure, not water level.','CORRECT — Exposed heating surfaces overheat without water to absorb heat. Metal weakens and can fail. If water then contacts the overheated metal, it instantly flashes to steam causing a catastrophic explosion.','Only C describes the actual dangerous consequence.']},
{n:91,p:2,t:'mc',q:'Where does the discharge of a high pressure boiler\'s pop safety get piped to?',o:['approximately 6" off the boiler room floor','into the DA tank','safely outside','none of the above are correct'],a:2,ex:['This applies to LOW-pressure boiler safety valves discharged inside the boiler room.','Safety valve discharge cannot be piped into any enclosed vessel.','CORRECT — High-pressure safety valve discharge must be piped safely outdoors. The tremendous volume and force would be dangerous inside. Discharge pipe must be adequately sized and supported.','Answer C is correct.']},
{n:92,p:4,t:'mc',q:'What is the pipe size range for the bottom blow-down piping of a power boiler have to be?',o:['1/2" to 2"','1" to 2"','3/4" to 2-1/2"','1" to 2-1/2"'],a:3,ex:['1/2" is too small for power boiler blowdown.','Upper range extends to 2-1/2", not just 2".','3/4" is below the code minimum.','CORRECT — Per ASME code: minimum 1" (adequate flow) to maximum 2-1/2" (prevents too-rapid water loss).']},
{n:93,p:2,t:'mc',q:'What is the code for steam outlet piping for multiple high pressure boilers tied into the same header?',o:['must have 2 valves, one slow opening and one quick opening','must have 2 valves, first one a non-return valve and the second a gate valve','must have 2 valves, first one a gate valve and the second a stop/check','none of the above are correct'],a:1,ex:['Quick-opening valves are not required.','CORRECT — Each outlet needs: (1) non-return valve (stop-check) closest to boiler prevents backflow; (2) OS&Y gate valve between non-return and header for manual isolation. Prevents shutdown boiler from being pressurized by running boilers.','Order reversed — non-return goes FIRST (closest to boiler).','Answer B is correct.']},
{n:94,p:5,t:'mc',q:'Storing water from a converter is not efficient because;',o:['it will lose temperature if it\'s not used promptly','it will overheat and boil when the steam is turned off','both are correct','neither is correct'],a:2,ex:['True but incomplete — standby heat loss through tank walls.','True but incomplete — residual heat can cause temperature control issues.','CORRECT — Both problems reduce efficiency: standby losses from stored hot water, and thermal dynamics causing overheating when steam cycles off. Instantaneous heating is generally more efficient for converters.','Both are correct.']},
{n:95,p:8,t:'mc',q:'The purpose of the condenser in a HP steam system is to;',o:['condense the unused steam so it can be returned to the boiler feed system','condense the feed-water for the boiler','condense the steam before it goes into the turbine','none of the above are correct'],a:0,ex:['CORRECT — The condenser receives turbine exhaust steam, condenses it back to water for return to the feedwater system. Also creates vacuum on turbine exhaust, improving efficiency.','Feedwater is already liquid.','Steam must be vapor to power the turbine.','Answer A is correct.']},
{n:96,p:8,t:'mc',q:'The cooling towers for a HP steam system are used to;',o:['take heat away from the superheated steam to be used in the turbines','take heat away from the water being used in the condensers','to supply water to the re-heaters for the second stage of turbines','none of the above are correct'],a:1,ex:['Cooling towers don\'t interact with steam directly.','CORRECT — Cooling towers reject heat from condenser cooling water to the atmosphere through evaporation and convection. The cooled water returns to the condenser to repeat the cycle.','Cooling towers handle cooling water, not steam or feedwater.','Answer B is correct.']},
{n:97,p:1,t:'num',q:'How many BTUs are given up when steam at 75 psia condenses to form 5 pounds of condensate, and cools to 240°F?',o:[],a:-1,ex:['From steam tables at 75 psia: tsat ≈ 307.6°F, hfg ≈ 895.6 BTU/lb, hf at 307.6°F ≈ 277.4 BTU/lb, hf at 240°F ≈ 208.5 BTU/lb.','Heat per pound = hfg + (hf@307.6 − hf@240) = 895.6 + 68.9 = 964.5 BTU/lb.','For 5 pounds: 964.5 × 5 ≈ 4,618 BTUs (values may vary slightly by steam table edition).'],h:'≈ 4,618 BTUs'},
{n:98,p:2,t:'num',q:'What is the saturation temperature of steam at 50.3 psig?',o:[],a:-1,ex:['Convert: 50.3 psig + 14.7 = 65 psia.','From steam tables at 65 psia → saturation temperature ≈ 298°F.','Key skill: converting gauge to absolute pressure, then reading the steam table.'],h:'≈ 298°F'},
{n:99,p:1,t:'num',q:'How many BTUs does it take per pound to form steam at 125.3 psig, when the water starts at 50°F?',o:[],a:-1,ex:['Convert: 125.3 psig + 14.7 = 140 psia. From steam tables at 140 psia: hf ≈ 324.8 BTU/lb, hfg ≈ 863 BTU/lb, hg ≈ 1,187.8 BTU/lb.','Energy in starting water at 50°F ≈ 50.1 BTU/lb (from subcooled water tables).','Total = hg − hf(50°F) ≈ 1,187.8 − 50.1 ≈ 1,137 BTU/lb. Includes all sensible heat (50°F to saturation) plus all latent heat.'],h:'≈ 1,137 BTUs per pound'},
{n:100,p:2,t:'mc',q:"The suction pressure is 68 psig and discharge is 225 psig. What is the compression ratio?",o:["3 to 1","2.9 to 1","5.8 to 1","2.3 to 1"],a:1,ex:["Incorrect. 3:1 would require different pressures.","CORRECT. Convert to absolute: suction = 82.7 psia, discharge = 239.7 psia. 239.7 ÷ 82.7 = 2.9 to 1. Always use absolute pressure (add 14.7).","Incorrect. 5.8:1 would be an extremely high ratio.","Incorrect. 2.3:1 results from dividing gauge pressures incorrectly."]},
{n:101,p:1,t:'mc',q:"What is the latent heat of vaporization for water at standard atmospheric pressure?",o:["144 Btu/lb","180 Btu/lb","970.4 Btu/lb","180 Btu's"],a:2,ex:["Incorrect. 144 Btu/lb is the latent heat of fusion (freezing/melting), not vaporization.","Incorrect. 180 Btu is the sensible heat to raise water from 32°F to 212°F.","CORRECT. 970.4 Btu/lb is the standard value at 212°F — the energy to change liquid water to steam without temperature change.","Incorrect. 180 Btu's is the sensible heat range and has wrong units."]},
{n:102,p:7,t:'mc',q:"Moisture in a refrigeration system can cause:",o:["Acids only","TXV freeze-up only","Loss of heat transfer only","All of the above"],a:3,ex:["Partially correct but incomplete — moisture causes more than just acids.","Partially correct but incomplete — moisture causes more than TXV freeze-up.","Partially correct but incomplete — moisture causes more than heat transfer loss.","CORRECT. Moisture causes acid formation (water + refrigerant), TXV freeze-up (ice blocks orifice), and reduced heat transfer. All three are serious."]},
{n:103,p:7,t:'mc',q:"In a refrigeration system, the evaporator is the component:",o:["Where refrigerant is squeezed to higher pressure","Where the refrigerant absorbs heat","Where refrigerant's heat is rejected","None of the above"],a:1,ex:["Incorrect. That describes the compressor.","CORRECT. The evaporator is the 'cold side' heat exchanger where low-pressure liquid refrigerant boils and absorbs heat from the space.","Incorrect. That describes the condenser.","Incorrect. The evaporator absorbs heat."]},
{n:104,p:1,t:'mc',q:"How many Btu's does 1 ton of refrigeration require per hour?",o:["12,000 Btu/day","288,000 Btu/hr","12,000 Btu/hr","144 Btu's"],a:2,ex:["Incorrect. 12,000 is per hour, not per day.","Incorrect. 288,000 Btu is per day (12,000 × 24), not per hour.","CORRECT. 1 ton = 12,000 Btu/hr. Based on melting 2,000 lbs of ice in 24 hours: 2000 × 144 ÷ 24 = 12,000 Btu/hr.","Incorrect. 144 Btu/lb is the latent heat of fusion for ice."]},
{n:105,p:2,t:'mc',q:"A 75-foot column of water will exert a pressure at the bottom of:",o:["29.46 psi","32.48 psi","173.21 psi","None of the above"],a:1,ex:["Incorrect. Check your calculation: 75 × 0.433 = 32.48 psi.","CORRECT. Water exerts 0.433 psi per foot. 75 × 0.433 = 32.48 psi.","Incorrect. This is far too high.","Incorrect. 32.48 psi is the correct answer."]},
{n:106,p:2,t:'mc',q:"The saturation temperature for R-134a at 120 psi is:",o:["98°F","69°F","171.2°F","312.1°F"],a:0,ex:["CORRECT. From the R-134a PT chart, 120 psig corresponds to approximately 98°F saturation temperature.","Incorrect. 69°F corresponds to a much lower pressure.","Incorrect. 171.2°F is far too high for R-134a at this pressure.","Incorrect. 312.1°F is unreasonably high."]},
{n:107,p:6,t:'mc',q:"If dirty filters reduce airflow over the DX coil:",o:["System capacity will decrease","The condenser compensates","The compressor compensates","System capacity will increase"],a:0,ex:["CORRECT. Less airflow = less heat transfer = reduced cooling capacity, lower evaporator temperature, and potential coil freeze-up.","Incorrect. The condenser cannot compensate for low evaporator airflow.","Incorrect. The compressor cannot compensate for low airflow.","Incorrect. Reduced airflow always reduces capacity."]},
{n:108,p:8,t:'mc',q:"What helps determine the capacity of a DX evaporator coil?",o:["Temperature difference and wet bulb temperature","Dry bulb and wet bulb temperature","Temperature difference and fluid flow rate","All of the above are correct"],a:3,ex:["Partially correct but incomplete.","Partially correct but incomplete.","Partially correct but incomplete.","CORRECT. DX evaporator capacity depends on TD, wet bulb temperature (latent load), and air/fluid flow rate. All three matter."]},
{n:109,p:7,t:'mc',q:"Why are air and non-condensables contaminants in a refrigeration system?",o:["They lower head pressure too much","They raise the head pressure causing more energy usage","They lower head pressure causing more energy usage","They cause evaporator to become logged"],a:1,ex:["Incorrect. Non-condensables raise head pressure, not lower it.","CORRECT. Non-condensables collect in the condenser, can't be condensed, raise condensing pressure, and increase energy usage.","Incorrect. They raise, not lower, head pressure.","Incorrect. The primary issue is elevated head pressure."]},
{n:110,p:2,t:'mc',q:"What is the saturation temperature of R-22 at 68 psig?",o:["117.5°F","40°F","66.2°F","34°F"],a:1,ex:["Incorrect. 117.5°F corresponds to a much higher pressure.","CORRECT. From the R-22 PT chart, 68 psig = approximately 40°F. Classic A/C design condition.","Incorrect. Check the R-22 PT chart.","Incorrect. 34°F is close but not correct for 68 psig."]},
{n:111,p:1,t:'mc',q:"How many Btu's does it take to freeze 75 lbs of water from 55°F stored at -10°F?",o:["14,100 Btu's","15,675 Btu's","10,800 Btu's","4,875 Btu's"],a:0,ex:["CORRECT. Step 1: 75×1×23=1,725. Step 2: 75×144=10,800. Step 3: 75×0.5×42=1,575. Total = 14,100 Btu.","Incorrect. Check each step of the calculation.","Incorrect. That's only the latent heat portion.","Incorrect. That's too low."]},
{n:112,p:8,t:'mc',q:"Heat removed to lower 15 lbs of water from 48°F to 39°F:",o:["0.0113 tons","135 Btu's","970 Btu's per pound","135 Btu's per pound"],a:1,ex:["Incorrect. While the ton conversion exists, 135 Btu's is the direct answer.","CORRECT. Q = mass × specific heat × ΔT = 15 × 1.0 × 9 = 135 Btu.","Incorrect. 970.4 Btu/lb is the latent heat of vaporization.","Incorrect. It's 135 Btu total, not per pound."]},
{n:113,p:2,t:'mc',q:"R-22 at 250 psig high side, want 10°F subcooling. What should liquid line temp be?",o:["107°F","117°F","127°F","84°F"],a:2,ex:["Incorrect. Check the R-22 PT chart: 250 psig ≈ 137°F.","Incorrect. 137 - 10 = 127°F, not 117°F.","CORRECT. R-22 at 250 psig ≈ 137°F SCT. Subtract 10°F subcooling: 137 - 10 = 127°F.","Incorrect. 84°F is far too low."]},
