{n:250,p:8,t:'mc',q:'Match the definition to the term. What is: Specific heat?',o:['Heat transfer by direct molecular contact','Heat transfer by fluid movement such as air or liquid currents','The amount of heat required to raise one pound of a SUBSTANCE one degree F','Temperature of air surrounding a unit'],a:2,ex:['Incorrect. This is the definition of Conduction, not Specific heat.','Incorrect. This is the definition of Convection, not Specific heat.','CORRECT — Specific heat = The amount of heat required to raise one pound of a SUBSTANCE one degree F','Incorrect. This is the definition of Ambient temperature, not Specific heat.']},
{n:251,p:3,t:'mc',q:'Match the definition to the term. What is: Superheated?',o:['A vapor at a temperature above its saturation point for a given pressure','Changing from a liquid to a vapor by heating','A liquid at a temperature below its saturation point for a given pressure','Heat absorbing fluid capable of changing states'],a:0,ex:['CORRECT — Superheated = A vapor at a temperature above its saturation point for a given pressure','Incorrect. This is the definition of Vaporization, not Superheated.','Incorrect. This is the definition of Sub-cooled, not Superheated.','Incorrect. This is the definition of Refrigerant, not Superheated.']},
{n:252,p:1,t:'mc',q:'Match the definition to the term. What is: Latent heat?',o:['Temperature of air surrounding a unit','Changing from a liquid to a vapor by heating','Heat that causes a change of state without temperature change','The amount of heat required to raise one pound of WATER one degree F'],a:2,ex:['Incorrect. This is the definition of Ambient temperature, not Latent heat.','Incorrect. This is the definition of Vaporization, not Latent heat.','CORRECT — Latent heat = Heat that causes a change of state without temperature change','Incorrect. This is the definition of BTU, not Latent heat.']},
{n:253,p:1,t:'mc',q:'Match the definition to the term. What is: Sensible heat?',o:['Heat that causes a measurable temperature change','The amount of heat required to raise one pound of a SUBSTANCE one degree F','Heat transfer by energy rays','A vapor at a temperature above its saturation point for a given pressure'],a:0,ex:['CORRECT — Sensible heat = Heat that causes a measurable temperature change','Incorrect. This is the definition of Specific heat, not Sensible heat.','Incorrect. This is the definition of Radiation, not Sensible heat.','Incorrect. This is the definition of Superheated, not Sensible heat.']},
{n:254,p:3,t:'mc',q:'Match the definition to the term. What is: Saturation point?',o:['Heat transfer by energy rays','The temperature at which a liquid boils at a specific pressure','Heat transfer by direct molecular contact','Heat absorbing fluid capable of changing states'],a:1,ex:['Incorrect. This is the definition of Radiation, not Saturation point.','CORRECT — Saturation point = The temperature at which a liquid boils at a specific pressure','Incorrect. This is the definition of Conduction, not Saturation point.','Incorrect. This is the definition of Refrigerant, not Saturation point.']},
{n:255,p:7,t:'mc',q:'Match the definition to the term. What is: Evaporation?',o:['Changing from a liquid to a vapor at low temperatures and pressures','A vapor at a temperature above its saturation point for a given pressure','Heat transfer by energy rays','The temperature at which a liquid boils at a specific pressure'],a:0,ex:['CORRECT — Evaporation = Changing from a liquid to a vapor at low temperatures and pressures','Incorrect. This is the definition of Superheated, not Evaporation.','Incorrect. This is the definition of Radiation, not Evaporation.','Incorrect. This is the definition of Saturation point, not Evaporation.']},
{n:256,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component A?',o:['Liquid line filter drier','TXV (Thermostatic Expansion Valve)','King valve (receiver outlet)','Oil separator'],a:1,ex:['Incorrect. This is the definition of Component J, not Component A.','CORRECT — Component A = TXV (Thermostatic Expansion Valve)','Incorrect. This is the definition of Component E, not Component A.','Incorrect. This is the definition of Component D, not Component A.']},
{n:257,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component B?',o:['TXV (Thermostatic Expansion Valve)','Evaporator','Condenser','Oil separator'],a:2,ex:['Incorrect. This is the definition of Component A, not Component B.','Incorrect. This is the definition of Component H, not Component B.','CORRECT — Component B = Condenser','Incorrect. This is the definition of Component D, not Component B.']},
{n:258,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component C?',o:['Receiver','Three-way dual relief valves','Muffler (discharge vibration dampener)','Evaporator'],a:2,ex:['Incorrect. This is the definition of Component K, not Component C.','Incorrect. This is the definition of Component L, not Component C.','CORRECT — Component C = Muffler (discharge vibration dampener)','Incorrect. This is the definition of Component H, not Component C.']},
{n:259,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component D?',o:['Liquid line filter drier','Oil reservoir','Oil separator','TXV (Thermostatic Expansion Valve)'],a:2,ex:['Incorrect. This is the definition of Component J, not Component D.','Incorrect. This is the definition of Component F, not Component D.','CORRECT — Component D = Oil separator','Incorrect. This is the definition of Component A, not Component D.']},
{n:260,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component E?',o:['Three-way dual relief valves','King valve (receiver outlet)','Liquid line filter drier','Oil separator'],a:1,ex:['Incorrect. This is the definition of Component L, not Component E.','CORRECT — Component E = King valve (receiver outlet)','Incorrect. This is the definition of Component J, not Component E.','Incorrect. This is the definition of Component D, not Component E.']},
{n:261,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component F?',o:['Receiver','Liquid line filter drier','Oil reservoir','Evaporator'],a:2,ex:['Incorrect. This is the definition of Component K, not Component F.','Incorrect. This is the definition of Component J, not Component F.','CORRECT — Component F = Oil reservoir','Incorrect. This is the definition of Component H, not Component F.']},
{n:262,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component G?',o:['Liquid line filter drier','TXV (Thermostatic Expansion Valve)','Sight glass / moisture indicator','Three-way dual relief valves'],a:2,ex:['Incorrect. This is the definition of Component J, not Component G.','Incorrect. This is the definition of Component A, not Component G.','CORRECT — Component G = Sight glass / moisture indicator','Incorrect. This is the definition of Component L, not Component G.']},
{n:263,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component H?',o:['Three-way dual relief valves','Evaporator','Oil reservoir','Sight glass / moisture indicator'],a:1,ex:['Incorrect. This is the definition of Component L, not Component H.','CORRECT — Component H = Evaporator','Incorrect. This is the definition of Component F, not Component H.','Incorrect. This is the definition of Component G, not Component H.']},
{n:264,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component I?',o:['Sight glass / moisture indicator','Evaporator','Compressor','King valve (receiver outlet)'],a:2,ex:['Incorrect. This is the definition of Component G, not Component I.','Incorrect. This is the definition of Component H, not Component I.','CORRECT — Component I = Compressor','Incorrect. This is the definition of Component E, not Component I.']},
{n:265,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component J?',o:['King valve (receiver outlet)','Condenser','Liquid line filter drier','Compressor'],a:2,ex:['Incorrect. This is the definition of Component E, not Component J.','Incorrect. This is the definition of Component B, not Component J.','CORRECT — Component J = Liquid line filter drier','Incorrect. This is the definition of Component I, not Component J.']},
{n:266,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component K?',o:['Condenser','Sight glass / moisture indicator','Oil separator','Receiver'],a:3,ex:['Incorrect. This is the definition of Component B, not Component K.','Incorrect. This is the definition of Component G, not Component K.','Incorrect. This is the definition of Component D, not Component K.','CORRECT — Component K = Receiver']},
{n:267,d:'component',p:7,t:'mc',q:'Identify the refrigeration system component from the diagram. What is: Component L?',o:['Three-way dual relief valves','Sight glass / moisture indicator','Compressor','Oil reservoir'],a:0,ex:['CORRECT — Component L = Three-way dual relief valves','Incorrect. This is the definition of Component G, not Component L.','Incorrect. This is the definition of Component I, not Component L.','Incorrect. This is the definition of Component F, not Component L.']},
{n:268,p:7,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: A place to store liquid refrigerant when it is not being used?',o:['Recirculator','HPR (High Pressure Receiver)','Surge Drum','Suction Accumulator'],a:1,ex:['Incorrect. This is the definition of Located above the flooded evaporator, supplies liquid by gravity feed, not A place to store liquid refrigerant when it is not being used.','CORRECT — A place to store liquid refrigerant when it is not being used = HPR (High Pressure Receiver)','Incorrect. This is the definition of Controlled-pressure vessel that provides liquid to a pump, not A place to store liquid refrigerant when it is not being used.','Incorrect. This is the definition of A vessel that protects the compressor from liquid flooding, not A place to store liquid refrigerant when it is not being used.']},
{n:269,p:7,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: A vessel that protects the compressor from liquid flooding?',o:['Oil Separator','HPR (High Pressure Receiver)','Recirculator','Suction Accumulator'],a:3,ex:['Incorrect. This is the definition of Separates oil from hot discharge gas and returns it to the compressor, not A vessel that protects the compressor from liquid flooding.','Incorrect. This is the definition of A place to store liquid refrigerant when it is not being used, not A vessel that protects the compressor from liquid flooding.','Incorrect. This is the definition of Located above the flooded evaporator, supplies liquid by gravity feed, not A vessel that protects the compressor from liquid flooding.','CORRECT — A vessel that protects the compressor from liquid flooding = Suction Accumulator']},
{n:270,p:7,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: Separates oil from hot discharge gas and returns it to the compressor?',o:['Oil Separator','Surge Drum','Intercooler','Suction Accumulator'],a:0,ex:['CORRECT — Separates oil from hot discharge gas and returns it to the compressor = Oil Separator','Incorrect. This is the definition of Controlled-pressure vessel that provides liquid to a pump, not Separates oil from hot discharge gas and returns it to the compressor.','Incorrect. This is the definition of Maintains a liquid level where booster discharge gas is de-superheated, not Separates oil from hot discharge gas and returns it to the compressor.','Incorrect. This is the definition of A vessel that protects the compressor from liquid flooding, not Separates oil from hot discharge gas and returns it to the compressor.']},
{n:271,p:7,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: Located above the flooded evaporator, supplies liquid by gravity feed?',o:['Surge Drum','Oil Separator','HPR (High Pressure Receiver)','Recirculator'],a:3,ex:['Incorrect. This is the definition of Controlled-pressure vessel that provides liquid to a pump, not Located above the flooded evaporator, supplies liquid by gravity feed.','Incorrect. This is the definition of Separates oil from hot discharge gas and returns it to the compressor, not Located above the flooded evaporator, supplies liquid by gravity feed.','Incorrect. This is the definition of A place to store liquid refrigerant when it is not being used, not Located above the flooded evaporator, supplies liquid by gravity feed.','CORRECT — Located above the flooded evaporator, supplies liquid by gravity feed = Recirculator']},
{n:272,p:2,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: Controlled-pressure vessel that provides liquid to a pump?',o:['Surge Drum','Oil Separator','Intercooler','HPR (High Pressure Receiver)'],a:0,ex:['CORRECT — Controlled-pressure vessel that provides liquid to a pump = Surge Drum','Incorrect. This is the definition of Separates oil from hot discharge gas and returns it to the compressor, not Controlled-pressure vessel that provides liquid to a pump.','Incorrect. This is the definition of Maintains a liquid level where booster discharge gas is de-superheated, not Controlled-pressure vessel that provides liquid to a pump.','Incorrect. This is the definition of A place to store liquid refrigerant when it is not being used, not Controlled-pressure vessel that provides liquid to a pump.']},
{n:273,p:3,t:'mc',q:'Match the description to the correct refrigeration vessel. What is: Maintains a liquid level where booster discharge gas is de-superheated?',o:['Intercooler','Surge Drum','Suction Accumulator','Oil Separator'],a:0,ex:['CORRECT — Maintains a liquid level where booster discharge gas is de-superheated = Intercooler','Incorrect. This is the definition of Controlled-pressure vessel that provides liquid to a pump, not Maintains a liquid level where booster discharge gas is de-superheated.','Incorrect. This is the definition of A vessel that protects the compressor from liquid flooding, not Maintains a liquid level where booster discharge gas is de-superheated.','Incorrect. This is the definition of Separates oil from hot discharge gas and returns it to the compressor, not Maintains a liquid level where booster discharge gas is de-superheated.']},
{n:274,p:3,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: Evaporator leaving air temperature?',o:['59°F — House temp 79°F minus ~20°F coil temperature drop','380 psig — R-410A PT chart at 109°F SCT','56°F — SST 44°F + 12°F superheat = 56°F','44°F — Leaving air 59°F minus ~15°F evaporator TD'],a:0,ex:['CORRECT — Evaporator leaving air temperature = 59°F — House temp 79°F minus ~20°F coil temperature drop','Incorrect. This is the definition of High side pressure (R-410A), not Evaporator leaving air temperature.','Incorrect. This is the definition of Suction line temperature, not Evaporator leaving air temperature.','Incorrect. This is the definition of SST (Saturated Suction Temperature), not Evaporator leaving air temperature.']},
{n:275,p:2,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: SST (Saturated Suction Temperature)?',o:['44°F — Leaving air 59°F minus ~15°F evaporator TD','103°F — SCT 109°F minus ~6°F (subcooling approaches 10°F target)','56°F — SST 44°F + 12°F superheat = 56°F','109°F — Outside 93°F + ~16°F high-efficiency condenser TD'],a:0,ex:['CORRECT — SST (Saturated Suction Temperature) = 44°F — Leaving air 59°F minus ~15°F evaporator TD','Incorrect. This is the definition of Liquid line temperature, not SST (Saturated Suction Temperature).','Incorrect. This is the definition of Suction line temperature, not SST (Saturated Suction Temperature).','Incorrect. This is the definition of SCT (Saturated Condensing Temperature), not SST (Saturated Suction Temperature).']},
{n:276,p:2,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: Suction line temperature?',o:['123 psig — R-410A PT chart at 44°F SST','56°F — SST 44°F + 12°F superheat = 56°F','380 psig — R-410A PT chart at 109°F SCT','59°F — House temp 79°F minus ~20°F coil temperature drop'],a:1,ex:['Incorrect. This is the definition of Low side pressure (R-410A), not Suction line temperature.','CORRECT — Suction line temperature = 56°F — SST 44°F + 12°F superheat = 56°F','Incorrect. This is the definition of High side pressure (R-410A), not Suction line temperature.','Incorrect. This is the definition of Evaporator leaving air temperature, not Suction line temperature.']},
{n:277,p:3,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: Liquid line temperature?',o:['56°F — SST 44°F + 12°F superheat = 56°F','123 psig — R-410A PT chart at 44°F SST','109°F — Outside 93°F + ~16°F high-efficiency condenser TD','103°F — SCT 109°F minus ~6°F (subcooling approaches 10°F target)'],a:3,ex:['Incorrect. This is the definition of Suction line temperature, not Liquid line temperature.','Incorrect. This is the definition of Low side pressure (R-410A), not Liquid line temperature.','Incorrect. This is the definition of SCT (Saturated Condensing Temperature), not Liquid line temperature.','CORRECT — Liquid line temperature = 103°F — SCT 109°F minus ~6°F (subcooling approaches 10°F target)']},
{n:278,p:3,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: SCT (Saturated Condensing Temperature)?',o:['109°F — Outside 93°F + ~16°F high-efficiency condenser TD','380 psig — R-410A PT chart at 109°F SCT','59°F — House temp 79°F minus ~20°F coil temperature drop','44°F — Leaving air 59°F minus ~15°F evaporator TD'],a:0,ex:['CORRECT — SCT (Saturated Condensing Temperature) = 109°F — Outside 93°F + ~16°F high-efficiency condenser TD','Incorrect. This is the definition of High side pressure (R-410A), not SCT (Saturated Condensing Temperature).','Incorrect. This is the definition of Evaporator leaving air temperature, not SCT (Saturated Condensing Temperature).','Incorrect. This is the definition of SST (Saturated Suction Temperature), not SCT (Saturated Condensing Temperature).']},
{n:279,p:2,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: Low side pressure (R-410A)?',o:['380 psig — R-410A PT chart at 109°F SCT','103°F — SCT 109°F minus ~6°F (subcooling approaches 10°F target)','44°F — Leaving air 59°F minus ~15°F evaporator TD','123 psig — R-410A PT chart at 44°F SST'],a:3,ex:['Incorrect. This is the definition of High side pressure (R-410A), not Low side pressure (R-410A).','Incorrect. This is the definition of Liquid line temperature, not Low side pressure (R-410A).','Incorrect. This is the definition of SST (Saturated Suction Temperature), not Low side pressure (R-410A).','CORRECT — Low side pressure (R-410A) = 123 psig — R-410A PT chart at 44°F SST']},
{n:280,p:2,t:'mc',q:'R-410A A/C system: house 79°F, outside 93°F, high-efficiency condenser, 10°F subcooling, 12°F superheat. What is: High side pressure (R-410A)?',o:['109°F — Outside 93°F + ~16°F high-efficiency condenser TD','123 psig — R-410A PT chart at 44°F SST','103°F — SCT 109°F minus ~6°F (subcooling approaches 10°F target)','380 psig — R-410A PT chart at 109°F SCT'],a:3,ex:['Incorrect. This is the definition of SCT (Saturated Condensing Temperature), not High side pressure (R-410A).','Incorrect. This is the definition of Low side pressure (R-410A), not High side pressure (R-410A).','Incorrect. This is the definition of Liquid line temperature, not High side pressure (R-410A).','CORRECT — High side pressure (R-410A) = 380 psig — R-410A PT chart at 109°F SCT']},
{n:281,p:8,t:'mc',q:'A cylindrical tank has a radius of 2.5 ft and height of 8 ft. What is it\'s volume in gallons?',o:['1,174.96 gallons','942.48 gallons','1,570.80 gallons','589.05 gallons'],a:0,ex:['CORRECT — V = πr²h = π × 2.5² × 8 = π × 6.25 × 8 = 157.08 ft³. Convert: 157.08 × 7.48 gal/ft³ = 1,174.96 gallons.','Incorrect. Check: V = πr²h = 157.08 ft³ × 7.48 = 1,174.96 gal.','Incorrect. π × 2.5² × 8 = 157.08, not 210 ft³.','Incorrect. Use V = πr²h, then multiply by 7.48 gal/ft³.']},
{n:282,p:2,t:'mc',q:'A 75-foot column of water exerts what pressure at the bottom?',o:['32.475 psi','21.65 psi','75 psi','43.3 psi'],a:0,ex:['CORRECT — P = H × 0.433 psi/ft = 75 × 0.433 = 32.475 psi.','Incorrect. 21.65 would be 50 ft × 0.433.','Incorrect. Must multiply by 0.433, not use height directly.','Incorrect. 43.3 would be 100 ft × 0.433.']},
{n:283,p:2,t:'mc',q:'Compound gauge reads 28" Hg barometric, 10" Hg vacuum. What is the actual pressure in psi?',o:['8.84 psi','13.76 psi','18.66 psi','4.91 psi'],a:0,ex:['CORRECT — Net = 28" - 10" = 18" Hg. P = 18 × 0.491 = 8.84 psi.','Incorrect. 28 × 0.491 = 13.76 but you must subtract vacuum first.','Incorrect. Check: (28-10) × 0.491 = 8.84.','Incorrect. 10 × 0.491 = 4.91 uses only the vacuum, not the net.']},
{n:284,p:2,t:'mc',q:'34.7 PSIA — is this gauge or absolute pressure?',o:['Already absolute (PSIA)','Gauge — need to add 14.7','Vacuum pressure','Cannot determine'],a:0,ex:['CORRECT — PSIA = Pounds per Square Inch Absolute. Already includes atmospheric pressure.','Incorrect. PSIA is already absolute.','Incorrect. 34.7 PSIA is above atmospheric.','Incorrect. The A in PSIA identifies it as absolute.']},
{n:285,p:1,t:'mc',q:'BTU to heat 50 lbs of steel (SH=0.032) from 75°F to 400°F?',o:['520 BTU','1,600 BTU','325 BTU','16,250 BTU'],a:0,ex:['CORRECT — BTU = SH × W × ΔT = 0.032 × 50 × (400-75) = 0.032 × 50 × 325 = 520 BTU.','Incorrect. 0.032 × 50 × 325 = 520.','Incorrect. 325 is ΔT, not BTU.','Incorrect. 16,250 uses SH=1.0 (water) instead of 0.032 (steel).']},
{n:286,p:1,t:'mc',q:'Latent heat of vaporization for water at atmospheric pressure?',o:['970.4 BTU/lb','144 BTU/lb','180 BTU/lb','212 BTU/lb'],a:0,ex:['CORRECT — 970.4 BTU/lb to convert water at 212°F to steam at 212°F.','Incorrect. 144 is latent heat of FUSION (ice melting).','Incorrect. 180 BTU is sensible heat (32°F to 212°F).','Incorrect. 212°F is the boiling temperature, not latent heat.']},
{n:287,p:8,t:'mc',q:'Box 24×24×18 inches, weighs 250 lbs. Density? Float in water?',o:['0.0241 lbs/in³ — floats (less dense than water at 0.0361)','0.0241 lbs/in³ — sinks','0.036 lbs/in³ — floats','0.048 lbs/in³ — sinks'],a:0,ex:['CORRECT — V=24×24×18=10,368 in³. D=250/10,368=0.0241. Water=0.0361. Since 0.0241 < 0.0361, it FLOATS.','Incorrect. Less dense than water = floats.','Incorrect. Density is 0.0241, not 0.036.','Incorrect. Density is 0.0241, not 0.048.']},
{n:288,p:5,t:'mc',q:'Convert 650°F to Celsius.',o:['342.95°C','310°C','361°C','282°C'],a:0,ex:['CORRECT — C = (F+40)×0.555−40 = 690×0.555−40 = 382.95−40 = 342.95°C.','Incorrect. (650+40)×0.555−40 = 342.95°C.','Incorrect. Check your conversion formula.','Incorrect. Use C=(F−32)×5/9 or (F+40)×0.555−40.']},
{n:289,p:2,t:'mc',q:'Pump must supply 50 ft head + 4 psi safety factor. Total pressure needed?',o:['About 26 psi','21.65 psi','50 psi','54 psi'],a:0,ex:['CORRECT — P = 50×0.433 = 21.65 + 4 psi safety = 25.65 ≈ 26 psi.','Incorrect. Must add 4 psi safety factor: 21.65+4=25.65≈26.','Incorrect. Convert feet to psi: 50×0.433=21.65, then add safety.','Incorrect. 54 psi is 50+4 without converting feet to psi.']},
{n:290,p:5,t:'mc',q:'Why not use 50-50 solder in high-temperature systems?',o:['Lower melting point = weaker joint at high temperatures','Too expensive','Cannot bond to copper','Contains illegal materials'],a:0,ex:['CORRECT — 50-50 solder melts at relatively low temps, making joints weak and prone to failure in high-temp applications. Use brazing instead.','Incorrect. Cost isn\'t the issue — it\'s structural integrity.','Incorrect. 50-50 bonds fine to copper; temp weakness is the problem.','Incorrect. The issue is melting point, not material composition.']},
{n:291,p:2,t:'mc',q:'Area of 5-inch radius circle? Force at 150 psi?',o:['78.54 in², 11,781 lbs','25 in², 3,750 lbs','31.42 in², 4,713 lbs','78.54 in², 7,854 lbs'],a:0,ex:['CORRECT — A=πr²=π×25=78.54 in². F=A×P=78.54×150=11,781 lbs.','Incorrect. Area = πr² = 78.54, not r²=25.','Incorrect. 31.42 is circumference (2πr), not area.','Incorrect. F=78.54×150=11,781 not 78.54×100.']},
{n:292,p:1,t:'mc',q:'Total BTU to cool 50 lbs water from 150°F to 0°F (freeze and cool ice)?',o:['13,900 BTU','5,900 BTU','7,200 BTU','12,100 BTU'],a:0,ex:['CORRECT — Step 1: SH×W×ΔT=1×50×118=5,900 (cool to 32°F). Step 2: LH×W=144×50=7,200 (freeze). Step 3: SH×W×ΔT=0.5×50×32=800 (cool ice to 0°F). Total=5,900+7,200+800=13,900 BTU.','Incorrect. That\'s only Step 1. Need all 3 steps = 13,900.','Incorrect. That\'s only Step 2 (latent heat of fusion).','Incorrect. Missing one calculation step.']},
{n:293,p:3,t:'mc',q:'Difference between saturated steam and superheated steam?',o:['Saturated = at boiling point for it\'s pressure; Superheated = heated above boiling point','Saturated = wet; Superheated = any dry steam','Saturated = high pressure; Superheated = low pressure','No practical difference'],a:0,ex:['CORRECT — Saturated steam is at the exact boiling temperature for it\'s pressure. Superheated steam has been heated beyond saturation — contains additional sensible heat.','Incorrect. Both can be dry; distinction is temperature vs saturation point.','Incorrect. Both exist at any pressure — it\'s about temp relative to saturation.','Incorrect. Major practical differences in heat content and behavior.']},
{n:294,p:2,t:'mc',q:'Bernoullis principle: As velocity increases, pressure ___?',o:['Decreases (and vice versa)','Increases','Stays the same','Depends on fluid type'],a:0,ex:['CORRECT — Bernoullis: velocity UP = pressure DOWN, and vice versa. Fundamental to venturis, pump curves, and many HVAC components.','Incorrect. Velocity and static pressure are INVERSELY related.','Incorrect. Pressure definitely changes with velocity.','Incorrect. Applies to all fluids — always inverse relationship.']},
{n:295,p:8,t:'mc',q:'Three methods of heat transfer?',o:['Conduction, Convection, Radiation','Conduction, Evaporation, Radiation','Sensible, Latent, Radiant','Convection, Compression, Condensation'],a:0,ex:['CORRECT — (1) Conduction: molecular contact. (2) Convection: fluid movement. (3) Radiation: electromagnetic energy rays.','Incorrect. Evaporation is phase change, not a transfer method.','Incorrect. Sensible/latent are heat types, not transfer methods.','Incorrect. Compression/condensation are processes, not transfer methods.']},
{n:296,p:2,t:'mc',q:'What is absolute pressure?',o:['Atmospheric + gauge pressure (or atmospheric − vacuum reading)','Same as gauge pressure','Only measured at sea level','Maximum system pressure'],a:0,ex:['CORRECT — PSIA = PSIG + 14.7. In vacuum: PSIA = atmospheric − vacuum reading. Always positive.','Incorrect. Gauge reads zero at atmospheric; absolute reads 14.7.','Incorrect. Can be measured anywhere.','Incorrect. Max pressure is a design spec, not absolute pressure.']},
{n:297,p:7,t:'mc',q:'Three purposes of evacuation on a refrigeration system?',o:['1) Verify no leaks, 2) Remove moisture, 3) Remove non-condensables from oil','1) Cool system, 2) Test components, 3) Remove refrigerant','1) Clean piping, 2) Remove oil, 3) Test compressor','1) Pressurize, 2) Check valves, 3) Dry filter'],a:0,ex:['CORRECT — (1) Leak verification (holds vacuum). (2) Moisture removal (lowers waters boiling point). (3) Removes air, non-condensables, and dissolved gases from oil.','Incorrect. Evacuation doesn\'t cool or remove refrigerant.','Incorrect. Removes moisture/gas, not oil or physical debris.','Incorrect. Evacuation pulls vacuum, not positive pressure.']},
{n:298,p:2,t:'mc',q:'Low-pressure boiler fittings: ASME pressure rating for steam? For water/oil/gas?',o:['125 psi steam, 200 psi water/oil/gas','15 psi steam, 30 psi water','250 psi steam, 500 psi water','50 psi steam, 100 psi water'],a:0,ex:['CORRECT — Standard ASME: 125 psi for steam, 200 psi for water/oil/gas.','Incorrect. 15 psi is max OPERATING pressure, not fitting rating.','Incorrect. 250 psi is high-pressure rating.','Incorrect. Not standard ASME values.']},
{n:299,p:2,t:'mc',q:'What determines static pressure in a hydronic system?',o:['Water HEIGHT: P = H × 0.433 psi/ft','Pump speed','Water temperature only','Pipe diameter'],a:0,ex:['CORRECT — Static pressure = height of water column × 0.433 psi/ft. A 100-ft building has 43.3 psi at the bottom.','Incorrect. Pump speed affects dynamic/flow pressure, not static.','Incorrect. Temp affects density slightly but height is primary.','Incorrect. Pipe diameter affects velocity and friction, not static head.']},
{n:300,p:2,t:'mc',q:'When hot high-pressure condensate enters a lower pressure area, what happens?',o:['Some flashes to steam — temperature drops to new boiling point','Condensate freezes','Nothing changes','Temperature increases'],a:0,ex:['CORRECT — Excess heat above the new saturation temp causes some condensate to re-evaporate (flash steam). Temp drops to the new lower boiling point.','Incorrect. Condensate is far too hot to freeze.','Incorrect. Pressure drop causes flash steam — significan\'t change.','Incorrect. Temp DROPS to new saturation temperature.']},
{n:301,p:2,t:'mc',q:'Why must condensate be at atmospheric pressure to enter a gravity-return boiler?',o:['Must overcome boiler pressure — if boiler pressure is higher, condensate backs up','Condensate must be cooled first','Pump requires atmospheric pressure','Boiler operates at vacuum'],a:0,ex:['CORRECT — In gravity return, condensate must have equal or higher pressure than boiler to flow in. If boiler steam pressure exceeds return pressure, condensate backs up.','Incorrect. Temperature isn\'t the issue — pressure differential is.','Incorrect. Gravity systems may not have a pump.','Incorrect. Low-pressure boilers operate ABOVE atmospheric.']},
{n:302,p:2,t:'mc',q:'ASME fitting rating: low-pressure boiler fittings are rated for what?',o:['125 psi steam or 200 psi water, oil, gas','15 psi steam or 30 psi water','250 psi steam or 500 psi water','50 psi or 100 psi'],a:0,ex:['CORRECT — Standard ASME rated: 125 psi steam service, 200 psi water/oil/gas service.','Incorrect. 15 psi is the OPERATING limit, not the fitting rating.','Incorrect. Those are high-pressure ratings.','Incorrect. Not standard ASME values.']},
{n:303,p:1,t:'mc',q:'Steam at 10 psi has enthalpy 1,160.4 BTU/lb, water enthalpy 148 BTU. BTU released when 20 lbs condenses and cools?',o:['20,248 BTU','23,208 BTU','14,800 BTU','1,012 BTU'],a:0,ex:['CORRECT — Per lb: 1,160.4 − 148.0 = 1,012.4 BTU/lb. For 20 lbs: 1,012.4 × 20 = 20,248 BTU.','Incorrect. (1160.4−148)×20 = 1012.4×20 = 20,248.','Incorrect. 148×100 is not the correct formula.','Incorrect. 1,012.4 is per POUND — multiply by 20.']},
{n:304,p:2,t:'mc',q:'What is gauge pressure?',o:['Pressure read on gauge — does NOT include atmospheric','Absolute pressure including atmospheric','Vacuum only','Maximum rated pressure'],a:0,ex:['CORRECT — PSIG reads ZERO at atmospheric. Does NOT include 14.7 psi atmospheric. PSIA = PSIG + 14.7.','Incorrect. Including atmospheric = absolute (PSIA).','Incorrect. Gauge can be positive or vacuum.','Incorrect. Max rated pressure is a design spec.']},
{n:305,p:1,t:'mc',q:'What is latent heat?',o:['Heat causing change of STATE without temperature change','Heat causing temperature change','Heat from friction','Heat stored in solids'],a:0,ex:['CORRECT — Hidden heat absorbed/released during phase change (melting, boiling, condensing, freezing) with NO temperature change. Example: 970.4 BTU/lb to boil water at 212°F.','Incorrect. Temp change = sensible heat.','Incorrect. Friction creates sensible heat.','Incorrect. Stored heat in solids = sensible heat content.']},
{n:306,p:1,t:'mc',q:'What is sensible heat?',o:['Heat causing TEMPERATURE change — measurable with thermometer','Heat causing phase change','Unmeasurable heat','Heat only in gases'],a:0,ex:['CORRECT — Causes measurable temperature change you can sense/detect. Example: heating water 50°F→200°F. No phase change.','Incorrect. Phase change heat = latent.','Incorrect. Sensible IS measurable — that\'s what sensible means.','Incorrect. Applies to solids, liquids, and gases.']},
{n:307,p:2,t:'mc',q:'Low suction pressure causes?',o:['Low load, low airflow (belt/motor/coil), or metering device starving evaporator','Too much refrigerant','High ambient outside','Clogged condenser'],a:0,ex:['CORRECT — Low suction = evaporator not absorbing enough heat. Causes: low load, low airflow (broken belt, bad motor, dirty/iced coil), or starving metering device.','Incorrect. Too much refrigerant = HIGH suction.','Incorrect. High ambient affects condenser (high side).','Incorrect. Clogged condenser = high HEAD pressure, not low suction.']},
{n:308,p:5,t:'mc',q:'High condensing temperature causes?',o:['Low condenser airflow, dirty condenser, non-condensables, or overcharge','Low refrigerant charge','Malfunctioning TXV','Low ambient temperature'],a:0,ex:['CORRECT — Condenser can\'t reject heat: dirty coil, bad fan, air in system, or excess refrigerant flooding condenser.','Incorrect. Low charge = LOW condensing temp.','Incorrect. TXV affects evaporator side.','Incorrect. Low ambient = LOW condensing temp.']},
{n:309,p:1,t:'mc',q:'What is a BTU?',o:['Heat to raise 1 lb of water 1°F','Heat to boil 1 lb of water','Heat to melt 1 lb of ice','Heat in 1 gallon of fuel'],a:0,ex:['CORRECT — BTU = heat energy to raise 1 pound of water by 1 degree Fahrenheit. The fundamental HVAC heat unit.','Incorrect. Boiling 1 lb = 970.4 BTU (latent heat of vaporization).','Incorrect. Melting 1 lb ice = 144 BTU (latent heat of fusion).','Incorrect. Fuel heat content varies by type.']},
{n:310,cat:'Core',p:8,t:'mc',q:'Minimum passing score for each EPA 608 section:',o:['60%','70%','80%','90%'],a:1,ex:['Incorrect.','CORRECT - 70% on each section (Core + Type) is required.','Incorrect.','Incorrect.']},
{n:311,cat:'Core',p:8,t:'mc',q:'Recovery cylinders should never be filled above what % of capacity by weight?',o:['60%','70%','80%','90%'],a:2,ex:['Incorrect.','Incorrect.','CORRECT - DOT regulation. Overfilling is extremely dangerous due to hydrostatic expansion.','Incorrect.']},
{n:312,cat:'Core',p:2,t:'mc',q:'Recovery cylinder pressure relief devices protect against:',o:['Indicating fullness','Catastrophic failure from overpressure','Faster recovery','Venting non-condensables'],a:1,ex:['Incorrect.','CORRECT - Prevents rupture from overfilling or heat exposure.','Incorrect.','Incorrect.']},
{n:313,cat:'Core',p:7,t:'mc',q:'High refrigerant concentrations in enclosed spaces can cause:',o:['Better breathing','Oxygen displacement, asphyxiation, and cardiac sensitization','No health effects','Mild skin irritation only'],a:1,ex:['Incorrect.','CORRECT - Displaces oxygen causing asphyxiation. Also causes cardiac sensitization, frostbite from liquid, respiratory damage.','Incorrect.','Incorrect.']},
{n:314,cat:'Type II',p:2,t:'mc',q:'High-pressure appliances use refrigerants with boiling points:',o:['Above 50F at atmospheric','Between -50C and 10C at atmospheric pressure','Below -100C','At exactly 0C'],a:1,ex:['Incorrect.','CORRECT - Includes R-22, R-410A, R-134a, R-407C systems.','Incorrect.','Incorrect.']},
{n:315,cat:'Type II',p:2,t:'mc',q:'R-410A is classified as what pressure category?',o:['Low-pressure','Medium-pressure','High-pressure','Very high-pressure'],a:3,ex:['Incorrect.','Incorrect.','Incorrect.','CORRECT - Operating pressures significantly higher than R-22.']},
{n:316,cat:'Type II',p:8,t:'mc',q:'Comfort cooling with 50+ lbs must be repaired when annual leak rate exceeds:',o:['5%','10%','15%','25%'],a:2,ex:['Incorrect.','Incorrect.','CORRECT - EPA requires repair at 15% for comfort cooling.','Incorrect.']},
{n:317,cat:'Type II',p:7,t:'mc',q:'Industrial/commercial refrigeration with 50+ lbs: repair when leak rate exceeds:',o:['15%','20%','30%','50%'],a:2,ex:['Incorrect. 15% is for comfort cooling.','Incorrect.','CORRECT - 30% for commercial/industrial process refrigeration.','Incorrect.']},
{n:318,cat:'Type II',p:7,t:'mc',q:'For dehydration, a system should be evacuated to:',o:['29 inches Hg','500 microns','25,000 microns','0 psig'],a:1,ex:['Incorrect. About 25,000 microns - not deep enough.','CORRECT - 500 microns lowers water boiling point well below room temperature.','Incorrect. Same as 29 inches Hg.','Incorrect. No vacuum at all.']},
{n:319,cat:'Type II',p:2,t:'mc',q:'A high-pressure cutout switch:',o:['Shuts off compressor when suction drops','Shuts off compressor when discharge rises too high','Controls fan speed','Regulates flow'],a:1,ex:['Incorrect. That is a low-pressure cutout.','CORRECT - Protects against compressor damage from excessive head pressure.','Incorrect.','Incorrect.']},
{n:320,cat:'Type II',p:7,t:'mc',q:'Moisture in a refrigeration system causes:',o:['Better lubrication','Acid formation, copper plating, and ice at metering device','Improved heat transfer','No problems'],a:1,ex:['Incorrect.','CORRECT - Moisture + refrigerant + oil = acids. Copper plating on bearings/valves. Ice blocks metering devices.','Incorrect.','Incorrect.']},
{n:321,cat:'Type II',p:3,t:'mc',q:'Superheat is:',o:['Heat added to liquid above boiling','Vapor temperature above saturation temperature at its pressure','Heat removed during condensation','Total steam heat content'],a:1,ex:['Incorrect. Liquids have subcooling, not superheat.','CORRECT - Indicates all liquid evaporated plus additional sensible heat absorbed.','Incorrect.','Incorrect.']},
{n:322,cat:'Type III',p:2,t:'mc',q:'Low-pressure appliances use refrigerants with boiling points:',o:['Below -50C','Above 10C (50F) at atmospheric pressure','Between -50C and 10C','At exactly 0C'],a:1,ex:['Incorrect.','CORRECT - R-11 (bp 75F) and R-123 (bp 82F) are examples.','Incorrect. That is high-pressure.','Incorrect.']},
{n:323,cat:'Type III',p:2,t:'mc',q:'Low-pressure evaporators typically operate:',o:['Above atmospheric pressure','At or below atmospheric (in vacuum)','At exactly 0 psig','Above 100 psig'],a:1,ex:['Incorrect.','CORRECT - Must be below atmospheric to achieve cooling temps since refrigerant boils above 50F at atmospheric.','Incorrect.','Incorrect.']},
{n:324,cat:'Type III',p:2,t:'mc',q:'A purge unit on a low-pressure chiller removes:',o:['Refrigerant automatically','Air and non-condensables that leak IN','Oil from evaporator','Nothing'],a:1,ex:['Incorrect.','CORRECT - Low-pressure systems operate in vacuum so air leaks IN. Purge unit continuously removes air from condenser.','Incorrect.','Incorrect.']},
{n:325,cat:'Type III',p:2,t:'mc',q:'Maximum nitrogen test pressure for low-pressure systems:',o:['10 psig','150 psig','System design pressure','500 psig'],a:0,ex:['CORRECT - Low-pressure vessels cannot withstand high pressures. 10 psig maximum.','Incorrect. Would damage low-pressure components.','Incorrect.','Incorrect. Catastrophically dangerous.']},
{n:326,cat:'Type III',p:2,t:'mc',q:'Low-pressure systems must be recovered to:',o:['0 psig','25 inches Hg vacuum','25 mm Hg absolute','Atmospheric'],a:2,ex:['Incorrect.','Incorrect.','CORRECT - 25 mm Hg absolute (approximately 29 inches Hg vacuum).','Incorrect.']},
{n:327,cat:'Type III',p:2,t:'mc',q:'Air leaks into low-pressure systems where:',o:['At compressor discharge','Anywhere system is below atmospheric pressure','Only at condenser','At liquid line'],a:1,ex:['Incorrect. Discharge is above atmospheric.','CORRECT - Air enters wherever vacuum exists: evaporator, low-side piping, fittings.','Incorrect.','Incorrect.']},
{n:328,cat:'Type III',p:2,t:'mc',q:'Non-condensable gases in a low-pressure chiller cause:',o:['Better efficiency','Raised condensing pressure and reduced capacity','No effect','Lower evaporator temp'],a:1,ex:['Incorrect.','CORRECT - Air takes space in condenser, raising pressure and reducing cooling capacity.','Incorrect.','Incorrect.']},
{n:329,cat:'Type III',p:2,t:'mc',q:'Low-pressure chillers typically use what compressor?',o:['Reciprocating','Scroll','Centrifugal','Screw'],a:2,ex:['Incorrect.','Incorrect.','CORRECT - Large volume of low-density vapor requires high-volume centrifugal design.','Incorrect.']},
{n:330,cat:'Type III',p:2,t:'mc',q:'Charging a low-pressure system: refrigerant added as:',o:['Vapor to high side','Liquid to evaporator charging valve','Vapor to suction only','Either to any point'],a:1,ex:['Incorrect.','CORRECT - Low pressures make vapor charging impractical. Liquid charged directly to evaporator.','Incorrect.','Incorrect.']},
{n:331,cat:'Type III',p:2,t:'mc',q:'A rupture disc on a low-pressure chiller:',o:['Can be reset','Is one-time-use, bursts at rated pressure, must be replaced','Is same as a relief valve','Is optional'],a:1,ex:['Incorrect. Cannot be reset.','CORRECT - One-time pressure relief. Once burst, must be replaced.','Incorrect. Relief valves reseat; rupture discs are destroyed.','Incorrect. Required for overpressure protection.']},
{n:332,cat:'Control Circuits',p:8,t:'mc',q:'If the thermostat calls for cooling, which terminals are connected internally?',o:['R to W','R to G only','R to Y (and usually R to G)','W to Y'],a:2,ex:['Incorrect. R-W is heating.','Incorrect. R-G is fan only.','CORRECT - Cooling call connects R to Y (compressor) and typically R to G (fan) simultaneously.','Incorrect.'],d:'thermostat'},
{n:333,cat:'Power Circuits',p:2,t:'mc',q:'The high-pressure switch (HPS) in the compressor circuit is wired:',o:['In parallel with the contactor coil','In series with the contactor coil control circuit','Across the compressor motor','In parallel with the capacitor'],a:1,ex:['Incorrect. Series wiring breaks the circuit on high pressure.','CORRECT - Wired in SERIES so if head pressure rises too high, the switch opens, de-energizing the contactor coil and stopping the compressor.','Incorrect.','Incorrect.'],d:'contactor'},
{n:334,cat:'Power Circuits',p:2,t:'mc',q:'If the high-pressure switch opens, what happens?',o:['Only the fan stops','The contactor coil de-energizes, opening power contacts, stopping the compressor','The compressor speeds up','Nothing - it is a monitoring device only'],a:1,ex:['Incorrect.','CORRECT - Opening the HPS breaks the 24V control circuit to the coil, releasing the contactor power contacts, disconnecting power to the compressor.','Incorrect.','Incorrect.'],d:'contactor'},
{n:335,cat:'General',p:8,t:'mc',q:'In HVAC, control circuits typically operate at:',o:['240V','480V','24V','12V DC'],a:2,ex:['Incorrect. 240V is line voltage for equipment.','Incorrect. 480V is commercial/industrial power.','CORRECT - 24VAC is the standard control voltage for residential and light commercial HVAC thermostats and safety controls.','Incorrect. 12V DC is automotive.']},
{n:336,cat:'BTU & Heat',p:1,t:'mc',q:'A technician measures airflow at 1,200 CFM through a cooling coil. The return air is 80°F and the supply air is 58°F. What is the sensible cooling capacity in BTU/hr?',o:['28,512 BTU/hr','25,920 BTU/hr','14,256 BTU/hr','31,680 BTU/hr'],a:0,ex:['CORRECT — Q = 1.08 × CFM × ΔT = 1.08 × 1,200 × (80-58) = 1.08 × 1,200 × 22 = 28,512 BTU/hr. The constant 1.08 accounts for air density and specific heat at standard conditions.','Incorrect. You may have used 1.0 instead of 1.08 as the constant.','Incorrect. You may have divided by 2 somewhere.','Incorrect. Check your temperature difference.'],work:'Formula: Q = 1.08 × CFM × ΔT\nGiven: CFM = 1,200 | Return = 80°F | Supply = 58°F\nStep 1: ΔT = 80 - 58 = 22°F\nStep 2: Q = 1.08 × 1,200 × 22\nStep 3: Q = 1.08 × 26,400 = 28,512 BTU/hr'},
{n:337,cat:'BTU & Heat',p:1,t:'mc',q:'A hydronic system circulates 8 GPM of water. The supply temperature is 180°F and the return is 160°F. What is the heat output in BTU/hr?',o:['96,000 BTU/hr','80,000 BTU/hr','72,000 BTU/hr','160,000 BTU/hr'],a:1,ex:['Incorrect. Check the constant used.','CORRECT — Q = 500 × GPM × ΔT = 500 × 8 × (180-160) = 500 × 8 × 20 = 80,000 BTU/hr. The constant 500 accounts for water weight (8.33 lb/gal) × specific heat (1.0) × 60 min/hr.','Incorrect.','Incorrect. You may have used 1,000 instead of 500.'],work:'Formula: Q = 500 × GPM × ΔT\nGiven: GPM = 8 | Supply = 180°F | Return = 160°F\nStep 1: ΔT = 180 - 160 = 20°F\nStep 2: Q = 500 × 8 × 20 = 80,000 BTU/hr\nNote: 500 comes from 8.33 lb/gal × 1.0 Btu/lb·°F × 60 min/hr ≈ 500'},
{n:338,cat:'BTU & Heat',p:1,t:'mc',q:'How many BTUs are required to raise 40 gallons of water from 50°F to 140°F?',o:['29,988 BTU','36,000 BTU','33,320 BTU','30,000 BTU'],a:0,ex:['CORRECT — Q = Weight × ΔT × Specific Heat. Weight = 40 gal × 8.33 lb/gal = 333.2 lbs. Q = 333.2 × (140-50) × 1.0 = 333.2 × 90 = 29,988 BTU.','Incorrect. You may have used 8.0 lb/gal instead of 8.33.','Incorrect.','Incorrect. Close but not accounting for actual water weight.'],work:'Formula: Q = m × c × ΔT\nGiven: Volume = 40 gal | Start = 50°F | End = 140°F\nStep 1: Mass = 40 gal × 8.33 lb/gal = 333.2 lbs\nStep 2: ΔT = 140 - 50 = 90°F\nStep 3: Q = 333.2 × 1.0 × 90 = 29,988 BTU'},
{n:339,cat:'BTU & Heat',p:1,t:'mc',q:'A building has a heat loss of 120,000 BTU/hr. How many square feet of steam radiation (EDR) are needed?',o:['500 sq ft EDR','800 sq ft EDR','720 sq ft EDR','480 sq ft EDR'],a:0,ex:['CORRECT — Each square foot of steam EDR delivers 240 BTU/hr. EDR = 120,000 ÷ 240 = 500 sq ft.','Incorrect. You may have used 150 BTU/hr (that\'s for hot water EDR, not steam).','Incorrect.','Incorrect.'],work:'Formula: EDR = Total BTU/hr ÷ BTU per sq ft\nGiven: Heat loss = 120,000 BTU/hr | Steam EDR = 240 BTU/hr per sq ft\nStep 1: EDR = 120,000 ÷ 240 = 500 sq ft\nNote: Steam EDR = 240 BTU/hr per sq ft | Hot Water EDR = 150 BTU/hr per sq ft'},
{n:340,cat:'BTU & Heat',p:1,t:'mc',q:'A boiler is rated at 4 BHP (Boiler Horsepower). What is its output in BTU/hr?',o:['100,000 BTU/hr','133,900 BTU/hr','167,375 BTU/hr','200,000 BTU/hr'],a:1,ex:['Incorrect.','CORRECT — 1 BHP = 33,475 BTU/hr. So 4 × 33,475 = 133,900 BTU/hr.','Incorrect. You may have multiplied by 5 instead of 4.','Incorrect.'],work:'Formula: Output = BHP × 33,475\nGiven: BHP = 4\nStep 1: Output = 4 × 33,475 = 133,900 BTU/hr\nNote: 1 BHP = 33,475 BTU/hr = evaporating 34.5 lbs of water per hour at 212°F'},
{n:341,cat:'Refrigeration',p:2,t:'mc',q:'An R-410A system has a suction pressure of 118 psig. The suction line temperature is 52°F. The saturated suction temperature at 118 psig is 40°F. What is the superheat?',o:['92°F','78°F','12°F','52°F'],a:2,ex:['Incorrect. You added instead of subtracting.','Incorrect.','CORRECT — Superheat = Actual temp − Saturation temp = 52°F − 40°F = 12°F. This tells you the refrigerant is fully vaporized plus 12° of additional sensible heat.','Incorrect. 52°F is the actual line temperature, not the superheat.'],work:'Formula: Superheat = Actual Suction Line Temp − Saturated Suction Temp\nGiven: Suction pressure = 118 psig → Sat temp = 40°F | Line temp = 52°F\nStep 1: SH = 52 - 40 = 12°F\nNormal range: 8-12°F superheat for most TXV systems'},
{n:342,cat:'Refrigeration',p:2,t:'mc',q:'An R-410A system has a liquid line pressure of 418 psig (saturation temp = 110°F). The liquid line temperature reads 98°F. What is the subcooling?',o:['98°F','12°F','110°F','318°F'],a:1,ex:['Incorrect.','CORRECT — Subcooling = Saturation temp − Actual liquid temp = 110°F − 98°F = 12°F. This means the liquid is 12° below its boiling point, ensuring solid liquid reaches the metering device.','Incorrect. 110°F is the saturation temperature.','Incorrect.'],work:'Formula: Subcooling = Saturated Liquid Temp − Actual Liquid Line Temp\nGiven: Liquid pressure = 418 psig → Sat temp = 110°F | Line temp = 98°F\nStep 1: SC = 110 - 98 = 12°F\nNormal range: 10-15°F subcooling for most systems'},
{n:343,cat:'Refrigeration',p:2,t:'mc',q:'A compressor has a suction pressure of 70 psig and a discharge pressure of 325 psig. What is the compression ratio? (Atmospheric pressure = 14.7 psia)',o:['4.64:1','4.01:1','3.91:1','5.12:1'],a:1,ex:['Incorrect. You may not have converted to absolute pressure correctly.','CORRECT — Must convert to PSIA first. Suction = 70 + 14.7 = 84.7 psia. Discharge = 325 + 14.7 = 339.7 psia. CR = 339.7 ÷ 84.7 = 4.01:1','Incorrect.','Incorrect.'],work:'Formula: CR = Discharge PSIA ÷ Suction PSIA\nGiven: Suction = 70 psig | Discharge = 325 psig\nStep 1: Convert to PSIA → Suction = 70 + 14.7 = 84.7 psia\nStep 2: Discharge = 325 + 14.7 = 339.7 psia\nStep 3: CR = 339.7 ÷ 84.7 = 4.01:1\nIMPORTANT: Always use absolute pressure (PSIA), not gauge (PSIG)'},
{n:344,cat:'Refrigeration',p:1,t:'mc',q:'A refrigeration system removes 60,000 BTU/hr from a walk-in cooler. How many tons of refrigeration is this?',o:['3 tons','4 tons','5 tons','6 tons'],a:2,ex:['Incorrect.','Incorrect.','CORRECT — 1 ton = 12,000 BTU/hr. Tons = 60,000 ÷ 12,000 = 5 tons.','Incorrect.'],work:'Formula: Tons = BTU/hr ÷ 12,000\nGiven: Capacity = 60,000 BTU/hr\nStep 1: Tons = 60,000 ÷ 12,000 = 5 tons\nNote: 1 ton = 12,000 BTU/hr = the cooling effect of melting 1 ton (2000 lbs) of ice in 24 hours'},
{n:345,cat:'Electrical',p:4,t:'mc',q:'A 240V single-phase compressor draws 18 amps during operation. What is the power consumption in watts?',o:['4,320 watts','2,160 watts','3,600 watts','6,480 watts'],a:0,ex:['CORRECT — P = V × I = 240 × 18 = 4,320 watts. For single phase, it\'s simply voltage times current.','Incorrect. You may have divided by 2.','Incorrect.','Incorrect.'],work:'Formula: P = V × I (single phase)\nGiven: V = 240V | I = 18A\nStep 1: P = 240 × 18 = 4,320 watts\nNote: For 3-phase → P = V × I × 1.732 (√3)'},
{n:346,cat:'Electrical',p:4,t:'mc',q:'A 24V control circuit has a relay coil rated at 40 ohms. How much current does it draw?',o:['0.6 amps','960 amps','1.67 amps','16 amps'],a:0,ex:['CORRECT — Ohm\'s Law: I = V ÷ R = 24 ÷ 40 = 0.6 amps (600 milliamps).','Incorrect. V × R is not the correct formula.','Incorrect.','Incorrect.'],work:'Formula: I = V ÷ R (Ohm\'s Law)\nGiven: V = 24V | R = 40Ω\nStep 1: I = 24 ÷ 40 = 0.6 amps\nOhm\'s Law triangle: V = I × R | I = V ÷ R | R = V ÷ I'},
{n:347,cat:'Electrical',p:4,t:'mc',q:'A 5 kW electric heat strip operates on 240V single phase. What is the amperage draw?',o:['20.83 amps','48 amps','10.42 amps','1,200 amps'],a:0,ex:['CORRECT — I = P ÷ V = 5,000W ÷ 240V = 20.83 amps. Remember to convert kW to watts first (5 kW = 5,000W).','Incorrect.','Incorrect. You may have divided by 480 instead of 240.','Incorrect.'],work:'Formula: I = P ÷ V\nGiven: P = 5 kW = 5,000W | V = 240V\nStep 1: I = 5,000 ÷ 240 = 20.83 amps\nAlso: 1 kW = 3,412 BTU/hr, so 5 kW = 17,060 BTU/hr'},
{n:348,cat:'Electrical',p:4,t:'mc',q:'What is the resistance of a run capacitor circuit that has 370V across it and draws 2.5 amps?',o:['925 ohms','148 ohms','0.00676 ohms','74 ohms'],a:1,ex:['Incorrect. You multiplied V × I.','CORRECT — R = V ÷ I = 370 ÷ 2.5 = 148 ohms.','Incorrect.','Incorrect.'],work:'Formula: R = V ÷ I\nGiven: V = 370V | I = 2.5A\nStep 1: R = 370 ÷ 2.5 = 148 ohms'},
{n:349,cat:'Conversions',p:5,t:'mc',q:'Convert 68°F to Celsius.',o:['20°C','36°C','154°C','35.5°C'],a:0,ex:['CORRECT — °C = (°F − 32) × 5/9 = (68 − 32) × 5/9 = 36 × 0.5556 = 20°C.','Incorrect. You may have multiplied by 9/5 instead of 5/9.','Incorrect. You may have added 32 instead of subtracting.','Incorrect.'],work:'Formula: °C = (°F − 32) × 5/9\nGiven: °F = 68\nStep 1: 68 - 32 = 36\nStep 2: 36 × 5/9 = 36 × 0.5556 = 20°C\nReverse: °F = (°C × 9/5) + 32'},
{n:350,cat:'Conversions',p:2,t:'mc',q:'A gauge reads 28 inches of mercury vacuum. Convert this to PSIA. (1 atm = 29.92 in. Hg = 14.696 psia)',o:['0.94 psia','13.76 psia','14.7 psia','28 psia'],a:0,ex:['CORRECT — First find how much vacuum: 28 in.Hg out of 29.92. PSIA = (29.92 − 28) ÷ 29.92 × 14.696 = 1.92 ÷ 29.92 × 14.696 = 0.0642 × 14.696 = 0.94 psia. Very close to a perfect vacuum!','Incorrect.','Incorrect. 14.7 is atmospheric — no vacuum at all.','Incorrect.'],work:'Formula: PSIA = ((29.92 − in.Hg vacuum) ÷ 29.92) × 14.696\nGiven: Vacuum = 28 in.Hg\nStep 1: Remaining pressure = 29.92 - 28 = 1.92 in.Hg\nStep 2: PSIA = (1.92 ÷ 29.92) × 14.696 = 0.0642 × 14.696 = 0.94 psia'},
{n:351,cat:'Conversions',p:2,t:'mc',q:'Convert 150 psig to psia.',o:['135.3 psia','164.7 psia','150 psia','14.7 psia'],a:1,ex:['Incorrect. You subtracted instead of adding.','CORRECT — PSIA = PSIG + 14.7 = 150 + 14.7 = 164.7 psia. Absolute pressure = gauge pressure + atmospheric pressure.','Incorrect. PSIG and PSIA are not the same.','Incorrect. 14.7 is atmospheric pressure only.'],work:'Formula: PSIA = PSIG + 14.7\nGiven: PSIG = 150\nStep 1: PSIA = 150 + 14.7 = 164.7 psia\nReverse: PSIG = PSIA − 14.7'},
{n:352,cat:'Airflow',p:6,t:'mc',q:'A round duct is 12 inches in diameter. What is the cross-sectional area in square feet?',o:['0.785 sq ft','1.0 sq ft','3.14 sq ft','113 sq ft'],a:0,ex:['CORRECT — Area = π × r² = π × (6/12)² = 3.14159 × 0.25 = 0.785 sq ft. Convert radius to feet: 6 inches = 0.5 ft.','Incorrect.','Incorrect. You calculated in square inches and forgot to convert.','Incorrect. 113 is the area in square inches, not square feet.'],work:'Formula: A = π × r² (convert to feet first)\nGiven: Diameter = 12" → Radius = 6" = 0.5 ft\nStep 1: A = π × (0.5)² = 3.14159 × 0.25 = 0.785 sq ft\nOr in sq inches: π × 6² = 113.1 sq in ÷ 144 = 0.785 sq ft'},
{n:353,cat:'Airflow',p:6,t:'mc',q:'Air flows through a 12" round duct at 800 FPM (feet per minute). What is the CFM?',o:['628 CFM','800 CFM','9,600 CFM','401 CFM'],a:0,ex:['CORRECT — CFM = Area × Velocity. Area = 0.785 sq ft (from π × 0.5²). CFM = 0.785 × 800 = 628 CFM.','Incorrect. 800 is the velocity, not the volume.','Incorrect.','Incorrect.'],work:'Formula: CFM = Area (sq ft) × Velocity (FPM)\nGiven: 12" duct → Area = 0.785 sq ft | Velocity = 800 FPM\nStep 1: CFM = 0.785 × 800 = 628 CFM\nNote: Also CFM = Velocity × (D/2)² × π ÷ 144 if working in inches'},
{n:354,cat:'BTU & Heat',p:1,t:'mc',q:'A gas furnace has an input rating of 100,000 BTU/hr and an AFUE of 92%. What is the output?',o:['100,000 BTU/hr','92,000 BTU/hr','108,696 BTU/hr','80,000 BTU/hr'],a:1,ex:['Incorrect. That\'s the input, not accounting for efficiency.','CORRECT — Output = Input × Efficiency = 100,000 × 0.92 = 92,000 BTU/hr. The remaining 8% (8,000 BTU/hr) is lost up the flue.','Incorrect. You divided instead of multiplying.','Incorrect. That would be 80% efficiency.'],work:'Formula: Output = Input × AFUE (as decimal)\nGiven: Input = 100,000 BTU/hr | AFUE = 92% = 0.92\nStep 1: Output = 100,000 × 0.92 = 92,000 BTU/hr\nNote: AFUE = Annual Fuel Utilization Efficiency'},
{n:355,cat:'Electrical',p:1,t:'mc',q:'How many BTU/hr does a 10 kW electric heater produce?',o:['29,300 BTU/hr','34,120 BTU/hr','10,000 BTU/hr','3,412 BTU/hr'],a:1,ex:['Incorrect.','CORRECT — 1 kW = 3,412 BTU/hr. So 10 × 3,412 = 34,120 BTU/hr.','Incorrect. 10,000 is watts, not BTU.','Incorrect. 3,412 is for 1 kW, not 10.'],work:'Formula: BTU/hr = kW × 3,412\nGiven: kW = 10\nStep 1: BTU/hr = 10 × 3,412 = 34,120 BTU/hr\nNote: 1 watt = 3.412 BTU/hr | 1 kW = 3,412 BTU/hr'},
{n:356,cat:'Refrigeration',p:1,t:'mc',q:'A system has a cooling capacity of 36,000 BTU/hr and a power input of 3,000 watts. What is the EER?',o:['12.0','10.8','108','0.083'],a:0,ex:['CORRECT — EER = BTU/hr ÷ Watts = 36,000 ÷ 3,000 = 12.0. Higher EER = more efficient.','Incorrect.','Incorrect. You may have multiplied.','Incorrect. That\'s watts ÷ BTU.'],work:'Formula: EER = BTU/hr ÷ Watts\nGiven: Capacity = 36,000 BTU/hr | Power = 3,000W\nStep 1: EER = 36,000 ÷ 3,000 = 12.0\nNote: SEER is seasonal average. EER is at a single condition (95°F outdoor).'},
{n:357,cat:'BTU & Heat',p:1,t:'mc',q:'Steam at 0 psig contains 970.4 BTU/lb of latent heat. How much heat is released when 200 lbs of steam condenses?',o:['194,080 BTU','97,040 BTU','388,160 BTU','4,852 BTU'],a:0,ex:['CORRECT — Q = mass × latent heat = 200 × 970.4 = 194,080 BTU. This is the heat released during condensation (phase change only, no temperature change).','Incorrect. You may have used 100 lbs.','Incorrect.','Incorrect.'],work:'Formula: Q = m × hfg\nGiven: m = 200 lbs | hfg = 970.4 BTU/lb (at 0 psig)\nStep 1: Q = 200 × 970.4 = 194,080 BTU\nNote: hfg = latent heat of vaporization. At 0 psig, steam condenses at 212°F.'},
{n:358,cat:'Airflow',p:6,t:'mc',q:'A building requires 400 CFM per ton of cooling. If the AC system is 3.5 tons, what total CFM is needed?',o:['1,400 CFM','1,200 CFM','114 CFM','4,200 CFM'],a:0,ex:['CORRECT — CFM = 400 × tons = 400 × 3.5 = 1,400 CFM. The 400 CFM/ton rule of thumb ensures proper dehumidification and comfort.','Incorrect.','Incorrect. You divided instead of multiplying.','Incorrect.'],work:'Formula: Total CFM = CFM per ton × Tons\nGiven: 400 CFM/ton | 3.5 tons\nStep 1: CFM = 400 × 3.5 = 1,400 CFM\nNote: 350-400 CFM/ton is standard. Lower CFM = better dehumidification but risk of coil icing.'},
{n:359,cat:'Conversions',p:8,t:'mc',q:'How many gallons of water are in a system that contains 1,200 lbs of water?',o:['144 gallons','10,000 gallons','100 gallons','9,996 gallons'],a:0,ex:['CORRECT — Gallons = Weight ÷ 8.33 = 1,200 ÷ 8.33 = 144 gallons. Water weighs 8.33 lbs per gallon.','Incorrect.','Incorrect.','Incorrect. You may have multiplied instead of dividing.'],work:'Formula: Gallons = Weight (lbs) ÷ 8.33\nGiven: Weight = 1,200 lbs\nStep 1: Gallons = 1,200 ÷ 8.33 = 144 gallons\nNote: 1 gallon of water = 8.33 lbs | 1 cubic foot = 7.48 gallons = 62.4 lbs'},
{n:360,cat:'BTU & Heat',p:1,t:'mc',q:'How many BTU are needed to convert 10 lbs of 212°F water into 212°F steam?',o:['2,120 BTU','1,800 BTU','9,704 BTU','970 BTU'],a:2,ex:['Incorrect.','Incorrect. 180 BTU/lb is sensible heat to raise water from 32°F to 212°F.','CORRECT — Latent heat of vaporization = 970.4 BTU/lb. Q = 10 × 970.4 = 9,704 BTU. No temperature change occurs — all energy goes into changing phase from liquid to gas.','Incorrect. That\'s for 1 lb, not 10.'],work:'Formula: Q = m × hfg\nGiven: m = 10 lbs | hfg = 970.4 BTU/lb\nStep 1: Q = 10 × 970.4 = 9,704 BTU\nKey: Sensible heat changes temperature. Latent heat changes state (phase). At 212°F/0 psig, water absorbs 970.4 BTU/lb to become steam with NO temperature change.'}
];

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function qs(){return S.shuf||S.activeQ||Q;}

// Calculate running score
function calcScore(){
const all=qs();
let cor=0,wrg=0,pts=0,maxPts=0,checked=0;
all.forEach(q=>{
if(!S.chk[q.n]) return;
if(q.a===-1) return; // skip non-gradable
checked++;
maxPts+=q.p;
if(S.ans[q.n]===q.a){cor++;pts+=q.p;}
else if(S.ans[q.n]!==undefined){wrg++;}
});
const gradable=all.filter(q=>q.a!==-1).length;
const totalGradablePts=all.filter(q=>q.a!==-1).reduce((s,q)=>s+q.p,0);
const pct=maxPts>0?Math.round((pts/maxPts)*100):0;
return {cor,wrg,pts,maxPts,checked,pct,gradable,totalGradablePts};
}

// === WRONG ANSWER ANALYSIS ===
function categorizeQuestion(q) {
  var MAP = {1:'BTU & Heat Calculations',2:'Pressure & Gas Laws',3:'Superheat & Subcooling',4:'Electrical Calculations',5:'Temperature & Conversions',6:'Flow, Sizing & Airflow',7:'Efficiency & Ratios',8:'General HVAC Math'};
  return MAP[q.p] || 'General HVAC Math';
}

function getTopicAnalysis() {
  var all = typeof qs === 'function' ? qs() : Q;
  var topics = {};
  all.forEach(function(q) {
    if (q.a === -1) return;
    var topic = categorizeQuestion(q);
    if (!topics[topic]) topics[topic] = {right:0, wrong:0, total:0};
    topics[topic].total++;
    if (S.ans[q.n] === q.a) topics[topic].right++;
    else if (S.ans[q.n] !== undefined) topics[topic].wrong++;
  });
  return topics;
}

function topicAnalysisHTML() {
  var topics = getTopicAnalysis();
  var sorted = Object.keys(topics).sort(function(a,b) {
    var pa = topics[a].total > 0 ? topics[a].wrong / topics[a].total : 0;
    var pb = topics[b].total > 0 ? topics[b].wrong / topics[b].total : 0;
    return pb - pa;
  });
  
  if (!sorted.length) return '';
  
  var html = '<div class="topic-section"><h3>Topic Breakdown — Weakest First</h3>';
  sorted.forEach(function(topic) {
    var t = topics[topic];
    if (t.right + t.wrong === 0) return;
    var pct = Math.round(t.right / (t.right + t.wrong) * 100);
    var color = pct >= 70 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--no)';
    html += '<div class="topic-bar"><span class="topic-name">' + topic + '</span>' +
      '<div class="topic-meter"><div class="topic-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<span class="topic-score" style="color:' + color + '">' + pct + '%</span>' +
      '<span class="topic-count">' + t.right + '/' + (t.right + t.wrong) + '</span></div>';
  });
  html += '</div>';
  return html;
}

    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch(e) {}
  }
  
  function recordAnswer(qn, correct) {
    const stats = loadStats();
    if (!stats[qn]) stats[qn] = { right: 0, wrong: 0, last: 0 };
    if (correct) stats[qn].right++;
    else stats[qn].wrong++;
    stats[qn].last = Date.now();
    saveStats(stats);

  // === SESSION STATE (pick up where you left off) ===
  const SESSION_KEY = 'hvac_session_' + toolId + '_' + (window._hvacUser||'guest');

    try {

      var state = { i: S.i, ans: S.ans, txt: S.txt, chk: S.chk, mode: S.mode, graded: S.graded, scr: S.scr, randomize: S.randomize };
      if (S.activeQ) state.activeQns = S.activeQ.map(function(q){return q.n;});
      if (S.shuf) state.shufQns = S.shuf.map(function(q){return q.n;});
      if (typeof S.cats !== 'undefined') state.cats = S.cats;
      if (typeof S.qtypes !== 'undefined') state.qtypes = S.qtypes;
      localStorage.setItem(SESSION_KEY, JSON.stringify(state));
    } catch(e) {}

  window.loadSession = function() {

      var state = JSON.parse(raw);
      if (!state || state.scr !== 'quiz') return false;
      S.i = state.i || 0;
      S.ans = state.ans || {};

      S.randomize = state.randomize || false;
      S.graded = state.graded || false;
      S.scr = 'quiz';
      if (state.cats && typeof S.cats !== 'undefined') S.cats = state.cats;
      if (state.qtypes && typeof S.qtypes !== 'undefined') S.qtypes = state.qtypes;
      // Restore filtered question set
      if (state.activeQns) {
        var qMap = {}; Q.forEach(function(q){qMap[q.n]=q;});
        S.activeQ = state.activeQns.map(function(n){return qMap[n];}).filter(Boolean);
      }
      if (state.shufQns) {
        var qMap2 = {}; Q.forEach(function(q){qMap2[q.n]=q;});

  function cloudSave() {
    var url = getScriptUrl();
    var user = getDisplayName();
    if (!url || user === 'guest' || user === 'Guest') return;
    
    var stats = loadStats();
    var sessionData = null;
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (raw) sessionData = JSON.parse(raw);
    } catch(e) {}
    
    fetch(url, {
      method: 'POST',
      body: JSON.stringify({
        action: 'sync_save',
        username: user,
        tool: toolId,
        stats: stats,
        session: sessionData
      })
    }).catch(function(){});
  }
  
  function cloudLoad(callback) {
    var url = getScriptUrl();
    var user = getDisplayName();
    if (!url || user === 'guest' || user === 'Guest') { if (callback) callback(); return; }
    
    fetch(url + '?action=sync_load&username=' + encodeURIComponent(user))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.progress && data.progress[toolId]) {
          var cloud = data.progress[toolId];
          
          // Merge cloud stats with local (keep highest counts)
          if (cloud.stats) {
            var local = loadStats();
            for (var qn in cloud.stats) {
              if (!local[qn]) {
                local[qn] = cloud.stats[qn];
              } else {
                local[qn].right = Math.max(local[qn].right || 0, cloud.stats[qn].right || 0);
                local[qn].wrong = Math.max(local[qn].wrong || 0, cloud.stats[qn].wrong || 0);
                local[qn].last = Math.max(local[qn].last || 0, cloud.stats[qn].last || 0);
              }
            }
            saveStats(local);
          }
          
          // Load cloud session if no local session exists
          if (cloud.session && !localStorage.getItem(SESSION_KEY)) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(cloud.session));
          }
        }
        if (callback) callback();
      })
      .catch(function() { if (callback) callback(); });
  }

  function getWeakQuestions() {
    const stats = loadStats();
    return Q.filter(q => {
      const s = stats[q.n];
      return s && s.wrong > 0 && (s.wrong >= s.right);
    });
  }
  
  function getOverallStats() {
    const stats = loadStats();
    let totalRight = 0, totalWrong = 0, attempted = 0;
    for (const k in stats) {
      totalRight += stats[k].right;
      totalWrong += stats[k].wrong;
      if (stats[k].right + stats[k].wrong > 0) attempted++;
    }
    return { totalRight, totalWrong, attempted, total: Q.length };
  }
  
  // === SPACED REPETITION WEIGHTING ===
  function spacedShuffle(questions) {
    const stats = loadStats();
    const weighted = [];
    questions.forEach(q => {
      const s = stats[q.n];
      let weight = 1;
      if (s) {
        if (s.wrong > s.right) weight = 3;
        else if (s.wrong > 0 && s.wrong === s.right) weight = 2;
        else if (s.right > 3) weight = 0.5;
        // Recency: if answered recently and correct, lower weight
        const daysSince = (Date.now() - (s.last || 0)) / 86400000;
        if (daysSince < 1 && s.right > s.wrong) weight *= 0.5;
      } else {
        weight = 1.5; // never seen = slightly boost
      }
      for (let i = 0; i < Math.ceil(weight); i++) weighted.push(q);
    });
    // Shuffle the weighted array then deduplicate keeping first occurrence
    const shuffled = weighted.sort(() => Math.random() - 0.5);
    const seen = new Set();
    return shuffled.filter(q => { if (seen.has(q.n)) return false; seen.add(q.n); return true; });
  }

  window.calcPress = function(key) {
    var d = calcDisplay;
    
    if (key === 'C') { calcDisplay = '0'; calcNew = true; }
    else if (key === '\u232b') { calcDisplay = d.length > 1 ? d.slice(0, -1) : '0'; }
    else if (key === '\u00b1') { if (d !== '0') calcDisplay = d.startsWith('-') ? d.slice(1) : '-' + d; }
    else if (key === '=') {
      try {
        var expr = d.replace(/\u00d7/g, '*').replace(/\u00f7/g, '/');
        // Sanitize: only allow digits, operators, parens, decimal, minus, e, **, Math functions
        if (/^[\d+\-*/().eE ]+$/.test(expr.replace(/Math\.[a-z]+/g,''))) {
          calcDisplay = String(+parseFloat(Function('"use strict";return (' + expr + ')')()).toPrecision(12));
        } else { calcDisplay = 'Error'; }
      } catch(e) { calcDisplay = 'Error'; }
      calcNew = true;
    }
    else if (key === 'sin') { try { calcDisplay = String(Math.sin(parseFloat(d) * Math.PI / 180)); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'cos') { try { calcDisplay = String(Math.cos(parseFloat(d) * Math.PI / 180)); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'tan') { try { calcDisplay = String(Math.tan(parseFloat(d) * Math.PI / 180)); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'asin') { try { calcDisplay = String(Math.asin(parseFloat(d)) * 180 / Math.PI); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'acos') { try { calcDisplay = String(Math.acos(parseFloat(d)) * 180 / Math.PI); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'atan') { try { calcDisplay = String(Math.atan(parseFloat(d)) * 180 / Math.PI); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'ln') { try { calcDisplay = String(Math.log(parseFloat(d))); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'log') { try { calcDisplay = String(Math.log10(parseFloat(d))); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === '\u221a') { try { calcDisplay = String(Math.sqrt(parseFloat(d))); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'x\u00b2') { try { calcDisplay = String(Math.pow(parseFloat(d), 2)); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === 'x^y') { calcDisplay = d + '**'; calcNew = false; }
    else if (key === '\u03c0') { calcDisplay = calcNew ? String(Math.PI) : d + String(Math.PI); calcNew = false; }
    else if (key === 'e') { calcDisplay = calcNew ? String(Math.E) : d + String(Math.E); calcNew = false; }
    else if (key === 'EE') { calcDisplay = d + 'e'; calcNew = false; }
    else if (key === '1/x') { try { calcDisplay = String(1 / parseFloat(d)); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if (key === '%') { try { calcDisplay = String(parseFloat(d) / 100); } catch(e) { calcDisplay = 'Error'; } calcNew = true; }
    else if ('+-*/'.indexOf(key) >= 0) { calcDisplay += key; calcNew = false; }
    else if (key === '(' || key === ')') { calcDisplay = (calcNew && d === '0' ? '' : d) + key; calcNew = false; }
    else {
      if (calcNew && d === '0') calcDisplay = key;
      else if (calcNew) { calcDisplay = key; calcNew = false; }
      else calcDisplay += key;
      calcNew = false;
    }
    
    var disp = document.getElementById('calc-disp');
    if (disp) disp.textContent = calcDisplay;
  };

  function createFABs() {
    if (document.getElementById('fab-btns')) return;
    const div = document.createElement('div');
    div.id = 'fab-btns';
    div.className = 'fab-container';
    // FABs moved to nav bar
    document.body.appendChild(div);
  }

  // === HOOK INTO EXISTING FUNCTIONS ===
  
  // Override the check function to record stats
  const origSel = window.sel;
  if (origSel) {
    window.sel = function(n, i) {
      origSel(n, i);
      cloudSaveDebounced();
    };
  }

  const origChk = window.chk;
  window.chk = function(n) {
    origChk(n);
    cloudSaveDebounced();
    // Find the question and record result
    const allQ = typeof qs === 'function' ? qs() : Q;
    const q = allQ.find(qq => qq.n === n);
    if (q && q.a !== -1) {
      recordAnswer(n, S.ans[n] === q.a);
    }
  };
  
  // Override submit to record all answers + post to leaderboard
  const origSubmit = window.submit;
  window.submit = function() {
    const allQ = typeof qs === 'function' ? qs() : Q;
    let cor = 0, wrg = 0, pts = 0, maxP = 0;
    allQ.forEach(q => {
      if (q.a !== -1 && S.ans[q.n] !== undefined) {
        S.chk[q.n] = true;
        const correct = S.ans[q.n] === q.a;
        recordAnswer(q.n, correct);
        if (correct) { cor++; pts += q.p; }
        else { wrg++; }
        maxP += q.p;
      }
    });
    S.graded = true;
    if (typeof showR === 'function') showR();
    stopTimer();
    clearSavedSession();
    cloudSave();
    // Post score to cloud leaderboard
    try {
      var scriptUrl = localStorage.getItem('hvac_script_url');
      if (scriptUrl && window._hvacUser && window._hvacUser !== 'admin') {
        var users = {}; try { users = JSON.parse(localStorage.getItem('hvac_users')||'{}'); } catch(e){}
        var display = users[window._hvacUser] ? users[window._hvacUser].display : window._hvacUser;
        fetch(scriptUrl, {
          method: 'POST',
          body: JSON.stringify({action:'submit_score',username:display,tool:toolId,correct:cor,wrong:wrg,total:cor+wrg,points:pts,maxPoints:maxP})
        }).catch(function(){});
      }
    } catch(e){}
  };
  
  // Override shuffle to use spaced repetition
  const origShuffle = window.shuffle;
  window.shuffle = function(arr) {
    if (S.mode === 'shuffle') return spacedShuffle(arr);
    return origShuffle(arr);
  };
  
  // Add weak spots mode
  window.startWeak = function() {
    const weak = getWeakQuestions();
    if (!weak.length) { alert('No weak spots yet! Take some quizzes first.'); return; }
    if (typeof filteredQ === 'function') S.activeQ = weak;
    else S.shuf = weak;
    S.scr = 'quiz'; S.i = 0; S.ans = {}; S.txt = {}; S.chk = {}; S.graded = false;
    S.mode = 'practice';
    render(); scrollTo(0, 0);
  };
  
  // Enhanced startQ with timer
  const origStartQ = window.startQ;
  window.startQ = function() {
    origStartQ();
    if (timerEnabled && S.scr === 'quiz') {
      const count = typeof qs === 'function' ? qs().length : Q.length;
      startTimer(count);
    }
  };
  
  // Override reset to stop timer  
  const origReset = window.reset;
  window.reset = function() {
    stopTimer();
    origReset();
  };
  
  // Override render to add enhancements
  const origRender = window.render;
  window.render = function() {
    origRender();
    if (S.scr === 'quiz') saveSession();
    
    // Add FABs if in quiz mode
    if (S.scr === 'quiz') {
      createFABs();
      document.getElementById('fab-btns').style.display = '';
      // Add timer if enabled
      if (timerEnabled && timerInterval) {
        const hdr = document.querySelector('.hdr');
        if (hdr && !document.getElementById('timer-display')) {
          hdr.insertAdjacentHTML('afterend', getTimerHTML());
        }
      }
    } else {
      const fabs = document.getElementById('fab-btns');
      if (fabs) fabs.style.display = 'none';
      // Close panels
      const ref = document.getElementById('ref-panel');
      if (ref) ref.classList.remove('open');
      const calc = document.getElementById('calc-panel');
      if (calc) calc.classList.remove('open');
    }
    
    // Add stats + weak spots + timer toggle to start screen
    if (S.scr === 'start') {
        // Check for saved session
        if (!document.getElementById('resume-offered')) {
          try {
            var savedRaw = localStorage.getItem(SESSION_KEY);
            if (savedRaw) {
              var saved = JSON.parse(savedRaw);
              if (saved && saved.scr === 'quiz') {
                var answered = Object.keys(saved.ans || {}).length + Object.keys(saved.txt || {}).filter(function(k){return saved.txt[k];}).length;
                var resumeTarget = document.querySelector('.start');
                if (resumeTarget) {
                  var resumeHTML = '<div id="resume-offered" style="background:rgba(74,158,255,.08);border:2px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:20px;text-align:center">' +
                    '<div style="font-size:.9em;color:var(--text);margin-bottom:8px">You have an unfinished ' + saved.mode + ' session (' + answered + ' answered)</div>' +
                    '<button class="go" onclick="if(loadSession()){render();scrollTo(0,0);}" style="margin-right:8px">Resume</button>' +
                    '<button class="nb" onclick="clearSavedSession();this.parentElement.remove();">Start Fresh</button></div>';
                  resumeTarget.insertAdjacentHTML('afterbegin', resumeHTML);
                }
              }
            }
          } catch(e) {}
        }
      const stats = getOverallStats();
      const weak = getWeakQuestions();
      const startDiv = document.querySelector('.start');
      if (startDiv && !document.getElementById('enhance-stats')) {
        // Find the modes div and insert before it
        const modesDiv = startDiv.querySelector('.modes');
        if (modesDiv) {
          // Stats history
          let statsHTML = '';
          if (stats.attempted > 0) {
            const pct = stats.totalRight + stats.totalWrong > 0 ? Math.round(stats.totalRight / (stats.totalRight + stats.totalWrong) * 100) : 0;
            statsHTML = '<div class="stats-history" id="enhance-stats"><h3>Your History</h3><div class="stats-row">' +
              '<div class="stat-item"><div class="sv" style="color:var(--ok)">' + stats.totalRight + '</div><div class="sl">Correct</div></div>' +
              '<div class="stat-item"><div class="sv" style="color:var(--no)">' + stats.totalWrong + '</div><div class="sl">Wrong</div></div>' +
              '<div class="stat-item"><div class="sv" style="color:var(--accent)">' + stats.attempted + '/' + stats.total + '</div><div class="sl">Attempted</div></div>' +
              '<div class="stat-item"><div class="sv" style="color:' + (pct >= 70 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--no)') + '">' + pct + '%</div><div class="sl">Accuracy</div></div>' +
              '</div></div>';
          }
          
          // Weak spots button
          let weakHTML = '';
          if (weak.length > 0) {
            weakHTML = '<div class="mb weak" onclick="startWeak()"><h3>\u26a0\ufe0f Weak Spots (' + weak.length + ')</h3><p>Practice questions you\'ve missed. Spaced repetition focuses on your weakest areas.</p></div>';
          }
          
          // Timer toggle
          const timerHTML = '<div class="timer-toggle" id="timer-toggle">' +
            '<label>Timed Mode</label>' +
            '<div class="toggle-switch' + (timerEnabled ? ' on' : '') + '" onclick="toggleTimer()"></div>' +
            '</div>';
          
          modesDiv.insertAdjacentHTML('beforebegin', statsHTML);
          modesDiv.insertAdjacentHTML('afterend', timerHTML);
          if (weakHTML) {
            // Insert weak spots button after the last mode button
            modesDiv.insertAdjacentHTML('beforeend', weakHTML);
          }
        }
      }
    }
  };
  
  window.toggleTimer = function() {
    timerEnabled = !timerEnabled;
    const sw = document.querySelector('.toggle-switch');
    if (sw) sw.classList.toggle('on', timerEnabled);
  };
  
  window.clearHistory = function() {
    if (confirm('Clear all study history for this tool?')) {
      localStorage.removeItem(STORE_KEY);
      render();
    }
  };
}

initEnhancements("hydronics");
render();
cloudLoad(function(){ render(); });
window.addEventListener('beforeunload',function(){if(S.scr==='quiz')saveSession();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&S.scr==='quiz')saveSession();});
</script>
