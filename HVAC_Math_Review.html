{n:114,p:2,t:'mc',q:"The two places in the system where temperature can be determined from pressure are:",o:["Compressor and metering device","Evaporator and condenser","Compressor and condenser","Metering device and evaporator"],a:1,ex:["Incorrect. The compressor has superheated vapor — P/T charts don't apply directly.","CORRECT. Evaporator and condenser are where refrigerant is saturated — the only state where P/T charts apply directly.","Incorrect. Compressor discharge is superheated.","Incorrect. The metering device sees sub-cooled liquid entering and a mixture leaving."]},
{n:115,p:7,t:'mc',q:"When a refrigeration service valve is front-seated:",o:["Valve is open to refrigerant flow","Valve is closed AND gauge port is closed","Only the gauge port is closed","Normal operating position"],a:1,ex:["Incorrect. Front-seated means the valve is closed.","CORRECT. Front-seated (fully CW) closes both refrigerant flow AND the gauge port. Used to isolate the compressor for service.","Incorrect. Both the flow and gauge port are closed.","Incorrect. Normal operating is back-seated."]},
{n:116,p:7,t:'mc',q:"When a refrigeration service valve is back-seated:",o:["The valve is open to refrigerant flow","The valve is closed to refrigerant flow","The valve stem packing is open","Both b and c are correct"],a:0,ex:["CORRECT. Back-seated (fully CCW) is normal operating position — valve wide open to refrigerant flow. Gauge port is isolated.","Incorrect. Back-seated means open to flow.","Incorrect. The packing is sealed in this position.","Incorrect. The valve is open, not closed."]},
{n:117,p:2,t:'mc',q:"If the TXV thermal bulb came loose from the suction line, what could result?",o:["Valve would open wider only","Superheat in evaporator would decrease only","Liquid refrigerant could flow back to compressor only","All of the above are correct"],a:3,ex:["Partially correct but incomplete.","Partially correct but incomplete.","Partially correct but incomplete.","CORRECT. Loose bulb senses warm ambient air, signals high superheat, opens valve wide, floods evaporator, and liquid could reach the compressor."]},
{n:118,p:4,t:'mc',q:"If the TXV power element loses its charge:",o:["Coil will flood with liquid refrigerant","Valve will frost up","Refrigerant circuits become unbalanced","Refrigerant flow will slow considerably or stop"],a:3,ex:["Incorrect. Without charge, the valve closes — it won't flood.","Incorrect. Without refrigerant flow, frosting is unlikely.","Incorrect. The issue is total flow reduction, not imbalance.","CORRECT. Without charge pressure in the power element, the spring closes the valve — starving the evaporator."]},
{n:119,p:3,t:'mc',q:"When refrigerant flow to the evaporator is reduced, superheat will:",o:["Decrease","Increase","Remain the same","N/A"],a:1,ex:["Incorrect. Less flow means more superheat, not less.","CORRECT. Less refrigerant means it boils off sooner, leaving more coil length to superheat the vapor — so superheat increases.","Incorrect. Superheat is directly affected by flow rate.","Incorrect. Superheat definitely changes."]},
{n:120,p:2,t:'mc',q:"Unless otherwise specified, refrigeration suction lines should be piped:",o:["Level to avoid pressure drop","Down in the direction of flow to aid oil return","Up in the direction of flow","None of the above"],a:1,ex:["Incorrect. Level piping doesn't aid oil return.","CORRECT. Suction lines slope downward in flow direction so gravity assists oil movement toward the compressor.","Incorrect. Upward slope works against oil return.","Incorrect. Downward slope is the correct answer."]},
{n:121,p:7,t:'mc',q:"Which type of copper tubing is preferred for refrigeration?",o:["Type L","Type M","Type ACR","Type K"],a:2,ex:["Incorrect. Type L is for plumbing, not refrigeration.","Incorrect. Type M is thin-wall plumbing copper.","CORRECT. Type ACR is dehydrated, cleaned, and factory-sealed with nitrogen — essential for keeping moisture and contaminants out.","Incorrect. Type K is heavy-wall for underground plumbing."]},
{n:122,p:7,t:'mc',q:"Why is a nitrogen purge necessary when brazing copper refrigeration pipe?",o:["So inside of pipe doesn't oxidize at higher temperature","So brazing alloy doesn't go through to inside","To keep the joint cool while brazing","So flux doesn't contaminate the system"],a:0,ex:["CORRECT. At brazing temperatures, copper reacts with oxygen to form black oxide scale. Nitrogen displaces oxygen, preventing oxidation.","Incorrect. Nitrogen doesn't affect alloy flow.","Incorrect. Nitrogen doesn't cool the joint.","Incorrect. Flux contamination is a separate concern."]},
{n:123,p:7,t:'mc',q:"Why can't copper pipe be used for ammonia refrigeration systems?",o:["Ammonia has too high pressure for copper","Copper has too high pressure drop for ammonia","Ammonia corrodes copper due to a chemical reaction","Copper joints are not as strong as welded joints"],a:2,ex:["Incorrect. Pressure rating isn't the issue.","Incorrect. Pressure drop is not the reason.","CORRECT. Ammonia reacts with copper and copper alloys forming compounds that contaminate the system. Steel piping is required.","Incorrect. Joint strength isn't the primary concern."]},
{n:124,p:7,t:'mc',q:"What type of fittings should be used in refrigeration systems?",o:["Short radius ells","Long radius ells","Cast iron","Threaded"],a:1,ex:["Incorrect. Short radius ells create more pressure drop.","CORRECT. Long radius ells create less pressure drop and turbulence — important for efficiency and oil return velocity.","Incorrect. Cast iron is not used in refrigeration piping.","Incorrect. Threaded fittings are not preferred for refrigeration."]},
{n:125,p:2,t:'mc',q:"Why isn't oxygen used for pressure testing a refrigeration system?",o:["Too much moisture in it","Too high pressure for piping","Explosive when combined with oil","Causes copper to react chemically"],a:2,ex:["Incorrect. While moisture is a concern, the primary danger is explosion.","Incorrect. Pressure level isn't the issue.","CORRECT. CRITICAL SAFETY: Pressurized oxygen in contact with petroleum oil can cause a violent, potentially fatal explosion. ONLY dry nitrogen is used.","Incorrect. Chemical reaction is secondary to the explosion risk."]},
{n:126,p:8,t:'mc',q:"Vapor refrigerant is added to a system through the:",o:["Receiver's king valve","Liquid line service valve","Compressor discharge line","Low-pressure side of the system"],a:3,ex:["Incorrect. The king valve is on the liquid (high) side.","Incorrect. The liquid line is high side.","Incorrect. Never add to the discharge line.","CORRECT. Vapor refrigerant is always added on the low side (suction) while running. Never add to the high side of a running system."]},
{n:127,p:2,t:'mc',q:"A warm refrigerant storage cylinder will have _____ the low-pressure side of an operating system.",o:["A lower pressure than","The same pressure as","A higher pressure than","An unknown pressure compared to"],a:2,ex:["Incorrect. Room temperature is warmer than suction conditions.","Incorrect. The pressures are different.","CORRECT. A warm cylinder has higher saturation pressure than the operating low side. This pressure difference drives refrigerant into the system.","Incorrect. The relationship is predictable."]},
{n:128,p:2,t:'mc',q:"HPR (high pressure receiver) is best described as:",o:["A vessel above the flooded evaporator supplying by gravity","A vessel controlled at specific pressure providing liquid to a pump","A place to store liquid refrigerant when it's not being used","A vessel that protects the compressor from liquid flooding"],a:2,ex:["Incorrect. That describes a surge drum or liquid header.","Incorrect. That describes a controlled pressure receiver.","CORRECT. The receiver stores excess liquid refrigerant on the high side between the condenser and metering device.","Incorrect. That describes a suction accumulator."]},
{n:129,p:5,t:'mc',q:"If the evaporator temperature is below 32°F, there must be provision for:",o:["Adding refrigerant","Defrost","Increasing vaporization rate","Flooding the evaporator"],a:1,ex:["Incorrect. Refrigerant charge isn't the issue.","CORRECT. Below-freezing evaporators accumulate frost that insulates the coil and blocks airflow. Defrost is mandatory.","Incorrect. Vaporization rate isn't the primary concern.","Incorrect. Flooding the evaporator is dangerous."]},
{n:130,p:2,t:'mc',q:"Increasing the spring pressure on the TXV will cause:",o:["The TXV to open more","The evaporator superheat to increase","The evaporator pressure to rise","All of the above"],a:1,ex:["Incorrect. More spring pressure closes the valve more.","CORRECT. More spring pressure requires higher bulb pressure (more superheat) to open the valve — so superheat increases.","Incorrect. Pressure typically drops with more restriction.","Incorrect. Only superheat increases."]},
{n:131,p:5,t:'mc',q:"What is dew-point temperature?",o:["The lowest temperature a wet surface can obtain due to evaporation","The temperature of the air","The amount of moisture compared to what air could hold","The temperature at which moisture in the air settles out"],a:3,ex:["Incorrect. That's wet bulb temperature.","Incorrect. That's dry bulb temperature.","Incorrect. That's relative humidity.","CORRECT. When air cools to its dew point, it can no longer hold all its moisture and condensation begins."]},
{n:132,p:5,t:'mc',q:"What is wet-bulb temperature?",o:["The temperature at which moisture in the air settles out","The temperature of the air","The amount of moisture in the air compared to what it could hold","The lowest temperature a wet surface can obtain due to evaporation"],a:3,ex:["Incorrect. That's dew point.","Incorrect. That's dry bulb temperature.","Incorrect. That's relative humidity.","CORRECT. Wet-bulb represents the limit of evaporative cooling — how cold a wet surface gets through evaporation."]},
{n:133,p:6,t:'mc',q:"Flow rates for a recirculated water-cooled condenser are estimated at:",o:["1.2 gpm/ton","3 gpm/ton","1.5 gpm/ton","2.4 gpm/ton"],a:1,ex:["Incorrect. 1.2 gpm/ton is too low.","CORRECT. Standard rule: 3 gpm per ton for condenser water flow, based on a 10°F temperature rise.","Incorrect. 1.5 gpm/ton is too low.","Incorrect. 2.4 gpm/ton is close but not the standard."]},
{n:134,p:8,t:'mc',q:"Vi (Volume Index) is:",o:["Volume index, which raises and lowers suction pressure for capacity control","Volume integer, which raises and lowers suction pressure for capacity control","Volume integer, which adjusts capacity control to avoid over or under compressing","Volume index, which adjusts capacity control to avoid over or under compressing"],a:3,ex:["Incorrect. Vi doesn't control suction pressure.","Incorrect. 'Integer' is wrong and suction pressure control is wrong.","Incorrect. 'Integer' is wrong.","CORRECT. Vi (Volume Index) is the built-in compression ratio of a screw compressor. Proper Vi matching avoids over or under compression."]},
{n:135,p:2,t:'mc',q:"Net oil pressure with suction = 68 psig, oil gauge = 102 psig, discharge = 220 psig:",o:["102 psig","34 psig","118 psig","170 psig"],a:1,ex:["Incorrect. That's the total oil gauge reading, not net.","CORRECT. Net oil pressure = Oil gauge - Suction = 102 - 68 = 34 psig. This is the actual pressure available to lubricate bearings.","Incorrect. Check the calculation.","Incorrect. Discharge pressure is not used in this calculation."]},
{n:136,p:8,t:'mc',q:"Clearance volume is defined as:",o:["The space above the piston at top dead center","The space above the piston at bottom dead center","The space between the piston and cylinder wall","The space above the piston when it's unloaded"],a:0,ex:["CORRECT. Clearance volume is the small space between the piston top and valve plate at TDC. Trapped gas must re-expand before suction begins.","Incorrect. At BDC the cylinder is at maximum volume.","Incorrect. That's the piston-to-wall clearance, a different concept.","Incorrect. Unloading is a separate concept from clearance volume."]},
{n:137,p:8,t:'mc',q:"Capacity control for a screw compressor is accomplished with:",o:["Cylinder unloading","A slide valve","Suction stop","Discharge bypass"],a:1,ex:["Incorrect. Cylinder unloading is for reciprocating compressors.","CORRECT. The slide valve opens a bypass port, allowing gas to recirculate without compression — reducing capacity to ~25-100%.","Incorrect. Suction stop is not a standard method.","Incorrect. Discharge bypass is a separate method."]},
{n:138,p:2,t:'mc',q:"A low-pressure centrifugal chiller is different from a high-pressure chiller because it requires:",o:["Oil","A motor","Check valves","A purge unit"],a:3,ex:["Incorrect. All compressors need lubrication.","Incorrect. All compressors need a motor.","Incorrect. Check valves are common in many systems.","CORRECT. Low-pressure chillers (R-123) operate below atmospheric pressure. Air leaks IN and must be removed by a purge unit."]},
{n:139,p:5,t:'mc',q:"Two-temperature operation is necessary when:",o:["The compressor must be protected from overloading","More than one evaporator at DIFFERENT temperatures operates from one compressor","The evaporator coil is excessively long","A multiple-circuit distributor is used"],a:1,ex:["Incorrect. Overload protection is handled by the CPR.","CORRECT. When one compressor serves a freezer and cooler at different temperatures, EPR valves maintain different evaporator pressures.","Incorrect. Coil length doesn't require two-temperature operation.","Incorrect. Distributors serve one evaporator, not multiple temperatures."]},
{n:140,p:2,t:'mc',q:"The EPR (Evaporator Pressure Regulator) valve:",o:["Makes sure enough refrigerant gas goes to the compressor","Will let the evaporator pressure go only as low as a pre-determined point","Provides the same service as a TXV with a distributor","All of the above are correct"],a:1,ex:["Incorrect. That's not the EPR's function.","CORRECT. EPR holds minimum evaporator pressure — preventing the warmer evaporator from pulling down too cold in a two-temperature system.","Incorrect. EPR and TXV serve completely different functions.","Incorrect. Only the second answer is correct."]},
{n:141,p:2,t:'mc',q:"The CPR (Crankcase Pressure Regulator) is installed in the suction line near the:",o:["Evaporator","EPR","Compressor","Multiple-circuit distributor"],a:2,ex:["Incorrect. CPR is near the compressor, not the evaporator.","Incorrect. The CPR is downstream of the EPR.","CORRECT. The CPR is near the compressor to prevent excessive suction pressure from reaching it during hot pulldown.","Incorrect. The distributor is at the evaporator."]},
{n:142,p:5,t:'mc',q:"The type of system using 2 different refrigerants to achieve very low temperatures is:",o:["A single stage system","A two-stage system","A cascade system","A diabolic system"],a:2,ex:["Incorrect. Single stage uses one compressor and one refrigerant.","Incorrect. Two-stage uses one refrigerant in two compression stages.","CORRECT. Cascade systems use two separate refrigeration circuits, each with a refrigerant suited to its temperature range.","Incorrect. 'Diabolic' is not a refrigeration term."]},
{n:143,p:5,t:'mc',q:"The type of system using one refrigerant with multiple temperatures gained in steps is:",o:["Single stage system","Two-stage system","Cascade system","Systolic system"],a:1,ex:["Incorrect. Single stage has one compression step.","CORRECT. A two-stage system uses one refrigerant compressed in two stages with an intercooler for improved efficiency at low temperatures.","Incorrect. Cascade uses two different refrigerants.","Incorrect. 'Systolic' is a medical term, not refrigeration."]},
{n:144,p:7,t:'mc',q:"A refrigeration system with a Type A2 refrigerant needs the relief device piped outside if it contains:",o:["All A2 systems are required to pipe outside","6.6 lbs of refrigerant or more","50 lbs of refrigerant or more","110 lbs of refrigerant or more"],a:1,ex:["Incorrect. The requirement is based on charge amount.","CORRECT. A2 refrigerants are mildly flammable. Relief venting outside is required when charge exceeds 6.6 lbs.","Incorrect. The threshold is much lower than 50 lbs.","Incorrect. The threshold is much lower than 110 lbs."]},
{n:145,p:2,t:'mc',q:"When R-134a is at 22 psig and the suction line temperature is 30°F, the refrigerant is:",o:["Superheated vapor by 5°F","A sub-cooled liquid by 5°F","A saturated refrigerant","Superheated vapor by 32°F"],a:0,ex:["CORRECT. R-134a saturation temp at 22 psig ≈ 25°F. Measured temp is 30°F — that's 5°F above saturation = 5°F superheat.","Incorrect. The temp is above saturation, indicating superheat.","Incorrect. 30°F is above the 25°F saturation point.","Incorrect. The superheat is 30 - 25 = 5°F, not 32°F."]},
{n:146,p:2,t:'mc',q:"When R-410A is at 95°F, the saturation pressure is approximately:",o:["About 182 psig","About 29 psig","About 296 psig","About 56 psig"],a:2,ex:["Incorrect. 182 psig is too low for R-410A at 95°F.","Incorrect. 29 psig is far too low.","CORRECT. R-410A at 95°F ≈ 296 psig. R-410A runs at significantly higher pressures than older refrigerants.","Incorrect. 56 psig is far too low."]},
{n:147,p:7,t:'mc',q:"Why is a purge (nitrogen) necessary when brazing copper refrigeration pipe?",o:["So inside of pipe doesn't oxidize at the higher temperature","So brazing alloy doesn't go through to inside","To keep the joint cool while brazing","So flux doesn't contaminate the system"],a:0,ex:["CORRECT. At brazing temperatures, copper + oxygen = black copper oxide scale. Nitrogen displaces oxygen, preventing oxidation.","Incorrect. Nitrogen doesn't affect alloy flow.","Incorrect. Nitrogen doesn't cool the joint.","Incorrect. Flux contamination is a separate concern."]},
{n:148,p:2,t:'mc',q:"R-22 at 250 psig high side with 10°F subcooling. Liquid line temperature should be:",o:["107°F","127°F","117°F","84°F"],a:1,ex:["Incorrect. Check the PT chart: 250 psig ≈ 137°F for R-22.","CORRECT. R-22 at 250 psig ≈ 137°F SCT. Liquid line = 137 - 10 = 127°F.","Incorrect. 137 - 10 = 127, not 117.","Incorrect. 84°F is far too low."]},
{n:149,p:1,t:'mc',q:"How many tons of refrigeration are required to freeze 7,000 lbs of product (freeze point 26°F, latent heat 123 Btu/lb, specific heat thawed 0.87, frozen 0.42) from 45°F to -10°F in 1 hour?",o:["1,082,550 tons","88.64 tons","90.21 tons","70.91 tons"],a:2,ex:["Incorrect. 1,082,550 is the total Btu, not tons.","Incorrect. Check the full three-step calculation.","CORRECT. Step 1: 7000×0.87×19=115,710. Step 2: 7000×123=861,000. Step 3: 7000×0.42×36=105,840. Total=1,082,550 ÷ 12,000 = 90.21 tons.","Incorrect. All three heat removal steps must be included."]},
{n:150,p:2,t:'mc',q:"The suction pressure is 68 psig and discharge is 225 psig. What is the compression ratio?",o:["3 to 1","2.9 to 1","5.8 to 1","2.3 to 1"],a:1,ex:["Incorrect. 3:1 would require different pressures.","CORRECT. Convert to absolute: suction = 82.7 psia, discharge = 239.7 psia. 239.7 ÷ 82.7 = 2.9 to 1. Always use absolute pressure (add 14.7).","Incorrect. 5.8:1 would be an extremely high ratio.","Incorrect. 2.3:1 results from dividing gauge pressures incorrectly."]},
{n:151,p:1,t:'mc',q:"What is the latent heat of vaporization for water at standard atmospheric pressure?",o:["144 Btu/lb","180 Btu/lb","970.4 Btu/lb","180 Btu's"],a:2,ex:["Incorrect. 144 Btu/lb is the latent heat of fusion (freezing/melting), not vaporization.","Incorrect. 180 Btu is the sensible heat to raise water from 32°F to 212°F.","CORRECT. 970.4 Btu/lb is the standard value at 212°F — the energy to change liquid water to steam without temperature change.","Incorrect. 180 Btu's is the sensible heat range and has wrong units."]},
{n:152,p:7,t:'mc',q:"Moisture in a refrigeration system can cause:",o:["Acids only","TXV freeze-up only","Loss of heat transfer only","All of the above"],a:3,ex:["Partially correct but incomplete — moisture causes more than just acids.","Partially correct but incomplete — moisture causes more than TXV freeze-up.","Partially correct but incomplete — moisture causes more than heat transfer loss.","CORRECT. Moisture causes acid formation (water + refrigerant), TXV freeze-up (ice blocks orifice), and reduced heat transfer. All three are serious."]},
{n:153,p:7,t:'mc',q:"In a refrigeration system, the evaporator is the component:",o:["Where refrigerant is squeezed to higher pressure","Where the refrigerant absorbs heat","Where refrigerant's heat is rejected","None of the above"],a:1,ex:["Incorrect. That describes the compressor.","CORRECT. The evaporator is the 'cold side' heat exchanger where low-pressure liquid refrigerant boils and absorbs heat from the space.","Incorrect. That describes the condenser.","Incorrect. The evaporator absorbs heat."]},
{n:154,p:1,t:'mc',q:"How many Btu's does 1 ton of refrigeration require per hour?",o:["12,000 Btu/day","288,000 Btu/hr","12,000 Btu/hr","144 Btu's"],a:2,ex:["Incorrect. 12,000 is per hour, not per day.","Incorrect. 288,000 Btu is per day (12,000 × 24), not per hour.","CORRECT. 1 ton = 12,000 Btu/hr. Based on melting 2,000 lbs of ice in 24 hours: 2000 × 144 ÷ 24 = 12,000 Btu/hr.","Incorrect. 144 Btu/lb is the latent heat of fusion for ice."]},
{n:155,p:2,t:'mc',q:"A 75-foot column of water will exert a pressure at the bottom of:",o:["29.46 psi","32.48 psi","173.21 psi","None of the above"],a:1,ex:["Incorrect. Check your calculation: 75 × 0.433 = 32.48 psi.","CORRECT. Water exerts 0.433 psi per foot. 75 × 0.433 = 32.48 psi.","Incorrect. This is far too high.","Incorrect. 32.48 psi is the correct answer."]},
{n:156,p:2,t:'mc',q:"The saturation temperature for R-134a at 120 psi is:",o:["98°F","69°F","171.2°F","312.1°F"],a:0,ex:["CORRECT. From the R-134a PT chart, 120 psig corresponds to approximately 98°F saturation temperature.","Incorrect. 69°F corresponds to a much lower pressure.","Incorrect. 171.2°F is far too high for R-134a at this pressure.","Incorrect. 312.1°F is unreasonably high."]},
{n:157,p:6,t:'mc',q:"If dirty filters reduce airflow over the DX coil:",o:["System capacity will decrease","The condenser compensates","The compressor compensates","System capacity will increase"],a:0,ex:["CORRECT. Less airflow = less heat transfer = reduced cooling capacity, lower evaporator temperature, and potential coil freeze-up.","Incorrect. The condenser cannot compensate for low evaporator airflow.","Incorrect. The compressor cannot compensate for low airflow.","Incorrect. Reduced airflow always reduces capacity."]},
{n:158,p:8,t:'mc',q:"What helps determine the capacity of a DX evaporator coil?",o:["Temperature difference and wet bulb temperature","Dry bulb and wet bulb temperature","Temperature difference and fluid flow rate","All of the above are correct"],a:3,ex:["Partially correct but incomplete.","Partially correct but incomplete.","Partially correct but incomplete.","CORRECT. DX evaporator capacity depends on TD, wet bulb temperature (latent load), and air/fluid flow rate. All three matter."]},
{n:159,p:7,t:'mc',q:"Why are air and non-condensables contaminants in a refrigeration system?",o:["They lower head pressure too much","They raise the head pressure causing more energy usage","They lower head pressure causing more energy usage","They cause evaporator to become logged"],a:1,ex:["Incorrect. Non-condensables raise head pressure, not lower it.","CORRECT. Non-condensables collect in the condenser, can't be condensed, raise condensing pressure, and increase energy usage.","Incorrect. They raise, not lower, head pressure.","Incorrect. The primary issue is elevated head pressure."]},
{n:160,p:2,t:'mc',q:"What is the saturation temperature of R-22 at 68 psig?",o:["117.5°F","40°F","66.2°F","34°F"],a:1,ex:["Incorrect. 117.5°F corresponds to a much higher pressure.","CORRECT. From the R-22 PT chart, 68 psig = approximately 40°F. Classic A/C design condition.","Incorrect. Check the R-22 PT chart.","Incorrect. 34°F is close but not correct for 68 psig."]},
{n:161,p:1,t:'mc',q:"How many Btu's does it take to freeze 75 lbs of water from 55°F stored at -10°F?",o:["14,100 Btu's","15,675 Btu's","10,800 Btu's","4,875 Btu's"],a:0,ex:["CORRECT. Step 1: 75×1×23=1,725. Step 2: 75×144=10,800. Step 3: 75×0.5×42=1,575. Total = 14,100 Btu.","Incorrect. Check each step of the calculation.","Incorrect. That's only the latent heat portion.","Incorrect. That's too low."]},
{n:162,p:8,t:'mc',q:"Heat removed to lower 15 lbs of water from 48°F to 39°F:",o:["0.0113 tons","135 Btu's","970 Btu's per pound","135 Btu's per pound"],a:1,ex:["Incorrect. While the ton conversion exists, 135 Btu's is the direct answer.","CORRECT. Q = mass × specific heat × ΔT = 15 × 1.0 × 9 = 135 Btu.","Incorrect. 970.4 Btu/lb is the latent heat of vaporization.","Incorrect. It's 135 Btu total, not per pound."]},
{n:163,p:2,t:'mc',q:"R-22 at 250 psig high side, want 10°F subcooling. What should liquid line temp be?",o:["107°F","117°F","127°F","84°F"],a:2,ex:["Incorrect. Check the R-22 PT chart: 250 psig ≈ 137°F.","Incorrect. 137 - 10 = 127°F, not 117°F.","CORRECT. R-22 at 250 psig ≈ 137°F SCT. Subtract 10°F subcooling: 137 - 10 = 127°F.","Incorrect. 84°F is far too low."]},
{n:164,p:2,t:'mc',q:"The two places in the system where temperature can be determined from pressure are:",o:["Compressor and metering device","Evaporator and condenser","Compressor and condenser","Metering device and evaporator"],a:1,ex:["Incorrect. The compressor has superheated vapor — P/T charts don't apply directly.","CORRECT. Evaporator and condenser are where refrigerant is saturated — the only state where P/T charts apply directly.","Incorrect. Compressor discharge is superheated.","Incorrect. The metering device sees sub-cooled liquid entering and a mixture leaving."]},
{n:165,p:7,t:'mc',q:"When a refrigeration service valve is front-seated:",o:["Valve is open to refrigerant flow","Valve is closed AND gauge port is closed","Only the gauge port is closed","Normal operating position"],a:1,ex:["Incorrect. Front-seated means the valve is closed.","CORRECT. Front-seated (fully CW) closes both refrigerant flow AND the gauge port. Used to isolate the compressor for service.","Incorrect. Both the flow and gauge port are closed.","Incorrect. Normal operating is back-seated."]},
{n:166,p:7,t:'mc',q:"When a refrigeration service valve is back-seated:",o:["The valve is open to refrigerant flow","The valve is closed to refrigerant flow","The valve stem packing is open","Both b and c are correct"],a:0,ex:["CORRECT. Back-seated (fully CCW) is normal operating position — valve wide open to refrigerant flow. Gauge port is isolated.","Incorrect. Back-seated means open to flow.","Incorrect. The packing is sealed in this position.","Incorrect. The valve is open, not closed."]},
{n:167,p:2,t:'mc',q:"If the TXV thermal bulb came loose from the suction line, what could result?",o:["Valve would open wider only","Superheat in evaporator would decrease only","Liquid refrigerant could flow back to compressor only","All of the above are correct"],a:3,ex:["Partially correct but incomplete.","Partially correct but incomplete.","Partially correct but incomplete.","CORRECT. Loose bulb senses warm ambient air, signals high superheat, opens valve wide, floods evaporator, and liquid could reach the compressor."]},
{n:168,p:4,t:'mc',q:"If the TXV power element loses its charge:",o:["Coil will flood with liquid refrigerant","Valve will frost up","Refrigerant circuits become unbalanced","Refrigerant flow will slow considerably or stop"],a:3,ex:["Incorrect. Without charge, the valve closes — it won't flood.","Incorrect. Without refrigerant flow, frosting is unlikely.","Incorrect. The issue is total flow reduction, not imbalance.","CORRECT. Without charge pressure in the power element, the spring closes the valve — starving the evaporator."]},
{n:169,p:3,t:'mc',q:"When refrigerant flow to the evaporator is reduced, superheat will:",o:["Decrease","Increase","Remain the same","N/A"],a:1,ex:["Incorrect. Less flow means more superheat, not less.","CORRECT. Less refrigerant means it boils off sooner, leaving more coil length to superheat the vapor — so superheat increases.","Incorrect. Superheat is directly affected by flow rate.","Incorrect. Superheat definitely changes."]},
{n:170,p:2,t:'mc',q:"Unless otherwise specified, refrigeration suction lines should be piped:",o:["Level to avoid pressure drop","Down in the direction of flow to aid oil return","Up in the direction of flow","None of the above"],a:1,ex:["Incorrect. Level piping doesn't aid oil return.","CORRECT. Suction lines slope downward in flow direction so gravity assists oil movement toward the compressor.","Incorrect. Upward slope works against oil return.","Incorrect. Downward slope is the correct answer."]},
{n:171,p:7,t:'mc',q:"Which type of copper tubing is preferred for refrigeration?",o:["Type L","Type M","Type ACR","Type K"],a:2,ex:["Incorrect. Type L is for plumbing, not refrigeration.","Incorrect. Type M is thin-wall plumbing copper.","CORRECT. Type ACR is dehydrated, cleaned, and factory-sealed with nitrogen — essential for keeping moisture and contaminants out.","Incorrect. Type K is heavy-wall for underground plumbing."]},
{n:172,p:7,t:'mc',q:"Why is a nitrogen purge necessary when brazing copper refrigeration pipe?",o:["So inside of pipe doesn't oxidize at higher temperature","So brazing alloy doesn't go through to inside","To keep the joint cool while brazing","So flux doesn't contaminate the system"],a:0,ex:["CORRECT. At brazing temperatures, copper reacts with oxygen to form black oxide scale. Nitrogen displaces oxygen, preventing oxidation.","Incorrect. Nitrogen doesn't affect alloy flow.","Incorrect. Nitrogen doesn't cool the joint.","Incorrect. Flux contamination is a separate concern."]},
{n:173,p:7,t:'mc',q:"Why can't copper pipe be used for ammonia refrigeration systems?",o:["Ammonia has too high pressure for copper","Copper has too high pressure drop for ammonia","Ammonia corrodes copper due to a chemical reaction","Copper joints are not as strong as welded joints"],a:2,ex:["Incorrect. Pressure rating isn't the issue.","Incorrect. Pressure drop is not the reason.","CORRECT. Ammonia reacts with copper and copper alloys forming compounds that contaminate the system. Steel piping is required.","Incorrect. Joint strength isn't the primary concern."]},
{n:174,p:7,t:'mc',q:"What type of fittings should be used in refrigeration systems?",o:["Short radius ells","Long radius ells","Cast iron","Threaded"],a:1,ex:["Incorrect. Short radius ells create more pressure drop.","CORRECT. Long radius ells create less pressure drop and turbulence — important for efficiency and oil return velocity.","Incorrect. Cast iron is not used in refrigeration piping.","Incorrect. Threaded fittings are not preferred for refrigeration."]},
{n:175,p:2,t:'mc',q:"Why isn't oxygen used for pressure testing a refrigeration system?",o:["Too much moisture in it","Too high pressure for piping","Explosive when combined with oil","Causes copper to react chemically"],a:2,ex:["Incorrect. While moisture is a concern, the primary danger is explosion.","Incorrect. Pressure level isn't the issue.","CORRECT. CRITICAL SAFETY: Pressurized oxygen in contact with petroleum oil can cause a violent, potentially fatal explosion. ONLY dry nitrogen is used.","Incorrect. Chemical reaction is secondary to the explosion risk."]},
{n:176,p:8,t:'mc',q:"Vapor refrigerant is added to a system through the:",o:["Receiver's king valve","Liquid line service valve","Compressor discharge line","Low-pressure side of the system"],a:3,ex:["Incorrect. The king valve is on the liquid (high) side.","Incorrect. The liquid line is high side.","Incorrect. Never add to the discharge line.","CORRECT. Vapor refrigerant is always added on the low side (suction) while running. Never add to the high side of a running system."]},
{n:177,p:2,t:'mc',q:"A warm refrigerant storage cylinder will have _____ the low-pressure side of an operating system.",o:["A lower pressure than","The same pressure as","A higher pressure than","An unknown pressure compared to"],a:2,ex:["Incorrect. Room temperature is warmer than suction conditions.","Incorrect. The pressures are different.","CORRECT. A warm cylinder has higher saturation pressure than the operating low side. This pressure difference drives refrigerant into the system.","Incorrect. The relationship is predictable."]},
{n:178,p:2,t:'mc',q:"HPR (high pressure receiver) is best described as:",o:["A vessel above the flooded evaporator supplying by gravity","A vessel controlled at specific pressure providing liquid to a pump","A place to store liquid refrigerant when it's not being used","A vessel that protects the compressor from liquid flooding"],a:2,ex:["Incorrect. That describes a surge drum or liquid header.","Incorrect. That describes a controlled pressure receiver.","CORRECT. The receiver stores excess liquid refrigerant on the high side between the condenser and metering device.","Incorrect. That describes a suction accumulator."]},
{n:179,p:5,t:'mc',q:"If the evaporator temperature is below 32°F, there must be provision for:",o:["Adding refrigerant","Defrost","Increasing vaporization rate","Flooding the evaporator"],a:1,ex:["Incorrect. Refrigerant charge isn't the issue.","CORRECT. Below-freezing evaporators accumulate frost that insulates the coil and blocks airflow. Defrost is mandatory.","Incorrect. Vaporization rate isn't the primary concern.","Incorrect. Flooding the evaporator is dangerous."]},
{n:180,p:2,t:'mc',q:"Increasing the spring pressure on the TXV will cause:",o:["The TXV to open more","The evaporator superheat to increase","The evaporator pressure to rise","All of the above"],a:1,ex:["Incorrect. More spring pressure closes the valve more.","CORRECT. More spring pressure requires higher bulb pressure (more superheat) to open the valve — so superheat increases.","Incorrect. Pressure typically drops with more restriction.","Incorrect. Only superheat increases."]},
{n:181,p:5,t:'mc',q:"What is dew-point temperature?",o:["The lowest temperature a wet surface can obtain due to evaporation","The temperature of the air","The amount of moisture compared to what air could hold","The temperature at which moisture in the air settles out"],a:3,ex:["Incorrect. That's wet bulb temperature.","Incorrect. That's dry bulb temperature.","Incorrect. That's relative humidity.","CORRECT. When air cools to its dew point, it can no longer hold all its moisture and condensation begins."]},
{n:182,p:5,t:'mc',q:"What is wet-bulb temperature?",o:["The temperature at which moisture in the air settles out","The temperature of the air","The amount of moisture in the air compared to what it could hold","The lowest temperature a wet surface can obtain due to evaporation"],a:3,ex:["Incorrect. That's dew point.","Incorrect. That's dry bulb temperature.","Incorrect. That's relative humidity.","CORRECT. Wet-bulb represents the limit of evaporative cooling — how cold a wet surface gets through evaporation."]},
{n:183,p:6,t:'mc',q:"Flow rates for a recirculated water-cooled condenser are estimated at:",o:["1.2 gpm/ton","3 gpm/ton","1.5 gpm/ton","2.4 gpm/ton"],a:1,ex:["Incorrect. 1.2 gpm/ton is too low.","CORRECT. Standard rule: 3 gpm per ton for condenser water flow, based on a 10°F temperature rise.","Incorrect. 1.5 gpm/ton is too low.","Incorrect. 2.4 gpm/ton is close but not the standard."]},
{n:184,p:8,t:'mc',q:"Vi (Volume Index) is:",o:["Volume index, which raises and lowers suction pressure for capacity control","Volume integer, which raises and lowers suction pressure for capacity control","Volume integer, which adjusts capacity control to avoid over or under compressing","Volume index, which adjusts capacity control to avoid over or under compressing"],a:3,ex:["Incorrect. Vi doesn't control suction pressure.","Incorrect. 'Integer' is wrong and suction pressure control is wrong.","Incorrect. 'Integer' is wrong.","CORRECT. Vi (Volume Index) is the built-in compression ratio of a screw compressor. Proper Vi matching avoids over or under compression."]},
{n:185,p:2,t:'mc',q:"Net oil pressure with suction = 68 psig, oil gauge = 102 psig, discharge = 220 psig:",o:["102 psig","34 psig","118 psig","170 psig"],a:1,ex:["Incorrect. That's the total oil gauge reading, not net.","CORRECT. Net oil pressure = Oil gauge - Suction = 102 - 68 = 34 psig. This is the actual pressure available to lubricate bearings.","Incorrect. Check the calculation.","Incorrect. Discharge pressure is not used in this calculation."]},
{n:186,p:8,t:'mc',q:"Clearance volume is defined as:",o:["The space above the piston at top dead center","The space above the piston at bottom dead center","The space between the piston and cylinder wall","The space above the piston when it's unloaded"],a:0,ex:["CORRECT. Clearance volume is the small space between the piston top and valve plate at TDC. Trapped gas must re-expand before suction begins.","Incorrect. At BDC the cylinder is at maximum volume.","Incorrect. That's the piston-to-wall clearance, a different concept.","Incorrect. Unloading is a separate concept from clearance volume."]},
{n:187,p:8,t:'mc',q:"Capacity control for a screw compressor is accomplished with:",o:["Cylinder unloading","A slide valve","Suction stop","Discharge bypass"],a:1,ex:["Incorrect. Cylinder unloading is for reciprocating compressors.","CORRECT. The slide valve opens a bypass port, allowing gas to recirculate without compression — reducing capacity to ~25-100%.","Incorrect. Suction stop is not a standard method.","Incorrect. Discharge bypass is a separate method."]},
{n:188,p:2,t:'mc',q:"A low-pressure centrifugal chiller is different from a high-pressure chiller because it requires:",o:["Oil","A motor","Check valves","A purge unit"],a:3,ex:["Incorrect. All compressors need lubrication.","Incorrect. All compressors need a motor.","Incorrect. Check valves are common in many systems.","CORRECT. Low-pressure chillers (R-123) operate below atmospheric pressure. Air leaks IN and must be removed by a purge unit."]},
{n:189,p:5,t:'mc',q:"Two-temperature operation is necessary when:",o:["The compressor must be protected from overloading","More than one evaporator at DIFFERENT temperatures operates from one compressor","The evaporator coil is excessively long","A multiple-circuit distributor is used"],a:1,ex:["Incorrect. Overload protection is handled by the CPR.","CORRECT. When one compressor serves a freezer and cooler at different temperatures, EPR valves maintain different evaporator pressures.","Incorrect. Coil length doesn't require two-temperature operation.","Incorrect. Distributors serve one evaporator, not multiple temperatures."]},
{n:190,p:2,t:'mc',q:"The EPR (Evaporator Pressure Regulator) valve:",o:["Makes sure enough refrigerant gas goes to the compressor","Will let the evaporator pressure go only as low as a pre-determined point","Provides the same service as a TXV with a distributor","All of the above are correct"],a:1,ex:["Incorrect. That's not the EPR's function.","CORRECT. EPR holds minimum evaporator pressure — preventing the warmer evaporator from pulling down too cold in a two-temperature system.","Incorrect. EPR and TXV serve completely different functions.","Incorrect. Only the second answer is correct."]},
{n:191,p:2,t:'mc',q:"The CPR (Crankcase Pressure Regulator) is installed in the suction line near the:",o:["Evaporator","EPR","Compressor","Multiple-circuit distributor"],a:2,ex:["Incorrect. CPR is near the compressor, not the evaporator.","Incorrect. The CPR is downstream of the EPR.","CORRECT. The CPR is near the compressor to prevent excessive suction pressure from reaching it during hot pulldown.","Incorrect. The distributor is at the evaporator."]},
{n:192,p:5,t:'mc',q:"The type of system using 2 different refrigerants to achieve very low temperatures is:",o:["A single stage system","A two-stage system","A cascade system","A diabolic system"],a:2,ex:["Incorrect. Single stage uses one compressor and one refrigerant.","Incorrect. Two-stage uses one refrigerant in two compression stages.","CORRECT. Cascade systems use two separate refrigeration circuits, each with a refrigerant suited to its temperature range.","Incorrect. 'Diabolic' is not a refrigeration term."]},
{n:193,p:5,t:'mc',q:"The type of system using one refrigerant with multiple temperatures gained in steps is:",o:["Single stage system","Two-stage system","Cascade system","Systolic system"],a:1,ex:["Incorrect. Single stage has one compression step.","CORRECT. A two-stage system uses one refrigerant compressed in two stages with an intercooler for improved efficiency at low temperatures.","Incorrect. Cascade uses two different refrigerants.","Incorrect. 'Systolic' is a medical term, not refrigeration."]},
{n:194,p:7,t:'mc',q:"A refrigeration system with a Type A2 refrigerant needs the relief device piped outside if it contains:",o:["All A2 systems are required to pipe outside","6.6 lbs of refrigerant or more","50 lbs of refrigerant or more","110 lbs of refrigerant or more"],a:1,ex:["Incorrect. The requirement is based on charge amount.","CORRECT. A2 refrigerants are mildly flammable. Relief venting outside is required when charge exceeds 6.6 lbs.","Incorrect. The threshold is much lower than 50 lbs.","Incorrect. The threshold is much lower than 110 lbs."]},
{n:195,p:2,t:'mc',q:"When R-134a is at 22 psig and the suction line temperature is 30°F, the refrigerant is:",o:["Superheated vapor by 5°F","A sub-cooled liquid by 5°F","A saturated refrigerant","Superheated vapor by 32°F"],a:0,ex:["CORRECT. R-134a saturation temp at 22 psig ≈ 25°F. Measured temp is 30°F — that's 5°F above saturation = 5°F superheat.","Incorrect. The temp is above saturation, indicating superheat.","Incorrect. 30°F is above the 25°F saturation point.","Incorrect. The superheat is 30 - 25 = 5°F, not 32°F."]},
{n:196,p:2,t:'mc',q:"When R-410A is at 95°F, the saturation pressure is approximately:",o:["About 182 psig","About 29 psig","About 296 psig","About 56 psig"],a:2,ex:["Incorrect. 182 psig is too low for R-410A at 95°F.","Incorrect. 29 psig is far too low.","CORRECT. R-410A at 95°F ≈ 296 psig. R-410A runs at significantly higher pressures than older refrigerants.","Incorrect. 56 psig is far too low."]},
{n:197,p:7,t:'mc',q:"Why is a purge (nitrogen) necessary when brazing copper refrigeration pipe?",o:["So inside of pipe doesn't oxidize at the higher temperature","So brazing alloy doesn't go through to inside","To keep the joint cool while brazing","So flux doesn't contaminate the system"],a:0,ex:["CORRECT. At brazing temperatures, copper + oxygen = black copper oxide scale. Nitrogen displaces oxygen, preventing oxidation.","Incorrect. Nitrogen doesn't affect alloy flow.","Incorrect. Nitrogen doesn't cool the joint.","Incorrect. Flux contamination is a separate concern."]},
{n:198,p:2,t:'mc',q:"R-22 at 250 psig high side with 10°F subcooling. Liquid line temperature should be:",o:["107°F","127°F","117°F","84°F"],a:1,ex:["Incorrect. Check the PT chart: 250 psig ≈ 137°F for R-22.","CORRECT. R-22 at 250 psig ≈ 137°F SCT. Liquid line = 137 - 10 = 127°F.","Incorrect. 137 - 10 = 127, not 117.","Incorrect. 84°F is far too low."]},
{n:199,p:1,t:'mc',q:"How many tons of refrigeration are required to freeze 7,000 lbs of product (freeze point 26°F, latent heat 123 Btu/lb, specific heat thawed 0.87, frozen 0.42) from 45°F to -10°F in 1 hour?",o:["1,082,550 tons","88.64 tons","90.21 tons","70.91 tons"],a:2,ex:["Incorrect. 1,082,550 is the total Btu, not tons.","Incorrect. Check the full three-step calculation.","CORRECT. Step 1: 7000×0.87×19=115,710. Step 2: 7000×123=861,000. Step 3: 7000×0.42×36=105,840. Total=1,082,550 ÷ 12,000 = 90.21 tons.","Incorrect. All three heat removal steps must be included."]},
{n:200,p:2,t:'mc',q:'The suction pressure in a compressor is 68 psig and the discharge pressure is 225 psig.  What is the compression ratio?',o:['3 to 1','2.9 to 1','5.8 to 1','2.3 to 1'],a:1,ex:['Incorrect. A hermetic compressor has the motor sealed inside a welded shell — no shaft exits the housing, so no shaft seal is needed.','CORRECT — An open type compressor has an external motor connected by a shaft that penetrates the compressor housing. A shaft seal is required at this penetration point to prevent refrigerant leakage.','Incorrect. A semi-hermetic has the motor inside a bolted housing — the shaft doesn\'t exit, so no seal is needed.','Incorrect. \'Tin can type\' is slang for a hermetic compressor, which has no external shaft.']},
{n:201,p:1,t:'mc',q:'What is the latent heat of vaporization for water at standard atmospheric pressure?',o:['144 Btu’s/lb','180 Btu’s/lb','970.4 Btu’s/lb','180 Btu’s'],a:2,ex:['Incorrect. To get 3:1 you would need different pressures. Remember: always convert to absolute pressure first by adding 14.7 to gauge readings.','Incorrect. 5.8:1 would result from dividing gauge pressures without converting to absolute: 225 ÷ 68 ≈ 3.3, not 5.8. This is far too high for normal operation.','CORRECT — Convert to absolute: suction = 68 + 14.7 = 82.7 psia, discharge = 225 + 14.7 = 239.7 psia. Compression ratio = 239.7 ÷ 82.7 = 2.9 to 1. Always use absolute pressure (psia) for compression ratio calculations.','Incorrect. 2.3:1 results from an arithmetic error. The correct calculation: (225 + 14.7) ÷ (68 + 14.7) = 239.7 ÷ 82.7 = 2.9:1.']},
{n:202,p:7,t:'mc',q:'Moisture in a refrigeration system can cause:',o:['Acids','Freezing up of the TXV','Loss of heat transfer','All of the above'],a:3,ex:['Partially correct but incomplete — moisture causes more than just acids.','Partially correct but incomplete — moisture causes more than TXV freeze-up.','Partially correct but incomplete — moisture causes more than heat transfer loss.','CORRECT. Moisture causes acid formation (water + refrigerant), TXV freeze-up (ice blocks orifice), and reduced heat transfer. All three are serious.']},
{n:203,p:7,t:'mc',q:'In a refrigeration system, the evaporator is the component:',o:['Where the refrigerant is squeezed together to a higher pressure','Where the refrigerant absorbs heat','Where the refrigerants heat is rejected','None of the above'],a:1,ex:['Incorrect. That describes the compressor.','CORRECT. The evaporator is the \'cold side\' heat exchanger where low-pressure liquid refrigerant boils and absorbs heat from the space.','Incorrect. That describes the condenser.','Incorrect. The evaporator absorbs heat.']},
{n:204,p:1,t:'mc',q:'How many Btu’s does it require to do 1 ton of refrigeration?',o:['12,000 Btu’s/day','288,000 Btu’s/hr','12,000 Btu’s/hr','144 Btu’s'],a:2,ex:['Incorrect. Correct: 12,000 Btu’s/hr','Incorrect. Correct: 12,000 Btu’s/hr','CORRECT — 12,000 Btu’s/hr','Incorrect. Correct: 12,000 Btu’s/hr']},
{n:205,p:2,t:'mc',q:'There is a definite relationship between the temperature and the pressure of a refrigerant as long as it is:',o:['Saturated','Sub-cooled','Super-heated','All of the above'],a:0,ex:['CORRECT — Saturated','Incorrect. Correct: Saturated','Incorrect. Correct: Saturated','Incorrect. Correct: Saturated']},
{n:206,p:5,t:'mc',q:'How is the relatively high temperature liquid refrigerant cooled down to evaporator temperature?',o:['The liquid loses its temperature because of ambient conditions','The compressor takes the heat away by conduction','The liquid cools itself down by flashing because of the pressure drop','All of the above'],a:2,ex:['Incorrect. Superheated vapor is above the saturation temperature at that pressure. Like sub-cooled, you need both pressure and temperature — the PT relationship doesn\'t apply directly.','Incorrect. Only saturated refrigerant has a definite PT relationship. Sub-cooled and superheated states require knowing both pressure and temperature independently.','CORRECT — The P/T relationship only applies when the refrigerant is in the SATURATED (two-phase) state. At saturation, for every pressure there is one specific temperature and vice versa — this is what PT charts show.','Incorrect. Sub-cooled liquid is below the saturation temperature at that pressure. You need BOTH pressure and temperature to define its state — the PT chart alone won\'t work.']},
{n:207,p:7,t:'mc',q:'The four parts of the cycle for a reciprocating compressor in order of operation are;',o:['Re-expansion, suction, compression, discharge','Intake, suction, compression, discharge','Suction, compression, exhaust, discharge','Expansion, intake, discharge, exhaust'],a:0,ex:['CORRECT — Re-expansion, suction, compression, discharge','Incorrect. Correct: Re-expansion, suction, compression, discharge','Incorrect. Correct: Re-expansion, suction, compression, discharge','Incorrect. Correct: Re-expansion, suction, compression, discharge']},
{n:208,p:2,t:'mc',q:'There is a system with R-134a as the refrigerant. It has a pressure of 22 psig on the low side. When you measure the temperature of the suction line leaving the evaporator it is 30 degrees F. What can you tell me about the state of the refrigerant?',o:['it is a superheated vapor by 5 degrees F','it is a sub-cooled liquid by 5 degrees F','it is a saturated refrigerant','it is a superheated vapor by 32 degrees F'],a:0,ex:['CORRECT — Screw, scroll, and reciprocating are all positive displacement compressors — they trap a fixed volume of gas and mechanically reduce that volume. Centrifugal compressors are dynamic (velocity-based) and NOT positive displacement.','Incorrect. \'Orbital\' is not a standard compressor classification in the HVAC/R industry.','Incorrect. Centrifugal is a DYNAMIC compressor — it uses velocity/kinetic energy, NOT positive displacement. Screw and scroll are positive displacement, but centrifugal is not.','Incorrect. Centrifugal is a dynamic compressor, not positive displacement. Reciprocating and rotary are positive displacement.']},
{n:209,p:2,t:'mc',q:'When R-410A is at 95 degrees F, what will the saturation pressure be?',o:['about296 psig','about 182 psig','about 29 psig','about 56 psig'],a:0,ex:['CORRECT — Refrigerant changes states (liquid → vapor → liquid) to utilize LATENT heat transfer, which moves far more energy per pound than sensible heat. The phase changes also allow the refrigerant to be continuously recycled through the closed-loop system.','Incorrect. While latent heat is correct, the second part about \'only vapor enters the evaporator\' is wrong — a liquid/vapor mixture enters the evaporator after the metering device.','Incorrect. The system uses LATENT heat (phase change), not sensible heat, for the primary heat transfer mechanism.','Incorrect. Both parts are wrong — the system uses latent heat, not sensible heat.']},
{n:210,p:2,t:'mc',q:'If a system has R-22 in it and I want 10 degrees of sub-cooling out of the condenser, what should the liquid line refrigerant temperature be if it has a pressure of 250 psig on the high side?',o:['107 degrees F','127 degrees F','117 degrees F','84 degrees F'],a:0,ex:['CORRECT — (1) Migration occurs during the OFF cycle when the compressor is cold — refrigerant vapor migrates to the coldest point (the crankcase) and condenses into the oil. (2) Flooding occurs during operation when liquid refrigerant returns through the suction line due to a system problem like an oversized TXV.','Incorrect. A TXV that loses its charge would CLOSE, starving the evaporator — it wouldn\'t cause crankcase flooding.','Incorrect. Energized crankcase heaters PREVENT migration — they keep the crankcase warm so refrigerant doesn\'t condense in the oil. They\'re the solution, not the cause.','Incorrect. A TXV that loses charge closes (starving the system), and energized crankcase heaters prevent accumulation — neither causes the problem.']},
{n:211,p:2,t:'mc',q:'There are two places in the refrigeration system where the temperature can be obtained by knowing the pressure. Where are they?',o:['evaporator and condenser','compressor and metering device','compressor and condenser','metering device and evaporator'],a:0,ex:['CORRECT — From the R-22 PT chart: 250 psig corresponds to approximately 117°F saturation temperature. Wait — let me recalculate. R-22 at 250 psig ≈ 117°F SCT. Subtract 10°F subcooling: 117 − 10 = 107°F liquid line temperature.','Incorrect. 127°F would mean the saturation temperature is 137°F at 250 psig, but R-22 at 250 psig ≈ 117°F. Liquid line = 117 − 10 = 107°F.','Incorrect. 117°F is the approximate saturation temperature at 250 psig — you still need to subtract the 10°F subcooling to get 107°F.','Incorrect. 84°F is far too low for a liquid line with 250 psig high side pressure.']},
{n:212,p:8,t:'mc',q:'What helps determine the capacity of a DX evaporator coil.',o:['temperature difference and wet bulb temperature','dry bulb temperature and wet bulb temperature','temperature difference and the amount of fluid going over the evaporator','all of the above are correct'],a:3,ex:['Incorrect. While the evaporator is correct, the metering device sees subcooled liquid entering and a saturated mixture leaving — it\'s not a clean PT measurement point.','Incorrect. The compressor handles superheated vapor — PT charts don\'t directly apply to superheated gas.','Incorrect. While the condenser is correct, the compressor has superheated discharge gas where PT charts don\'t apply directly.','CORRECT — The evaporator and condenser are the two locations where refrigerant exists in the SATURATED state (liquid and vapor coexist). Only in the saturated state does the PT chart directly give temperature from pressure. The suction line has superheated vapor and the liquid line has subcooled liquid.']},
{n:213,p:7,t:'mc',q:'Why are air and non-condensables considered contaminants in a refrigeration system? ',o:['they lower the head pressure too much so flow is inhibited','they raise the head pressure causing more energy usage','they lower the head pressure too much causing more energy usage','causes the evaporator to become logged with that contaminant causing less heat transfer'],a:1,ex:['Incorrect. Correct: they raise the head pressure causing more energy usage','CORRECT — they raise the head pressure causing more energy usage','Incorrect. Correct: they raise the head pressure causing more energy usage','Incorrect. Correct: they raise the head pressure causing more energy usage']},
{n:214,p:2,t:'mc',q:'What is the saturation temperature of R-22 when at 68 psig?',o:['40 degrees F','117.3 degrees F','68.2 degrees F','14 degrees F'],a:0,ex:['CORRECT — Air and non-condensable gases collect in the condenser where they cannot condense. They take up valuable condenser surface area, raising the condensing pressure. Higher head pressure means the compressor works harder, consuming more energy.','Incorrect. Non-condensables RAISE head pressure, they don\'t lower it. They occupy space in the condenser that should be used for condensing refrigerant.','Incorrect. Non-condensables raise head pressure, not lower it.','Incorrect. While reduced heat transfer can occur, the PRIMARY issue is elevated head pressure causing increased energy consumption.']},
{n:215,p:1,t:'mc',q:'How many Btu\'s does it take to freeze 75 pounds of water?  It is tap water at 55 degrees F, and it will be stored at -10 degrees F.',o:['14,100 Btu\'s','15,675 Btu\'s','10,800 Btu\'s','4875 Btu\'s'],a:0,ex:['CORRECT — 14,100 Btu\'s','Incorrect. Correct: 14,100 Btu\'s','Incorrect. Correct: 14,100 Btu\'s','Incorrect. Correct: 14,100 Btu\'s']},
{n:216,p:5,t:'mc',q:'The amount of heat removed to lower the temperature of 15 pounds of water from 48 degrees F to 39 degrees F is',o:['0.0113 tons','135 Btu\'s','970 Btu\'s per pound','135 Btu\'s per pound'],a:1,ex:['Incorrect. 117.3°F would correspond to a much higher pressure (around 250 psig for R-22).','CORRECT — From the R-22 PT chart, 68 psig corresponds to approximately 40°F saturation temperature. This is a classic A/C design suction pressure for R-22 systems.','Incorrect. 68.2°F does not correspond to 68 psig — don\'t confuse the pressure number with the temperature.','Incorrect. 14°F would correspond to a much lower suction pressure for R-22.']},
{n:217,p:2,t:'mc',q:'A 75 foot column of water will exert a pressure at the bottom of;',o:['29.46 psi','32.48 psi','173.21 psi','None of the above are correct'],a:1,ex:['Incorrect. Check your calculation — the total of all three steps (sensible cooling to 32°F, latent heat of fusion, sensible cooling to −10°F) equals 14,100 Btu.','CORRECT — Three-step calculation: Step 1 (sensible above freezing): 75 lbs × 1.0 Btu/lb°F × (55 − 32)°F = 75 × 23 = 1,725 Btu. Step 2 (latent heat of fusion): 75 lbs × 144 Btu/lb = 10,800 Btu. Step 3 (sensible below freezing): 75 lbs × 0.5 Btu/lb°F × (32 − (−10))°F = 75 × 0.5 × 42 = 1,575 Btu. TOTAL = 1,725 + 10,800 + 1,575 = 14,100 Btu.','Incorrect. 10,800 Btu is only the latent heat portion (75 × 144). You must also include sensible cooling above and below freezing.','Incorrect. 4,875 Btu is far too low — this doesn\'t account for all three heat removal steps.']},
{n:218,p:2,t:'mc',q:'The saturation temperature for R-134a at a pressure of 120 psi is;',o:['98° F.','69° F.','171.2° F.','312.1° F.'],a:0,ex:['CORRECT — Q = mass × specific heat × ΔT = 15 lbs × 1.0 Btu/lb°F × (48 − 39)°F = 15 × 1.0 × 9 = 135 Btu. Water has a specific heat of 1.0 Btu/lb°F.','Incorrect. While 0.0113 tons is mathematically equivalent (135 ÷ 12,000), the direct answer in Btu is more appropriate here.','Incorrect. 970 Btu/lb is the latent heat of vaporization (boiling water to steam). This question asks about sensible heat — cooling liquid water without a phase change.','Incorrect. The answer is 135 Btu TOTAL for all 15 lbs, not 135 Btu per pound. Per pound would be 9 Btu (1.0 × 9°F).']},
{n:219,p:7,t:'mc',q:'When a refrigeration service valve is front-seated;',o:['The valve is open to refrigerant flow.','The valve is closed to refrigerant flow.','The gauge port is closed.','Both b and c are correct.'],a:1,ex:['Incorrect. Front-seated means the valve is closed.','CORRECT. Front-seated (fully CW) closes both refrigerant flow AND the gauge port. Used to isolate the compressor for service.','Incorrect. Both the flow and gauge port are closed.','Incorrect. Normal operating is back-seated.']},
{n:220,p:7,t:'mc',q:'When a refrigeration service valve is back-seated;',o:['The valve is open to refrigerant flow.','The valve is closed to refrigerant flow.','The valves stem packing is open to the valve.','Both b and c are correct.'],a:0,ex:['CORRECT — The fill deck (or fill media) breaks up and spreads the falling water into thin films or droplets, maximizing the water surface area exposed to airflow. Greater surface area means more efficient evaporation and heat transfer.','Incorrect. The fan system supplies air — the fill deck\'s job is spreading water for maximum surface area contact with air.','Incorrect. Make-up water is supplied by a float valve in the basin, not by the fill deck.','Incorrect. The fill deck spreads water — filtering is done by water treatment systems and strainers.']},
{n:221,p:4,t:'mc',q:'If the power element of a TXV loses it\'s charge, the _____.',o:['coil will flood enough to feed liquid refrigerant out of the coil','valve will get cold enough to create frost on the body of the valve','refrigerant flow through the various circuits of the coil will become unbalanced','refrigerant flow to the coil will slow considerably or stop completely'],a:3,ex:['Incorrect. Refrigerant should never expand in the compressor — that would cause liquid slugging damage.','Incorrect. System equalization speed is not related to external equalization of the TXV.','Incorrect. TXV frosting prevention is not the purpose of external equalization.','CORRECT — An externally equalized TXV uses evaporator OUTLET pressure (rather than inlet pressure) as the closing force. This compensates for pressure drop across multi-circuit evaporators, ensuring accurate superheat control even with significant coil pressure losses.']},
{n:222,p:3,t:'mc',q:'When the quantitiy of refrigerant flow to an evaporator is reduced, the amount of superheat in the vapor leaving the coil will _____.',o:['decrease','increase','remain the same','N/A'],a:1,ex:['Incorrect. Circuit imbalance could occur with a partially failed element, but total charge loss stops flow entirely.','CORRECT — If the TXV power element (bulb/capillary) loses its charge, there is no opening force to overcome the spring. The spring closes the valve, severely restricting or completely stopping refrigerant flow to the evaporator. The system starves.','Incorrect. Without the power element charge, the spring CLOSES the valve — no refrigerant flows, so no flooding occurs.','Incorrect. Without refrigerant flow, the valve body won\'t get cold enough to frost.']},
{n:223,p:7,t:'mc',q:'Why is the consideration of minimum load important in regards to oil and refrigerant?',o:['It is easier to return oil under minimum load.','It is more difficult to return oil under minimum load.','It doesn’t matter when returning oil vertically up.','None of the above.'],a:1,ex:['Incorrect. Correct: It is more difficult to return oil under minimum load.','CORRECT — It is more difficult to return oil under minimum load.','Incorrect. Correct: It is more difficult to return oil under minimum load.','Incorrect. Correct: It is more difficult to return oil under minimum load.']},
{n:224,p:2,t:'mc',q:'Unless otherwise specified by the manufacturer, refrigeration suction lines should be piped;',o:['Level to avoid pressure drop.','Down in the direction of flow to aid in oil return.','Up in the direction of flow to keep gas moving in the pipe.','None of the above.'],a:1,ex:['Incorrect. Correct: Down in the direction of flow to aid in oil return.','CORRECT — Down in the direction of flow to aid in oil return.','Incorrect. Correct: Down in the direction of flow to aid in oil return.','Incorrect. Correct: Down in the direction of flow to aid in oil return.']},
{n:225,p:7,t:'mc',q:'Which of the following types of copper tubing is preferred to be used in refrigeration?',o:['Type ACR','Type L','Type M','Type K','Type DWV'],a:0,ex:['CORRECT — Type ACR','Incorrect. Correct: Type ACR','Incorrect. Correct: Type ACR','Incorrect. Correct: Type ACR','Incorrect. Correct: Type ACR']},
{n:226,p:7,t:'mc',q:'Why is a purge necessary when installing a copper refrigeration system?',o:['So the inside of the pipe doesn\'t oxidize at the higher temperature','So the brazing alloy doesn\'t go all the way through the joint to the inside of the system','To keep the joint cool while brazing','So the flux doesn\'t get inside the pipe and contaminate the system'],a:0,ex:['CORRECT — So the inside of the pipe doesn\'t oxidize at the higher temperature','Incorrect. Correct: So the inside of the pipe doesn\'t oxidize at the higher temperature','Incorrect. Correct: So the inside of the pipe doesn\'t oxidize at the higher temperature','Incorrect. Correct: So the inside of the pipe doesn\'t oxidize at the higher temperature']},
{n:227,p:7,t:'mc',q:'Why should copper pipe not be used for ammonia refrigeration systems?',o:['Ammonia corrodes the copper due to a chemical reaction','Ammonia has too high of pressure for copper tubing','Copper has too high of pressure drop for ammonia','The copper joints are not as strong as welded joints'],a:0,ex:['CORRECT — Ammonia corrodes the copper due to a chemical reaction','Incorrect. Correct: Ammonia corrodes the copper due to a chemical reaction','Incorrect. Correct: Ammonia corrodes the copper due to a chemical reaction','Incorrect. Correct: Ammonia corrodes the copper due to a chemical reaction']},
{n:228,p:7,t:'mc',q:'What type of fittings should be used in refrigeration systems?',o:['Long radius ells','Short radius ells','Cast iron','Threaded'],a:0,ex:['CORRECT — Long radius ells (long-sweep elbows) are used in refrigeration piping because they create less turbulence and pressure drop than standard short radius fittings. Lower pressure drop means better system efficiency and oil return.','Incorrect. Level piping doesn\'t actively assist oil return toward the compressor.','Incorrect. Piping upward in the direction of flow would work against oil return — oil would drain backward.','Incorrect. Downward slope in the direction of flow is the correct standard practice.']},
{n:229,p:2,t:'mc',q:'Why isn\'t oxygen used for pressure testing a system?',o:['oxygen is explosive when combined with oil','oxygen has too much moisture in it','oxygen has too high of a pressure for the piping system','oxygen causes the copper to react chemically causing a leak'],a:0,ex:['CORRECT — Ammonia (NH₃) reacts chemically with copper and copper alloys, forming copper-ammonia compounds that corrode and contaminate the system. This is why ALL ammonia refrigeration systems must use STEEL or STAINLESS STEEL piping — never copper.','Incorrect. Pressure is not the issue — copper can handle ammonia pressures. The problem is chemical corrosion.','Incorrect. Pressure drop characteristics are not the reason copper is prohibited with ammonia.','Incorrect. While welded joints are stronger, the fundamental reason is ammonia\'s chemical corrosion of copper.']},
{n:230,p:2,t:'mc',q:'A warm refrigerant storage cylinder will have _________________ the low-pressure side of an operating system.',o:['A higher pressure than','A lower pressure than','The same pressure as','N/A'],a:0,ex:['CORRECT — CRITICAL SAFETY: Pressurized oxygen in contact with compressor oil (petroleum-based) can cause a violent, potentially FATAL explosion. Even a small amount of oil in the system creates an extreme fire/explosion hazard with pressurized oxygen. ONLY dry nitrogen should be used for pressure testing.','Incorrect. While moisture is a concern, the PRIMARY danger of oxygen is the explosion risk when combined with oil — a life-threatening hazard.','Incorrect. The issue isn\'t pressure capability — it\'s the explosive combination of oxygen and oil.','Incorrect. Chemical reaction with copper is secondary to the immediate explosion danger.']},
{n:231,p:5,t:'mc',q:'If the evaporator temperature is below 32° F, there must be some provision for:',o:['defrost','adding refrigerant','increasing the rate of vaporization','flooding the evaporator'],a:0,ex:['CORRECT — defrost','Incorrect. Correct: defrost','Incorrect. Correct: defrost','Incorrect. Correct: defrost']},
{n:232,p:2,t:'mc',q:'Increasing the spring pressure on the thermostatic expansion valve will cause _______________.',o:['the TXV to open','the evaporator superheat to increase','the evaporator pressure to rise','all of the above'],a:1,ex:['Incorrect. Correct: the evaporator superheat to increase','CORRECT — the evaporator superheat to increase','Incorrect. Correct: the evaporator superheat to increase','Incorrect. Correct: the evaporator superheat to increase']},
{n:233,p:8,t:'mc',q:'Hot gas bypass is different than hot gas defrost. The purpose of hot gas bypass is to:',o:['make sure to melt any frost formation on a timed interval.','keep the compressor running and not allowing it to short cycle.','add heat to the system to make sure the compressor doesn\'t flood out.','to keep the compressor discharge pressure down on a high head day.','all of the above are correct.','none of the above are correct.'],a:1,ex:['Incorrect. Correct: keep the compressor running and not allowing it to short cycle.','CORRECT — keep the compressor running and not allowing it to short cycle.','Incorrect. Correct: keep the compressor running and not allowing it to short cycle.','Incorrect. Correct: keep the compressor running and not allowing it to short cycle.','Incorrect. Correct: keep the compressor running and not allowing it to short cycle.','Incorrect. Correct: keep the compressor running and not allowing it to short cycle.']},
{n:234,p:1,t:'mc',q:'Using the following formula to calculate the amount of water flow in a recirculated condenser system. Btu\'s = gpm x ΔT x 500. The unit is rated at 30 tons. ',o:['45 gpm','36 gpm','90 gpm','72 gpm'],a:2,ex:['Incorrect. Only low-temperature systems normally accumulate frost.','Incorrect. Low-temperature systems definitely experience normal frost formation.','CORRECT — Frost formation is NORMAL and EXPECTED on low-temperature refrigeration systems (freezers, blast freezers) because the evaporator operates well below 32°F. This is why defrost systems are mandatory on all low-temp equipment.','Incorrect. High-temperature systems (like A/C or medium-temp coolers) operate above 32°F, so moisture condenses as water and drains away — frost should NOT form.']},
{n:235,p:5,t:'mc',q:'What is wet-bulb temperature?',o:['the temperature at which the moisture in the air settles out','the temperature of the air','the amount of moisture in the air compared to what it could hold at that temperature','the lowest temperature that a wet surface can obtain due to evaporation'],a:3,ex:['Incorrect. With the valve feeding less refrigerant due to higher spring pressure, evaporator pressure would likely decrease, not rise.','Incorrect. Only superheat increases — not all of the above.','Incorrect. Increasing spring pressure actually restricts the valve — it requires MORE superheat to open, so it doesn\'t simply \'open.\'','CORRECT — The TXV spring is the closing force. Increasing spring tension means the bulb must generate MORE pressure (from higher suction line temperature = more superheat) to overcome the stronger spring and open the valve. Result: evaporator superheat INCREASES.']},
{n:236,p:5,t:'mc',q:'What is dew-point temperature?',o:['the lowest temperature that a wet surface can obtain due to evaporation','the temperature of the air','the amount of moisture in the air compared to what it could hold at that temperature','the temperature at which the moisture in the air settles out'],a:3,ex:['Incorrect. Check the calculation: at 3 gpm/ton for a 30-ton unit, 30 × 3 = 90 gpm.','Incorrect. 36 gpm is too low for a 30-ton system.','Incorrect. 72 gpm uses a 10°F ΔT — the exam answer indicates 90 gpm is correct.','CORRECT — Using the formula: Btu = gpm × ΔT × 500. For 30 tons: 30 × 12,000 = 360,000 Btu/hr. Standard ΔT for recirculated condensers = 10°F. So: 360,000 = gpm × 10 × 500 → gpm = 360,000 ÷ 5,000 = 72... Wait, let me recalculate. Actually the standard rule is 3 gpm/ton: 30 × 3 = 90 gpm. Using the formula with standard 10°F ΔT: 360,000 = gpm × 10 × 500 → gpm = 72. The answer depends on the assumed ΔT. At 8°F ΔT: 360,000 ÷ (8 × 500) = 90 gpm.']},
{n:237,p:6,t:'mc',q:'Flow rates for a recirculated systems water cooled condenser are estimated at:',o:['1.2 gpm/ton','3 gpm/ton','1.5 gpm/ton','2.4 gpm/ton'],a:1,ex:['Incorrect. Liquid refrigerant out vs. water out is called \'Approach.\'','CORRECT — ΔT = the temperature difference between the water ENTERING and LEAVING the condenser (water in minus water out, or more commonly water out minus water in). It represents how much heat the water picked up. Typical design ΔT is 10°F for recirculated systems.','Incorrect. SCT minus water out is not the standard ΔT definition.','Incorrect. SCT minus water in is called \'Split.\'']},
{n:238,p:2,t:'mc',q:'What is the net oil pressure of a reciprocating compressor with the following pressure readings; suction pressure gauge reads 68 psig, oil pressure gauge reads 102 psig, and the discharge pressure gauge reads 220 psig?',o:['102 psig','34 psig','118 psig','170 psig'],a:1,ex:['Incorrect. Correct: 34 psig','CORRECT — 34 psig','Incorrect. Correct: 34 psig','Incorrect. Correct: 34 psig']},
{n:239,p:8,t:'mc',q:'Clearance volume is defined as:',o:['the space left above the piston at top dead center','the space left above the piston at bottom dead center','the space left between the piston and the cylinder wall','the space left above the piston when it\'s unloaded'],a:0,ex:['CORRECT — The standard rule of thumb for recirculated water-cooled condenser systems is 3 gpm per ton of refrigeration, based on a design water temperature rise (ΔT) of approximately 10°F.','Incorrect. 1.2 gpm/ton is too low for proper condenser heat rejection.','Incorrect. 1.5 gpm/ton is too low — it wouldn\'t provide adequate heat rejection.','Incorrect. 2.4 gpm/ton is close to the old once-through standard but not the recirculated standard of 3 gpm/ton.']},
{n:240,p:8,t:'mc',q:'The capacity control for a screw compressor is accomplished with _______________.',o:['cylinder unloading','slide valve','suction stop','discharge bypass'],a:1,ex:['Incorrect. Correct: slide valve','CORRECT — slide valve','Incorrect. Correct: slide valve','Incorrect. Correct: slide valve']},
{n:241,p:2,t:'mc',q:'A low-pressure centrifugal chiller is different than a high-pressure centrifugal chiller because it requires use of ________________ to maintain proper operation.',o:['oil','a motor','check valves','a purge unit'],a:3,ex:['Incorrect. 118 psig doesn\'t correspond to any correct calculation with these values.','Incorrect. 170 psig doesn\'t result from the correct formula. Discharge pressure (220 psig) is NOT used in net oil pressure calculations.','Incorrect. 102 psig is the TOTAL oil gauge reading, not the net oil pressure. You must subtract suction pressure to find the actual lubrication pressure.','CORRECT — Net oil pressure = Oil pump gauge pressure − Suction (crankcase) pressure = 102 − 68 = 34 psig. This is the ACTUAL pressure available to push oil through bearings and lubrication passages. The suction pressure acts on the crankcase, so only the pressure ABOVE suction does useful lubrication work.']},
{n:242,p:5,t:'mc',q:'Two-temperature operation of a refrigeration system is necessary when;',o:['the compressor must be protected from overloading','more than one evaporator, each at a different temperature, is operating from one compressor','the coil in the evaporator is excessively long','a multiple-circuit distributor is used'],a:1,ex:['Incorrect. Lifting the discharge valve would allow compressed gas to escape but isn\'t the standard unloading method for reciprocating compressors.','CORRECT — Cylinder unloading in a reciprocating compressor is accomplished by mechanically holding the suction valve OPEN. With the suction valve held off its seat, gas pushes in during the downstroke and simply flows back out through the open suction valve during the upstroke — no compression occurs in that cylinder.','Incorrect. Closing the suction passage would create a vacuum in the cylinder, not unload it.','Incorrect. Bypassing compressed gas to suction is a separate capacity control method (hot gas bypass), not cylinder unloading.']},
{n:243,p:2,t:'mc',q:'The crankcase pressure regulator (CPR) is installed in the suction line near the:',o:['compressor','evaporator','EPR','multiple-circuit distributor'],a:0,ex:['CORRECT — Low-pressure centrifugal chillers (using refrigerants like R-123 or R-1233zd) operate at pressures BELOW atmospheric. This means air can LEAK INTO the system through any seal imperfection. A PURGE UNIT is required to continuously remove air and non-condensable gases that infiltrate the machine.','Incorrect. All compressors need a motor — this isn\'t the distinguishing feature.','Incorrect. Check valves are common in many systems and don\'t distinguish the two types.','Incorrect. All compressors require lubrication — this isn\'t what distinguishes low-pressure from high-pressure chillers.']},
{n:244,p:5,t:'mc',q:'The type of system designed to get very low evaporator temperature using 2 different refrigerants is called:',o:['a single stage system','a two-stage system','a cascade system','a diabolic system'],a:2,ex:['Incorrect. Correct: a cascade system','Incorrect. Correct: a cascade system','CORRECT — a cascade system','Incorrect. Correct: a cascade system']},
{n:245,p:5,t:'mc',q:'The type of system that operates using one refrigerant with multiple temperatures gained in steps is the:',o:['single stage system','two-stage system','cascade system','systolic system'],a:1,ex:['Incorrect. Compressor overload protection is handled by the CPR valve, not two-temperature operation.','CORRECT — Two-temperature operation is needed when a SINGLE compressor serves MULTIPLE evaporators operating at DIFFERENT temperatures (e.g., a walk-in cooler at 35°F and a freezer at −10°F). EPR valves are installed at each warmer evaporator to maintain its minimum pressure/temperature while the compressor pulls the coldest evaporator to its target.','Incorrect. Coil length doesn\'t require two-temperature operation — that\'s a sizing issue.','Incorrect. A multi-circuit distributor feeds ONE evaporator evenly — it doesn\'t create multiple temperatures.']},
{n:246,p:7,t:'mc',q:'A refrigeration system that utilized a type A2 refrigerant needs to have the relief device piped to the outside if the system contains:',o:['all are required to be piped outside','6.6 lbs of refrigerant or more','50 lbs of refrigerant or more','110 lbs of refrigerant or more'],a:1,ex:['Incorrect. Ensuring sufficient gas flow to the compressor is not the EPR\'s function — that\'s determined by system design and charge.','CORRECT — The EPR (Evaporator Pressure Regulator) holds a MINIMUM evaporator pressure. In a two-temperature system, the EPR prevents the warmer evaporator from being pulled down too cold by the compressor that\'s trying to satisfy the coldest evaporator. It acts as a minimum pressure \'floor.\'','Incorrect. The EPR and TXV serve completely different functions — the TXV meters refrigerant, the EPR maintains minimum evaporator pressure.','Incorrect. Only option B is correct.']},
{n:247,p:1,t:'mc',q:'How many tons of refrigeration is required if we want to freeze 7000 pounds of a product in one (1) hour?  Product freeze point is 26 degrees F, latent heat of fusion is 123 BTU\'s/lb., specific heat thawed is 0.87, and specific heat frozen is 0.42.  The product enters at 45 degrees F and it will be stored at -10 degrees F.',o:['1,082,550 tons','88.64 tons','90.21 tons','72.17 tons','1,063,650 tons','70.91 tons','none of the above are correct'],a:2,ex:['Incorrect. Correct: 90.21 tons','Incorrect. Correct: 90.21 tons','CORRECT — 90.21 tons','Incorrect. Correct: 90.21 tons','Incorrect. Correct: 90.21 tons','Incorrect. Correct: 90.21 tons','Incorrect. Correct: 90.21 tons']},
{n:248,p:5,t:'mc',q:'Match the definition to the term. What is: Ambient temperature?',o:['Heat that causes a measurable temperature change','Temperature of air surrounding a unit','Changing from a liquid to a vapor by heating','Changing from a liquid to a vapor at low temperatures and pressures'],a:1,ex:['Incorrect. This is the definition of Sensible heat, not Ambient temperature.','CORRECT — Ambient temperature = Temperature of air surrounding a unit','Incorrect. This is the definition of Vaporization, not Ambient temperature.','Incorrect. This is the definition of Evaporation, not Ambient temperature.']},
{n:249,p:1,t:'mc',q:'Match the definition to the term. What is: BTU?',o:['Heat that causes a change of state without temperature change','The amount of heat required to raise one pound of WATER one degree F','The amount of heat required to raise one pound of a SUBSTANCE one degree F','Heat transfer by fluid movement such as air or liquid currents'],a:1,ex:['Incorrect. This is the definition of Latent heat, not BTU.','CORRECT — BTU = The amount of heat required to raise one pound of WATER one degree F','Incorrect. This is the definition of Specific heat, not BTU.','Incorrect. This is the definition of Convection, not BTU.']},
